<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Irfan Ali</title>
<script>
  // Pages that moved. Old path → new path.
  const moved = {
    "p/media/espresso-bench": "p/random/espresso-bench/",
    "p/hello-world.html": "p/random/hello-world.html",
    "p/hello-world": "p/random/hello-world.html",
  };
  const rel = location.pathname.replace(/^\/(sites\/)?/, "").replace(/\/(index\.html)?$/, "");
  if (moved[rel]) location.replace("/" + moved[rel]);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
