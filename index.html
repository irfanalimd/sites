<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1d1d1b; --muted: #6b6a66; --line: #e6e3dd; --accent: #2f5d50; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecebe7; --muted: #9a9892; --line: #2c2b29; --accent: #8cc7b2; --card: #1c1c1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sub a { color: var(--accent); }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--fg); background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; margin-bottom: 20px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 4px;
         border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  li a:hover .t { color: var(--accent); }
  .t { font-weight: 550; }
  .s { color: var(--muted); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<main>
  <h1>Sites</h1>
  <p class="sub">Reports, explainers, and exercises. Agents: see <a href="llms.txt">llms.txt</a>.</p>
  <input id="q" type="search" placeholder="Filter…" aria-label="Filter pages">
  <ul id="list"><li class="empty">Loading…</li></ul>
</main>
<script>
  const OWNER = "irfanalimd", REPO = "sites";
  const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const list = document.getElementById("list");
  let pages = [];

  function render(filter = "") {
    const f = filter.toLowerCase();
    const shown = pages.filter(p => (p.title + " " + p.slug).toLowerCase().includes(f));
    list.innerHTML = "";
    if (!shown.length) { list.innerHTML = `<li class="empty">${pages.length ? "No matches." : "Nothing published yet."}</li>`; return; }
    for (const p of shown) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = `p/${p.slug}.html`;
      a.innerHTML = `<span><div class="t"></div><div class="s"></div></span><span class="d"></span>`;
      a.querySelector(".t").textContent = p.title;
      a.querySelector(".s").textContent = p.slug;
      a.querySelector(".d").textContent = p.date ? p.date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
      li.appendChild(a); list.appendChild(li);
    }
  }

  async function load() {
    const [files, commits] = await Promise.all([
      fetch(`${api}/contents/p?ref=main`).then(r => r.ok ? r.json() : []),
      fetch(`${api}/commits?path=p&per_page=100`).then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    // Dates come from "publish: <slug>" commit messages; newest commit wins.
    const dates = {};
    for (const c of commits) {
      const m = /^publish:\s*(\S+)/.exec(c.commit?.message || "");
      if (m && !dates[m[1]]) dates[m[1]] = new Date(c.commit.author.date);
    }
    pages = (Array.isArray(files) ? files : [])
      .filter(f => f.type === "file" && f.name.endsWith(".html"))
      .map(f => { const slug = f.name.slice(0, -5); return { slug, title: slug, date: dates[slug] }; });
    pages.sort((a, b) => (b.date || 0) - (a.date || 0) || a.slug.localeCompare(b.slug));
    render();
    // Pull each page's <title> from the same origin (no API rate limit).
    await Promise.all(pages.map(async p => {
      try {
        const html = await fetch(`p/${p.slug}.html`).then(r => r.text());
        const t = new DOMParser().parseFromString(html, "text/html").title.trim();
        if (t) p.title = t;
      } catch {}
    }));
    render(document.getElementById("q").value);
  }

  document.getElementById("q").addEventListener("input", e => render(e.target.value));
  load().catch(() => { list.innerHTML = `<li class="empty">Couldn't load the list (GitHub API limit?). Try again shortly.</li>`; });
</script>
</body>
</html>
