<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irfan Ali — Index</title>
<meta name="description" content="Learning notes, research, and other experiments by Irfan Ali. Guided by a human, written by a machine.">
<meta property="og:title" content="Irfan Ali — Index">
<meta property="og:description" content="Learning notes, research, and other experiments. Guided by a human, written by a machine.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --ink: #111111;
    --ink-2: #555555;
    --muted: #9a9a98;
    --line: #e7e7e4;
    --hover: #f2f2f0;
    --sans: Geist, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --ink: #f2f2f0; --ink-2: #a8a8a6; --muted: #6b6b6a; --line: #1f1f21; --hover: #141416; }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }

  /* One narrow column, exactly one screen tall. Spacing scales with screen height so the home view never scrolls. */
  .col {
    max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(16px, 4vh, 64px) 0; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }

  header { display: flex; justify-content: space-between; align-items: baseline; padding: clamp(16px, 4vh, 32px) 0 0; }
  .name { font-weight: 500; letter-spacing: -0.01em; }
  header a:not(.name) { color: var(--muted); transition: color .15s; }
  header a:hover { color: var(--ink); }

  h1 {
    font-weight: 400; font-size: clamp(36px, min(10vw, 6.4vh), 56px); line-height: 1.02; letter-spacing: -0.045em;
    margin: 0 0 clamp(20px, 5vh, 64px);
  }
  h1 span { color: var(--muted); }

  /* Home: the four doors. */
  .doors { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .doors li { border-bottom: 1px solid var(--line); }
  .door {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 16px;
    padding: clamp(10px, 2vh, 20px) 0; position: relative;
  }
  .door::before, .row::before {
    content: ""; position: absolute; inset: 0 -14px; border-radius: 6px;
    background: var(--hover); opacity: 0; transition: opacity .2s; z-index: -1;
  }
  .door:hover::before, .row:hover::before { opacity: 1; }
  .door:focus-visible, .row:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
  .door b { font-weight: 400; font-size: clamp(22px, 3.4vh, 28px); letter-spacing: -0.03em; line-height: 1.15; }
  .door b sup { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 6px; vertical-align: 12px; letter-spacing: 0; }
  .door small { grid-column: 1; color: var(--muted); font-size: 14px; }
  .door i, .row i { font-style: normal; color: var(--muted); transition: transform .2s, color .2s; }
  .door i { grid-row: 1 / span 2; grid-column: 2; }
  .door:hover i, .row:hover i { transform: translateX(3px); color: var(--ink); }

  /* Category view. */
  .back { color: var(--muted); display: inline-block; margin-bottom: clamp(20px, 4vh, 40px); transition: color .15s; }
  .back:hover { color: var(--ink); }
  h2 {
    font-weight: 400; font-size: clamp(36px, 10vw, 52px); line-height: 1; letter-spacing: -0.045em;
    margin: 0 0 clamp(24px, 4vh, 40px); display: flex; justify-content: space-between; align-items: baseline;
  }
  h2 .mono { color: var(--muted); letter-spacing: .03em; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .list li { border-bottom: 1px solid var(--line); animation: rise .35s ease both; }
  .row { display: block; padding: 20px 0; position: relative; }
  .row span:first-child { display: flex; justify-content: space-between; gap: 16px; font-size: 19px; letter-spacing: -0.02em; line-height: 1.3; }
  .row .meta { display: block; color: var(--muted); margin-top: 6px; }
  .empty { padding: 40px 0; color: var(--muted); }
  main#cat { justify-content: flex-start; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .list li { animation: none; } }

  footer { padding: 0 0 max(clamp(20px, 4vh, 36px), env(safe-area-inset-bottom)); }
  .sign { font: italic 400 clamp(24px, min(7vw, 4.2vh), 34px)/1.08 var(--serif); margin: 0 0 clamp(12px, 3vh, 28px); }
  .sign span { color: var(--muted); }
  .base { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--line); }
  .base a:hover { color: var(--ink); }
  /* Short screens (small phones, landscape): drop the descriptions so the four rows still fit. */
  @media (max-height: 680px) { .door small { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="col">
  <header>
    <a class="name" href="./">Irfan Ali</a>
    <a href="https://github.com/irfanalimd/sites">GitHub</a>
  </header>

  <main id="home">
    <h1>Learning, research <span>&amp; other experiments.</span></h1>
    <ul class="doors" id="doors"></ul>
  </main>

  <main id="cat" hidden>
    <a class="back mono" href="#">← Index</a>
    <h2><span id="cat-title"></span><span class="mono" id="cat-count"></span></h2>
    <ol class="list" id="list" aria-live="polite"></ol>
  </main>

  <footer>
    <p class="sign" id="sign">Guided by a human.<br><span>Written by a machine.</span></p>
    <div class="base mono">
      <span>© <span id="yr"></span> Irfan Ali</span>
      <a href="llms.txt">llms.txt</a>
    </div>
  </footer>
</div>
<script>
  const OWNER = "irfanalimd", REPO = "sites";
  const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const CATEGORIES = {
    learning: "Explainers, tutorials & exercises",
    research: "Reports, reviews & analyses",
    random:   "Experiments & everything else",
  };
  const VIEWS = { ...CATEGORIES, all: "Everything, newest first" };
  const label = c => c[0].toUpperCase() + c.slice(1);
  let pages = [], loaded = false;
  document.getElementById("yr").textContent = new Date().getFullYear();

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fmt = d => d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  const inView = v => pages.filter(p => v === "all" || p.cat === v);

  function renderHome() {
    const ul = document.getElementById("doors");
    ul.replaceChildren();
    for (const [v, desc] of Object.entries(VIEWS)) {
      const a = el("a", "door"); a.href = `#${v}`;
      const b = el("b", null, label(v));
      if (loaded) b.append(el("sup", null, String(inView(v).length)));
      a.append(b, el("i", null, "→"), el("small", null, desc));
      const li = el("li"); li.append(a); ul.append(li);
    }
  }

  function renderCat(v) {
    const shown = inView(v);
    document.getElementById("cat-title").textContent = label(v);
    document.getElementById("cat-count").textContent = loaded ? String(shown.length).padStart(2, "0") : "";
    const list = document.getElementById("list");
    list.replaceChildren();
    if (!loaded) { list.append(el("li", "empty", "Loading…")); return; }
    if (!shown.length) { list.append(el("li", "empty", "Nothing here yet.")); return; }
    shown.forEach((p, i) => {
      const li = el("li"); li.style.animationDelay = `${Math.min(i, 10) * 30}ms`;
      const a = el("a", "row"); a.href = p.url;
      const t = el("span", null, p.title); t.append(el("i", null, "→"));
      const meta = [v === "all" ? label(p.cat) : null, fmt(p.date)].filter(Boolean).join(" · ");
      a.append(t, el("span", "meta mono", meta));
      li.append(a); list.append(li);
    });
  }

  // #learning, #research, #random, #all open a list; anything else is the home view. Back button works.
  function route() {
    const v = location.hash.slice(1);
    const isCat = v in VIEWS;
    document.getElementById("home").hidden = isCat;
    document.getElementById("cat").hidden = !isCat;
    document.getElementById("sign").hidden = isCat;
    document.title = isCat ? `${label(v)} — Irfan Ali` : "Irfan Ali — Index";
    isCat ? renderCat(v) : renderHome();
    window.scrollTo(0, 0);
  }

  async function load() {
    const [tree, commits] = await Promise.all([
      fetch(`${api}/git/trees/main?recursive=1`).then(r => { if (!r.ok) throw r; return r.json(); }),
      fetch(`${api}/commits?path=p&per_page=100`).then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    // Dates come from "publish: <category>/<slug>" commit messages; newest commit wins.
    const dates = {};
    for (const c of commits) {
      const m = /^publish:\s*(\S+)/.exec(c.commit?.message || "");
      if (m && !dates[m[1]]) dates[m[1]] = new Date(c.commit.author.date);
    }
    // Any .html under p/<category>/, at any depth. A folder's index.html is linked as the folder.
    pages = tree.tree
      .filter(f => f.type === "blob" && f.path.startsWith("p/") && f.path.endsWith(".html"))
      .map(f => {
        const slug = f.path.slice(2).replace(/(\/index)?\.html$/, "");
        const top = slug.split("/")[0];
        const cat = top in CATEGORIES ? top : "random";
        const url = f.path.endsWith("/index.html") ? f.path.slice(0, -10) : f.path;
        return { slug, cat, url, path: f.path, title: slug.split("/").pop(), date: dates[slug] };
      });
    // Pull each page's <title> from the same origin (no API rate limit).
    const titles = pages.map(async p => {
      try {
        const html = await fetch(p.url).then(r => r.text());
        const t = new DOMParser().parseFromString(html, "text/html").title.trim();
        if (t) p.title = t;
      } catch {}
    });
    // Pages uploaded without a "publish:" commit message: look up their last commit (capped to spare the API limit).
    const undated = pages.filter(p => !p.date).slice(0, 10).map(async p => {
      try {
        const [c] = await fetch(`${api}/commits?path=${encodeURIComponent(p.path)}&per_page=1`).then(r => r.ok ? r.json() : []);
        if (c) p.date = new Date(c.commit.author.date);
      } catch {}
    });
    await Promise.all([...titles, ...undated]);
    pages.sort((a, b) => (b.date || 0) - (a.date || 0) || a.title.localeCompare(b.title));
    loaded = true;
    route();
  }

  addEventListener("hashchange", route);
  route();
  load().catch(() => {
    loaded = true; pages = [];
    route();
    const list = document.getElementById("list");
    if (!document.getElementById("cat").hidden) list.replaceChildren(el("li", "empty", "Couldn’t load right now. Try again in a few minutes."));
  });
</script>
</body>
</html>
