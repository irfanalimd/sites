<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irfan Ali — Index</title>
<meta name="description" content="Learning notes, research, and other experiments by Irfan Ali. Guided by a human, written by a machine.">
<meta property="og:title" content="Irfan Ali — Index">
<meta property="og:description" content="Learning notes, research, and other experiments. Guided by a human, written by a machine.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --ink: #111111;
    --ink-2: #555555;
    --muted: #9a9a98;
    --line: #e7e7e4;
    --hover: #f2f2f0;
    --sans: Geist, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --ink: #f2f2f0; --ink-2: #a8a8a6; --muted: #6b6b6a; --line: #1f1f21; --hover: #141416; }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: center; padding: 32px 0; }
  .name { font-weight: 500; letter-spacing: -0.01em; }
  header nav { display: flex; gap: 28px; color: var(--ink-2); }
  header nav a:hover { color: var(--ink); }

  /* Statement */
  .statement { padding: 120px 0 112px; }
  h1 {
    font-weight: 400; font-size: clamp(40px, 6.4vw, 84px); line-height: 1; letter-spacing: -0.045em;
    margin: 0; max-width: 13ch;
  }
  h1 span { color: var(--muted); }

  /* Controls */
  .controls {
    display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 0 0 20px; border-bottom: 1px solid var(--ink);
  }
  .filters, .sorts { display: flex; gap: 22px; align-items: center; }
  .filters button, .sorts button { color: var(--muted); transition: color .15s; }
  .filters button:hover, .sorts button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"], .sorts button[aria-pressed="true"] { color: var(--ink); }
  .filters sup { font-family: var(--mono); font-size: 10px; margin-left: 3px; vertical-align: 6px; }
  .sorts .label { color: var(--muted); }
  .search {
    width: 120px; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid transparent;
    padding: 2px 0; transition: border-color .15s, width .2s;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-bottom-color: var(--ink); width: 180px; }

  /* Index */
  .head, .row { display: grid; grid-template-columns: 56px 1fr 160px 110px 24px; align-items: baseline; gap: 16px; }
  .head { color: var(--muted); padding: 14px 0; border-bottom: 1px solid var(--line); }
  .group { padding: 48px 0 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .group h2 { margin: 0; font-weight: 500; font-size: 15px; }
  .row { padding: 22px 0; border-bottom: 1px solid var(--line); position: relative; transition: padding .25s ease; }
  .row::before { content: ""; position: absolute; inset: 0 -16px; background: var(--hover); opacity: 0; transition: opacity .2s; z-index: -1; border-radius: 4px; }
  .row:hover::before { opacity: 1; }
  .row:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  .num, .cat, .date { color: var(--muted); }
  .title { font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; }
  .arrow { color: var(--muted); opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .2s; justify-self: end; }
  .row:hover .arrow { opacity: 1; transform: none; color: var(--ink); }
  .row:hover .num { color: var(--ink); }
  .empty { padding: 56px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
  #list { position: relative; z-index: 0; min-height: 200px; }
  #list.loading { opacity: .4; }

  /* Footer */
  footer { padding: 160px 0 48px; }
  .sign { font: italic 400 clamp(32px, 4.4vw, 56px)/1.05 var(--serif); letter-spacing: -0.01em; margin: 0 0 64px; }
  .sign span { color: var(--muted); }
  .base { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); padding-top: 20px; border-top: 1px solid var(--line); }
  .base a:hover { color: var(--ink); }

  @media (max-width: 760px) {
    .wrap { padding: 0 20px; }
    .statement { padding: 72px 0 64px; }
    .head { display: none; }
    .row { grid-template-columns: 1fr auto; gap: 6px 16px; padding: 20px 0; }
    .num { display: none; }
    .title { grid-column: 1 / -1; font-size: 18px; }
    .cat { grid-row: 2; }
    .date { grid-row: 2; justify-self: end; }
    .arrow { display: none; }
    .controls { flex-direction: column; align-items: flex-start; gap: 14px; }
    .search, .search:focus { width: 100%; }
    footer { padding-top: 112px; }
  }
  @media (max-width: 380px) { .filters { gap: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="name" href="./">Irfan Ali</a>
    <nav>
      <a href="https://github.com/irfanalimd/sites">GitHub</a>
      <a href="llms.txt">llms.txt</a>
    </nav>
  </header>

  <section class="statement">
    <h1>Learning, research <span>&amp; other experiments.</span></h1>
  </section>

  <main>
    <div class="controls">
      <div class="filters" role="group" aria-label="Category" id="filters"></div>
      <div class="sorts" role="group" aria-label="Sort">
        <input class="search" id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
        <span class="label">Sort</span>
        <button data-sort="date" aria-pressed="true">Date</button>
        <button data-sort="category" aria-pressed="false">Category</button>
      </div>
    </div>
    <div class="head mono" aria-hidden="true"><span>No.</span><span>Title</span><span>Category</span><span>Date</span><span></span></div>
    <div id="list" class="loading"></div>
  </main>

  <footer>
    <p class="sign">Guided by a human.<br><span>Written by a machine.</span></p>
    <div class="base mono">
      <span>© <span id="yr"></span> Irfan Ali</span>
      <a href="llms.txt">Published from conversation ↗</a>
    </div>
  </footer>
</div>
<script>
  const OWNER = "irfanalimd", REPO = "sites";
  const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const CATEGORIES = ["learning", "research", "random"];
  const label = c => c[0].toUpperCase() + c.slice(1);
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  let pages = [];
  let state = { cat: "all", sort: "date" };
  document.getElementById("yr").textContent = new Date().getFullYear();

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fmt = d => d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "—";
  const byDate = (a, b) => (b.date || 0) - (a.date || 0) || a.title.localeCompare(b.title);

  function renderFilters() {
    const box = document.getElementById("filters");
    box.replaceChildren();
    for (const c of ["all", ...CATEGORIES]) {
      const n = c === "all" ? pages.length : pages.filter(p => p.cat === c).length;
      const b = el("button", null, c === "all" ? "All" : label(c));
      b.append(el("sup", null, String(n)));
      b.setAttribute("aria-pressed", String(state.cat === c));
      b.onclick = () => { state.cat = c; history.replaceState(null, "", c === "all" ? location.pathname : `#${c}`); renderFilters(); render(); };
      box.append(b);
    }
  }

  function row(p, i) {
    const a = el("a", "row"); a.href = p.url;
    a.append(
      el("span", "num mono", String(i + 1).padStart(2, "0")),
      el("span", "title", p.title),
      el("span", "cat mono", label(p.cat)),
      el("span", "date mono", fmt(p.date)),
      el("span", "arrow", "→"),
    );
    return a;
  }

  function render() {
    const f = q.value.trim().toLowerCase();
    const shown = pages
      .filter(p => state.cat === "all" || p.cat === state.cat)
      .filter(p => !f || (p.title + " " + p.slug).toLowerCase().includes(f))
      .sort(byDate);
    list.replaceChildren();
    if (!shown.length) {
      list.append(el("p", "empty", f ? "Nothing matches that search." : "Nothing here yet."));
      return;
    }
    if (state.sort === "category") {
      let i = 0;
      for (const c of CATEGORIES) {
        const group = shown.filter(p => p.cat === c);
        if (!group.length) continue;
        const g = el("div", "group");
        g.append(el("h2", null, label(c)), el("span", "mono", String(group.length).padStart(2, "0")));
        list.append(g, ...group.map(p => row(p, i++)));
      }
    } else {
      list.append(...shown.map(row));
    }
  }

  async function load() {
    const [tree, commits] = await Promise.all([
      fetch(`${api}/git/trees/main?recursive=1`).then(r => { if (!r.ok) throw r; return r.json(); }),
      fetch(`${api}/commits?path=p&per_page=100`).then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    // Dates come from "publish: <category>/<slug>" commit messages; newest commit wins.
    const dates = {};
    for (const c of commits) {
      const m = /^publish:\s*(\S+)/.exec(c.commit?.message || "");
      if (m && !dates[m[1]]) dates[m[1]] = new Date(c.commit.author.date);
    }
    // Any .html under p/<category>/, at any depth. A folder's index.html is linked as the folder.
    pages = tree.tree
      .filter(f => f.type === "blob" && f.path.startsWith("p/") && f.path.endsWith(".html"))
      .map(f => {
        const slug = f.path.slice(2).replace(/(\/index)?\.html$/, "");
        const top = slug.split("/")[0];
        const cat = CATEGORIES.includes(top) ? top : "random";
        const url = f.path.endsWith("/index.html") ? f.path.slice(0, -10) : f.path;
        return { slug, cat, url, path: f.path, title: slug.split("/").pop(), date: dates[slug] };
      });
    // Pull each page's <title> from the same origin (no API rate limit).
    const titles = pages.map(async p => {
      try {
        const html = await fetch(p.url).then(r => r.text());
        const t = new DOMParser().parseFromString(html, "text/html").title.trim();
        if (t) p.title = t;
      } catch {}
    });
    // Pages uploaded without a "publish:" commit message: look up their last commit (capped to spare the API limit).
    const undated = pages.filter(p => !p.date).slice(0, 10).map(async p => {
      try {
        const [c] = await fetch(`${api}/commits?path=${encodeURIComponent(p.path)}&per_page=1`).then(r => r.ok ? r.json() : []);
        if (c) p.date = new Date(c.commit.author.date);
      } catch {}
    });
    await Promise.all([...titles, ...undated]);
    list.classList.remove("loading");
    renderFilters(); render();
  }

  const hash = location.hash.slice(1);
  if (CATEGORIES.includes(hash)) state.cat = hash;
  renderFilters();
  document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    state.sort = b.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  q.addEventListener("input", render);
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape" && document.activeElement === q) { q.value = ""; render(); q.blur(); }
  });
  load().catch(() => {
    list.classList.remove("loading");
    list.replaceChildren(el("p", "empty", "Couldn’t load the index right now (GitHub API limit). Try again in a few minutes."));
  });
</script>
</body>
</html>
