<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irfan Ali — Index</title>
<meta name="description" content="Learning notes, research, and other experiments by Irfan Ali. Guided by a human, written by a machine.">
<meta property="og:title" content="Irfan Ali — Index">
<meta property="og:description" content="Learning notes, research, and other experiments. Guided by a human, written by a machine.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --ink: #111111;
    --ink-2: #555555;
    --muted: #9a9a98;
    --line: #e7e7e4;
    --hover: #f2f2f0;
    --sans: Geist, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --ink: #f2f2f0; --ink-2: #a8a8a6; --muted: #6b6b6a; --line: #1f1f21; --hover: #141416; }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* One narrow column everywhere: reads like a phone screen, even on a desktop. */
  .col {
    max-width: 560px; margin: 0 auto;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
  }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }

  header { display: flex; justify-content: space-between; align-items: baseline; padding: 32px 0 0; }
  .name { font-weight: 500; letter-spacing: -0.01em; }
  header a:not(.name) { color: var(--muted); transition: color .15s; }
  header a:hover { color: var(--ink); }

  h1 {
    font-weight: 400; font-size: clamp(40px, 11vw, 56px); line-height: 1.02; letter-spacing: -0.045em;
    margin: 96px 0 72px;
  }
  h1 span { color: var(--muted); }

  /* Category tabs: the only control. Sticks to the top while scrolling. */
  nav.tabs {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    display: flex; gap: 24px; padding: 16px 0 14px; border-bottom: 1px solid var(--ink);
    overflow-x: auto; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tabs button { color: var(--muted); white-space: nowrap; transition: color .15s; padding: 4px 0; }
  .tabs button:hover, .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs sup { font-family: var(--mono); font-size: 10px; margin-left: 3px; vertical-align: 7px; }

  ol { list-style: none; margin: 0; padding: 0; min-height: 180px; }
  li { border-bottom: 1px solid var(--line); animation: rise .35s ease both; }
  .row { display: block; padding: 22px 0; position: relative; }
  .row::before {
    content: ""; position: absolute; inset: 0 -14px; border-radius: 6px;
    background: var(--hover); opacity: 0; transition: opacity .2s; z-index: -1;
  }
  .row:hover::before { opacity: 1; }
  .row:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
  .title { display: flex; justify-content: space-between; gap: 16px; font-size: 19px; letter-spacing: -0.02em; line-height: 1.3; }
  .title i { font-style: normal; color: var(--muted); transition: transform .2s, color .2s; }
  .row:hover .title i { transform: translateX(3px); color: var(--ink); }
  .meta { display: block; color: var(--muted); margin-top: 8px; }
  .empty { padding: 48px 0; color: var(--muted); }
  ol.loading li { animation: none; }
  .skel { height: 92px; border-bottom: 1px solid var(--line); }
  .skel::after {
    content: ""; display: block; width: 55%; height: 14px; margin-top: 30px; border-radius: 3px;
    background: linear-gradient(90deg, var(--line), var(--hover), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { li, .skel::after { animation: none; } }

  footer { padding: 144px 0 max(40px, env(safe-area-inset-bottom)); }
  .sign { font: italic 400 clamp(34px, 9vw, 44px)/1.05 var(--serif); margin: 0 0 56px; }
  .sign span { color: var(--muted); }
  .base { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); padding-top: 18px; border-top: 1px solid var(--line); }
  .base a:hover { color: var(--ink); }

  @media (min-width: 900px) { h1 { margin: 128px 0 96px; } }
</style>
</head>
<body>
<div class="col">
  <header>
    <a class="name" href="./">Irfan Ali</a>
    <a href="https://github.com/irfanalimd/sites">GitHub</a>
  </header>

  <h1>Learning, research <span>&amp; other experiments.</span></h1>

  <main>
    <nav class="tabs" role="tablist" aria-label="Category" id="tabs"></nav>
    <ol id="list" class="loading" aria-live="polite"><li class="skel"></li><li class="skel"></li><li class="skel"></li></ol>
  </main>

  <footer>
    <p class="sign">Guided by a human.<br><span>Written by a machine.</span></p>
    <div class="base mono">
      <span>© <span id="yr"></span> Irfan Ali</span>
      <a href="llms.txt">llms.txt</a>
    </div>
  </footer>
</div>
<script>
  const OWNER = "irfanalimd", REPO = "sites";
  const api = `https://api.github.com/repos/${OWNER}/${REPO}`;
  const CATEGORIES = ["learning", "research", "random"];
  const label = c => c[0].toUpperCase() + c.slice(1);
  const list = document.getElementById("list");
  let pages = [];
  let current = CATEGORIES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "all";
  document.getElementById("yr").textContent = new Date().getFullYear();

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fmt = d => d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";

  function renderTabs() {
    const box = document.getElementById("tabs");
    box.replaceChildren();
    for (const c of ["all", ...CATEGORIES]) {
      const n = c === "all" ? pages.length : pages.filter(p => p.cat === c).length;
      const b = el("button", null, c === "all" ? "All" : label(c));
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(current === c));
      if (pages.length) b.append(el("sup", null, String(n)));
      b.onclick = () => {
        current = c;
        history.replaceState(null, "", c === "all" ? location.pathname : `#${c}`);
        renderTabs(); render();
      };
      box.append(b);
    }
  }

  // Newest first. Category shown on each row in "All"; tabs narrow it down.
  function render() {
    const shown = pages.filter(p => current === "all" || p.cat === current);
    list.replaceChildren();
    if (!shown.length) { list.append(el("li", "empty", "Nothing here yet.")); return; }
    shown.forEach((p, i) => {
      const li = el("li"); li.style.animationDelay = `${Math.min(i, 10) * 30}ms`;
      const a = el("a", "row"); a.href = p.url;
      const t = el("span", "title", p.title); t.append(el("i", null, "→"));
      const meta = [current === "all" ? label(p.cat) : null, fmt(p.date)].filter(Boolean).join(" · ");
      a.append(t, el("span", "meta mono", meta));
      li.append(a); list.append(li);
    });
  }

  async function load() {
    const [tree, commits] = await Promise.all([
      fetch(`${api}/git/trees/main?recursive=1`).then(r => { if (!r.ok) throw r; return r.json(); }),
      fetch(`${api}/commits?path=p&per_page=100`).then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    // Dates come from "publish: <category>/<slug>" commit messages; newest commit wins.
    const dates = {};
    for (const c of commits) {
      const m = /^publish:\s*(\S+)/.exec(c.commit?.message || "");
      if (m && !dates[m[1]]) dates[m[1]] = new Date(c.commit.author.date);
    }
    // Any .html under p/<category>/, at any depth. A folder's index.html is linked as the folder.
    pages = tree.tree
      .filter(f => f.type === "blob" && f.path.startsWith("p/") && f.path.endsWith(".html"))
      .map(f => {
        const slug = f.path.slice(2).replace(/(\/index)?\.html$/, "");
        const top = slug.split("/")[0];
        const cat = CATEGORIES.includes(top) ? top : "random";
        const url = f.path.endsWith("/index.html") ? f.path.slice(0, -10) : f.path;
        return { slug, cat, url, path: f.path, title: slug.split("/").pop(), date: dates[slug] };
      });
    // Pull each page's <title> from the same origin (no API rate limit).
    const titles = pages.map(async p => {
      try {
        const html = await fetch(p.url).then(r => r.text());
        const t = new DOMParser().parseFromString(html, "text/html").title.trim();
        if (t) p.title = t;
      } catch {}
    });
    // Pages uploaded without a "publish:" commit message: look up their last commit (capped to spare the API limit).
    const undated = pages.filter(p => !p.date).slice(0, 10).map(async p => {
      try {
        const [c] = await fetch(`${api}/commits?path=${encodeURIComponent(p.path)}&per_page=1`).then(r => r.ok ? r.json() : []);
        if (c) p.date = new Date(c.commit.author.date);
      } catch {}
    });
    await Promise.all([...titles, ...undated]);
    pages.sort((a, b) => (b.date || 0) - (a.date || 0) || a.title.localeCompare(b.title));
    list.classList.remove("loading");
    renderTabs(); render();
  }

  renderTabs();
  load().catch(() => {
    list.classList.remove("loading");
    list.replaceChildren(el("li", "empty", "Couldn’t load the index right now. Try again in a few minutes."));
  });
</script>
</body>
</html>
