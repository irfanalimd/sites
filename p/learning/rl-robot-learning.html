  const root = setMain(`
  <header class="card mod-hero p${part.id}">
    <div class="kicker"><span class="badge">${pad2(m.num)}</span><span>Part ${part.id} · ${esc(part.title)}</span>${phases.map(p => `<span class="chip">${esc(p.name.split("·")[0].trim())}</span>`).join("")}</div>
    <h1>${m.title}</h1>
    <p class="sub">${m.subtitle || ""}</p>
    <div class="mod-meta"><span class="chip">~${m.minutes || 30} min</span><span class="chip">${m.sections.length} lessons</span><span class="chip">${(m.quiz || []).length} quiz questions</span><span class="chip">${(m.flashcards || []).length} flashcards</span><span class="chip" id="mod-pct"></span></div>
    ${m.objectives ? `<div class="objectives"><h4>By the end you can</h4><ul>${m.objectives.map(o => `<li>${o}</li>`).join("")}</ul></div>` : ""}
  </header>
  <div class="mod-layout p${part.id}">
    <div class="mod-main">
      ${sections}
      ${sc ? `<section class="card block" id="s-selfcheck"><h2>Explain it without notes</h2><p class="muted">Say the answer out loud (or write it) before opening each one. This is the "done when" test from your plan.</p>${sc}</section>` : ""}
      ${(m.quiz || []).length ? `<section class="card block" id="s-quiz"><h2><span>Quiz</span><span class="score-line" id="qscore"></span></h2><p class="muted">Graded instantly. Your latest answer to each question counts toward module progress.</p><div id="quiz"></div><div class="q-actions"><button type="button" class="btn small" id="qreset">Clear my answers</button></div></section>` : ""}
      ${(m.flashcards || []).length ? `<section class="card block" id="s-cards"><div class="deck-cta"><div><h2 style="margin:0">Flashcards</h2><p class="muted" style="margin:4px 0 0">${m.flashcards.length} cards for this module · <span id="mod-known"></span></p></div><a class="btn accent" href="#/cards/${m.id}">Drill this deck →</a></div></section>` : ""}
      ${links ? `<section class="card block" id="s-links"><h2>Go deeper</h2><ul class="links">${links}</ul></section>` : ""}
      <nav class="pager">${prev ? `<a class="card" href="#/m/${prev.id}"><small>← Previous</small><b>${pad2(prev.num)} · ${prev.title}</b></a>` : "<span></span>"}${next ? `<a class="card next" href="#/m/${next.id}"><small>Next →</small><b>${pad2(next.num)} · ${next.title}</b></a>` : `<a class="card next" href="#/quiz"><small>Finished →</small><b>Exam mode</b></a>`}</nav>
    </div>
    <aside class="card toc"><h4>In this module</h4><ol>${m.sections.map((s, i) => `<li><a href="#s-${s.id}" data-toc="${s.id}"><span class="ck">○</span><span>${m.num}.${i + 1} ${s.title}</span></a></li>`).join("")}
      ${sc ? `<li><a href="#s-selfcheck"><span class="ck">?</span><span>Explain it</span></a></li>` : ""}${(m.quiz || []).length ? `<li><a href="#s-quiz"><span class="ck">✓</span><span>Quiz</span></a></li>` : ""}</ol><div class="bar"><span id="toc-bar"></span></div></aside>
  </div>`, m.title.replace(/<[^>]+>/g, ""));

  function paintProgress() {
    const s = modStats(m);
    $("#mod-pct").textContent = s.done ? "Done ✓" : `${pct(s.progress)}% complete`;
    $("#mod-pct").classList.toggle("on", s.done);
    $("#toc-bar").style.width = pct(s.progress) + "%";
    const mk = $("#mod-known"); if (mk) mk.textContent = `${s.known} known`;
    for (const b of $$("[data-mark]", root)) {
      const on = !!S.read[`${m.id}/${b.dataset.mark}`];
      b.classList.toggle("on", on);
      b.querySelector(".box").textContent = on ? "✓" : "";
      b.lastElementChild.textContent = on ? "Understood" : "Mark as understood";
    }
    for (const a of $$("[data-toc]", root)) { const on = !!S.read[`${m.id}/${a.dataset.toc}`]; a.classList.toggle("read", on); a.querySelector(".ck").textContent = on ? "●" : "○"; }
    const qs = $("#qscore");
    if (qs) qs.innerHTML = `<span class="bar"><span style="width:${s.qs ? pct(s.correct / s.qs) : 0}%;background:var(--blue)"></span></span><span>${s.correct}/${s.qs}</span>`;
  }
  for (const b of $$("[data-mark]", root)) b.addEventListener("click", () => {
    const k = `${m.id}/${b.dataset.mark}`;
    S.read[k] ? delete S.read[k] : (S.read[k] = 1);
    S.last = k; save(); paintProgress();
  });
  for (const a of $$(".toc a", root)) a.addEventListener("click", e => { e.preventDefault(); $(a.getAttribute("href"))?.scrollIntoView({ behavior: "smooth" }); });
  const qhost = $("#quiz", root);
  if (qhost) {
    m.quiz.forEach((_, i) => renderQuestion(qhost, m, i, i + 1, { onAnswer: paintProgress }));
    $("#qreset").addEventListener("click", () => { m.quiz.forEach((_, i) => delete S.quiz[qid(m, i)]); save(); viewModule(id); });
  }
  mountWidgets(root, m);
  typeset(root);
  paintProgress();
  // highlight current section in the TOC
  const obs = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) {
      for (const a of $$("[data-toc]", root)) a.classList.toggle("cur", a.dataset.toc === e.target.dataset.sec);
    }
  }, { rootMargin: "-80px 0px -60% 0px" });
  $$(".lesson", root).forEach(s => obs.observe(s));
  if (secId) requestAnimationFrame(() => document.getElementById(`s-${secId}`)?.scrollIntoView());
  else window.scrollTo(0, 0);
}

/* exam mode */
let exam = null;
function viewQuiz() {
  const sel = new Set(JSON.parse(sessionGet("exam.sel") || "null") || mods.map(m => m.id));
  const weakOnly = sessionGet("exam.weak") === "1";
  const root = setMain(`<h1 class="page-title">Exam mode</h1><p class="page-lede">Mixed questions from the modules you pick, one at a time, shuffled. Answers also update each module's quiz score.</p>
    <section class="card pad exam-setup"><p class="overline">Modules</p><div class="chips" id="ex-mods">${mods.map(m => `<button type="button" class="chip ${sel.has(m.id) ? "on" : ""}" data-m="${m.id}">${pad2(m.num)} ${esc(m.short || m.title)}</button>`).join("")}</div>
    <div class="controls"><button type="button" class="btn small" id="ex-all">All</button><button type="button" class="btn small" id="ex-none">None</button>
      ${PARTS.map(p => `<button type="button" class="btn small" data-part="${p.id}">Part ${p.id}</button>`).join("")}
      <label class="ctl"><input type="checkbox" id="ex-weak" ${weakOnly ? "checked" : ""}> only questions I missed or haven't tried</label>
      <label class="ctl">Questions <select id="ex-n"><option>10</option><option selected>20</option><option>40</option><option value="999">All</option></select></label>
      <button type="button" class="btn primary" id="ex-go">Start →</button><span class="muted" id="ex-avail"></span></div></section>`, "Exam");
  const pool = () => {
    const out = [];
    for (const m of mods) if (sel.has(m.id)) (m.quiz || []).forEach((_, i) => { if (!$("#ex-weak").checked || !S.quiz[qid(m, i)]?.c) out.push([m, i]); });
    return out;
  };
  const paint = () => { for (const b of $$("[data-m]", root)) b.classList.toggle("on", sel.has(b.dataset.m)); $("#ex-avail").textContent = `${pool().length} questions available`; sessionSet("exam.sel", JSON.stringify([...sel])); sessionSet("exam.weak", $("#ex-weak").checked ? "1" : "0"); };
  for (const b of $$("[data-m]", root)) b.onclick = () => { sel.has(b.dataset.m) ? sel.delete(b.dataset.m) : sel.add(b.dataset.m); paint(); };
  $("#ex-all").onclick = () => { mods.forEach(m => sel.add(m.id)); paint(); };
  $("#ex-none").onclick = () => { sel.clear(); paint(); };
  for (const b of $$("[data-part]", root)) b.onclick = () => { sel.clear(); mods.filter(m => m.part === b.dataset.part).forEach(m => sel.add(m.id)); paint(); };
  $("#ex-weak").onchange = paint;
  $("#ex-go").onclick = () => {
    const p = pool();
    if (!p.length) return;
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    exam = { items: p.slice(0, +$("#ex-n").value), at: 0, results: [] };
    examStep();
  };
  paint();
}
function examStep() {
  const e = exam;
  if (e.at >= e.items.length) return examDone();
  const [m, i] = e.items[e.at];
  const root = setMain(`<section class="card exam-card"><div class="exam-top"><span>Question ${e.at + 1} of ${e.items.length}</span><span class="bar"><span style="width:${pct(e.at / e.items.length)}%"></span></span><a href="#/m/${m.id}">${pad2(m.num)} · ${esc(m.short || m.title)}</a></div><div id="exq"></div>
    <div class="q-actions" style="justify-content:space-between"><button type="button" class="btn small" id="ex-quit">End exam</button><button type="button" class="btn accent" id="ex-next" disabled>Next →</button></div></section>`, "Exam");
  let answered = null;
  renderQuestion($("#exq", root), m, i, e.at + 1, { numbered: false, onAnswer: ok => { if (answered === null) answered = ok; $("#ex-next").disabled = false; } });
  $("#ex-next").onclick = () => { e.results.push([m, i, answered]); e.at++; examStep(); window.scrollTo(0, 0); };
  $("#ex-quit").onclick = () => { e.items = e.items.slice(0, e.at); examDone(); };
}
function examDone() {
  const r = exam.results, ok = r.filter(x => x[2]).length;
  const missed = r.filter(x => !x[2]);
  const root = setMain(`<section class="card exam-card"><p class="overline">Result</p><div class="result-big">${ok} / ${r.length}</div><p class="muted">${r.length ? pct(ok / r.length) : 0}% correct on first try.</p>
    ${missed.length ? `<h3>Review these</h3><ul class="links">${missed.map(([m, i]) => `<li><a href="#/m/${m.id}" data-sec="quiz">${pad2(m.num)} · ${esc(m.short || m.title)}</a><small>${m.quiz[i].q.replace(/<[^>]+>/g, "").slice(0, 160)}</small></li>`).join("")}</ul>` : "<p>Clean sweep.</p>"}
    <div class="q-actions"><a class="btn primary" href="#/quiz" id="ex-again">New exam</a><a class="btn" href="#/">Dashboard</a></div></section>`, "Exam result");
  typeset(root);
  exam = null;
}
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }

/* flashcards */
function viewCards(mid) {
  const deckMods = mid && byId[mid] ? [byId[mid]] : mods;
  let unknownOnly = sessionGet("cards.unknown") !== "0";
  let deck = [], at = 0;
  const build = () => {
    deck = [];
    for (const m of deckMods) (m.flashcards || []).forEach((c, i) => { if (!unknownOnly || S.cards[qid(m, i)] !== 1) deck.push([m, i]); });
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    at = 0;
  };
  build();
  const title = mid && byId[mid] ? `Flashcards · ${byId[mid].short || byId[mid].title}` : "Flashcards";
  const root = setMain(`<h1 class="page-title">${esc(title)}</h1><p class="page-lede">Click the card (or press space) to flip. <kbd>←</kbd> again, <kbd>→</kbd> got it. Cards you know drop out of the deck.</p>
    <div class="controls" style="margin-bottom:6px"><label class="ctl">Deck <select id="fc-deck"><option value="">All modules</option>${mods.map(m => `<option value="${m.id}" ${m.id === mid ? "selected" : ""}>${pad2(m.num)} ${esc(m.short || m.title)}</option>`).join("")}</select></label>
    <label class="ctl"><input type="checkbox" id="fc-unknown" ${unknownOnly ? "checked" : ""}> hide cards I know</label><button type="button" class="btn small" id="fc-reset">Reset this deck</button></div>
    <div class="fc-wrap"><button type="button" class="fc" id="fc"><div class="fc-inner"><div class="fc-face front"></div><div class="fc-face back"></div></div></button>
    <div class="fc-controls"><button type="button" class="btn" id="fc-again">← Again</button><span class="fc-count" id="fc-count"></span><button type="button" class="btn accent" id="fc-got">Got it →</button></div></div>`, "Flashcards");
  const fc = $("#fc", root);
  function show() {
    fc.classList.remove("flipped");
    const known = deckMods.reduce((a, m) => a + (m.flashcards || []).filter((_, i) => S.cards[qid(m, i)] === 1).length, 0);
    const total = deckMods.reduce((a, m) => a + (m.flashcards || []).length, 0);
    $("#fc-count").textContent = deck.length ? `${Math.min(at + 1, deck.length)} / ${deck.length} · ${known}/${total} known` : `${known}/${total} known`;
    if (!deck.length || at >= deck.length) {
      $(".front", fc).innerHTML = `<div><b>Deck complete.</b><br><span class="muted">Untick “hide cards I know” to review everything, or reset the deck.</span></div>`;
      $(".back", fc).innerHTML = "";
      return;
    }
    const [m, i] = deck[at], c = m.flashcards[i];
    $(".front", fc).innerHTML = `<span class="tagline">${pad2(m.num)} · ${esc(m.short || m.title)}</span><div>${c.front}</div>`;
    $(".back", fc).innerHTML = `<span class="tagline">Answer</span><div>${c.back}</div>`;
    typeset(fc);
  }
  const mark = v => {
    if (at >= deck.length) return;
    const [m, i] = deck[at];
    if (v) S.cards[qid(m, i)] = 1; else { delete S.cards[qid(m, i)]; deck.push(deck[at]); }
    at++; save(); show();
  };
  fc.onclick = () => fc.classList.toggle("flipped");
  $("#fc-again").onclick = () => mark(false);
  $("#fc-got").onclick = () => mark(true);
  $("#fc-deck").onchange = e => { location.hash = e.target.value ? `#/cards/${e.target.value}` : "#/cards"; };
  $("#fc-unknown").onchange = e => { unknownOnly = e.target.checked; sessionSet("cards.unknown", unknownOnly ? "1" : "0"); build(); show(); };
  $("#fc-reset").onclick = () => { for (const m of deckMods) (m.flashcards || []).forEach((_, i) => delete S.cards[qid(m, i)]); save(); build(); show(); };
  cardKeys = e => {
    if (e.target.closest("input,select,textarea")) return;
    if (e.key === " ") { e.preventDefault(); fc.classList.toggle("flipped"); }
    else if (e.key === "ArrowRight") mark(true);
    else if (e.key === "ArrowLeft") mark(false);
  };
  show();
}
let cardKeys = null;
addEventListener("keydown", e => { if (cardKeys && location.hash.startsWith("#/cards")) cardKeys(e); });

function viewFormulas() {
  const groups = mods.filter(m => (m.cheats || []).length).map(m => `<div class="f-group p${m.part}"><h3><span class="badge">${pad2(m.num)}</span><a href="#/m/${m.id}" style="color:inherit">${m.title}</a></h3><div class="f-grid">${m.cheats.map(c => `<div class="card f-card"><div class="name">${c.name}</div><div class="tex">$$${c.tex}$$</div>${c.note ? `<div class="note">${c.note}</div>` : ""}</div>`).join("")}</div></div>`).join("");
  const root = setMain(`<h1 class="page-title">Formula sheet</h1><p class="page-lede">Every equation worth memorising, grouped by module. Print it (Ctrl/Cmd-P) for a one-stop reference.</p><input class="filter" id="ff" placeholder="Filter formulas… e.g. advantage, KL, clip">${groups}`, "Formula sheet");
  typeset(root);
  $("#ff").oninput = e => {
    const v = e.target.value.toLowerCase();
    for (const c of $$(".f-card", root)) c.hidden = v && !c.textContent.toLowerCase().includes(v) && !c.querySelector(".name").textContent.toLowerCase().includes(v);
    for (const g of $$(".f-group", root)) g.hidden = !$$(".f-card", g).some(c => !c.hidden);
  };
}

function viewGlossary() {
  const all = [];
  for (const m of mods) for (const g of m.glossary || []) all.push({ ...g, m });
  const seen = new Set();
  const items = all.sort((a, b) => a.term.localeCompare(b.term, "en", { sensitivity: "base" })).filter(g => { const k = g.term.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  let last = "";
  const html = items.map(g => {
    const L = g.term.replace(/[^A-Za-z0-9]/g, "")[0]?.toUpperCase() || "#";
    const head = L !== last ? `<div class="letter">${(last = L)}</div>` : "";
    return `${head}<div class="card g" data-t="${esc((g.term + " " + g.def).toLowerCase().replace(/<[^>]+>/g, ""))}"><dt><span>${g.term}</span><a href="#/m/${g.m.id}">${pad2(g.m.num)}</a></dt><dd>${g.def}</dd></div>`;
  }).join("");
  const root = setMain(`<h1 class="page-title">Glossary</h1><p class="page-lede">${items.length} terms across all modules. The number links to the module that explains it.</p><input class="filter" id="gf" placeholder="Search terms…"><dl class="gloss">${html}</dl>`, "Glossary");
  typeset(root);
  $("#gf").oninput = e => {
    const v = e.target.value.toLowerCase();
    for (const g of $$(".g", root)) g.hidden = v && !g.dataset.t.includes(v);
    for (const l of $$(".letter", root)) l.hidden = !!v;
  };
}
function viewNotFound() { setMain(`<h1 class="page-title">Not found</h1><p><a href="#/">Back to the dashboard</a></p>`); }

/* ---------- search ---------- */
const index = [];
for (const m of mods) {
  index.push({ t: `${pad2(m.num)} · ${m.title}`, sub: "Module", href: `#/m/${m.id}`, k: (m.title + " " + (m.subtitle || "") + " " + (m.short || "")).toLowerCase() });
  for (const s of m.sections) index.push({ t: s.title, sub: `Lesson · ${pad2(m.num)} ${m.short || m.title}`, href: `#/m/${m.id}/${s.id}`, k: (s.title + " " + s.html.replace(/<[^>]+>/g, " ")).toLowerCase(), weak: true });
  for (const g of m.glossary || []) index.push({ t: g.term, sub: `Glossary · ${pad2(m.num)}`, href: `#/glossary`, k: g.term.toLowerCase(), q: g.term });
  for (const c of m.cheats || []) index.push({ t: c.name, sub: `Formula · ${pad2(m.num)}`, href: `#/formulas`, k: c.name.toLowerCase() });
}
const strip = s => s.replace(/<[^>]+>/g, "").replace(/\$[^$]*\$/g, "…");
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const scored = [];
  for (const it of index) {
    if (!words.every(w => it.k.includes(w))) continue;
    const titleHit = words.every(w => it.t.toLowerCase().includes(w));
    scored.push([it, (titleHit ? 0 : 10) + (it.weak ? 1 : 0)]);
  }
  return scored.sort((a, b) => a[1] - b[1]).slice(0, 14).map(x => x[0]);
}
function setupSearch() {
  const inp = $("#q"), box = $("#qres");
  let sel = 0, res = [];
  const paint = () => {
    res = search(inp.value);
    box.hidden = !inp.value.trim();
    box.innerHTML = res.length ? res.map((r, i) => `<a href="${r.href}" class="${i === sel ? "sel" : ""}"><span>${strip(r.t)}</span><small>${esc(r.sub)}</small></a>`).join("") : `<div class="none">No matches.</div>`;
  };
  inp.addEventListener("input", () => { sel = 0; paint(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, res.length - 1); paint(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); }
    else if (e.key === "Enter" && res[sel]) { location.hash = res[sel].href; inp.blur(); box.hidden = true; }
    else if (e.key === "Escape") { inp.value = ""; box.hidden = true; inp.blur(); }
  });
  box.addEventListener("click", e => { if (e.target.closest("a")) { box.hidden = true; inp.value = ""; } });
  addEventListener("click", e => { if (!e.target.closest(".search")) box.hidden = true; });
  addEventListener("keydown", e => { if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && !e.target.closest("input,textarea,select")) { e.preventDefault(); inp.focus(); } });
}

/* ---------- router ---------- */
function route() {
  document.body.classList.remove("nav-open");
  cardKeys = null;
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean);
  const [a, b, c] = parts;
  if (!a) viewDashboard();
  else if (a === "plan") viewPlan();
  else if (a === "m") viewModule(b, c);
  else if (a === "quiz") viewQuiz();
  else if (a === "cards") viewCards(b);
  else if (a === "formulas") viewFormulas();
  else if (a === "glossary") viewGlossary();
  else if (location.hash.startsWith("#s-")) return; // in-page anchor
  else viewNotFound();
  if (a !== "m") window.scrollTo(0, 0);
  renderSidebar();
}
// "Continue" buttons carry data-sec so they land on the right lesson.
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-sec]");
  if (!a) return;
  e.preventDefault();
  const target = a.getAttribute("href") + "/" + a.dataset.sec;
  if (location.hash === target) route(); else location.hash = target;
});

/* theme */
const themeBtn = $("#theme");
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; setTimeout(() => redrawers.forEach(f => f()), 0); };
try { applyTheme(localStorage.getItem("rlguide.theme")); } catch {}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  applyTheme(t); try { localStorage.setItem("rlguide.theme", t); } catch {}
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => redrawers.forEach(f => f()));
$("#menu").onclick = () => document.body.classList.toggle("nav-open");
$(".scrim").onclick = () => document.body.classList.remove("nav-open");

addEventListener("hashchange", route);
setupSearch();
refreshChrome();
route();
if (window.renderMathInElement) RL.mathReady();
})();

</script>
