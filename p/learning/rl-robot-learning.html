      id: "normalization",
      title: "Normalising advantages, rewards and observations",
      html: String.raw`
<p>Neural networks and fixed learning rates like inputs and targets of order one. RL breaks that constantly: rewards range from 0.001 to 1000, values grow as the policy improves, advantages shrink as the critic improves. Three normalisations, each with a different purpose and a different failure mode.</p>

<h3>1. Advantage normalisation</h3>
<pre><code>mb_adv = b_advantages[mb_inds]
<span class="k">if</span> args.norm_adv:
    mb_adv = (mb_adv - mb_adv.mean()) / (mb_adv.std() + <span class="n">1e-8</span>)
</code></pre>
<p>CleanRL normalises <b>per minibatch</b> (some libraries normalise over the whole batch; the difference is small for reasonable minibatch sizes). What it does:</p>
<ul>
<li><b>Dividing by the std</b> makes the policy step size independent of the reward scale and of how good the critic currently is. It is an adaptive learning rate for the policy loss.</li>
<li><b>Subtracting the mean</b> is a constant baseline. A constant baseline does not bias the policy gradient in expectation ($\mathbb{E}[\nabla\log\pi]\cdot c = 0$), and it guarantees that about half the actions in each minibatch are pushed down, which matters when the critic is biased and all raw advantages share a sign.</li>
<li>It is <b>not</b> an unbiased transform of the objective per minibatch: the mean and std are themselves random. In practice this is negligible for minibatches of hundreds of samples, and noisy for tiny ones.</li>
</ul>
<div class="callout warn"><b>Where it bites</b><p>(1) Tiny minibatches: the std estimate is noisy, and with one sample it is undefined (PyTorch returns NaN for <code>std()</code> of one element). (2) Nearly constant advantages: dividing by a tiny std amplifies noise into a full-size update. This is GRPO's "zero-variance group" problem in disguise: when all samples in a group get the same reward, the normalised advantage is 0/ε. (3) Masking: in LLM training, compute the mean and std only over real action tokens, not padding or environment tokens.</p></div>
<p>How much does it matter? Less than folklore says: large-scale studies have found per-minibatch advantage normalisation has a modest effect in many settings. It matters most when the reward scale is extreme or changes during training. That makes it a good "break it" candidate: on CartPole, turning it off often does little; combine it with a reward multiplied by 100 and things change.</p>

<h3>2. Reward scaling and clipping</h3>
<p>Gymnasium's <code>NormalizeReward</code> wrapper (used by CleanRL's <code>ppo_continuous_action.py</code>) keeps a running estimate of the variance of the <b>discounted return</b> and divides each reward by its standard deviation. It does <b>not</b> subtract a mean (that would change which behaviours are rewarded, e.g. turning a "survive" reward into a "die quickly" penalty). CleanRL then clips the scaled reward to $[-10, 10]$. Engstrom et al. found reward scaling to be one of the implementation details with the largest effect on PPO's MuJoCo performance.</p>
<p>Why the return and not the reward? The quantities the networks see are values and advantages, which scale with the return. Scaling by the return's std makes value targets roughly unit-scale regardless of $\gamma$ and the reward magnitude.</p>
<div class="callout tip"><b>Practical tip</b><p>Log the <em>unnormalised</em> episodic return (the <code>RecordEpisodeStatistics</code> wrapper does this if it wraps the env <em>before</em> the normalisation wrappers, which is how CleanRL orders them). Plotting normalised rewards makes curves look flat and hides real progress or regressions.</p></div>

<h3>3. Observation normalisation</h3>
<p><code>NormalizeObservation</code> keeps a running mean and variance per observation dimension and standardises; CleanRL also clips the result to $[-10,10]$. For MuJoCo it matters a lot (joint velocities and positions have very different scales). Pitfalls:</p>
<ul>
<li>The statistics are part of the policy. Save them with the checkpoint and freeze them at evaluation, or your evaluated policy sees different inputs from the one you trained.</li>
<li>The statistics keep moving during training, so the same raw state maps to a slightly different input over time. PPO stores the normalised observation at collection time, which keeps the ratio computation consistent within an update.</li>
<li>Images (Phase 2): don't use running statistics; use fixed per-channel normalisation, as the vision backbone expects.</li>
</ul>

<h3>Value-target scale and PopArt</h3>
<p>Even with reward scaling, values can drift. For a shared trunk or a multi-task critic, adaptive target normalisation such as PopArt (van Hasselt et al., 2016) rescales the value head while preserving its outputs. For Phase 0 you will not need it; it is worth knowing the name if an interviewer asks how to handle tasks with very different reward scales in one network.</p>

<h3>A debugging checklist for advantages and values</h3>
<ol class="steps">
<li>At the start of the first epoch of each update the ratio should be exactly 1 (approx_kl = 0). If not, your stored logprobs and recomputed logprobs disagree: different observation normalisation, dropout left on, or a bug in action storage.</li>
<li>Advantages before normalisation: print mean and std over training. Mean far from zero for long means a biased critic; std collapsing to ~0 means the signal is gone.</li>
<li>Explained variance rising from ~0 toward positive values in the first part of training.</li>
<li>Check masks on a tiny hand-made buffer (the stepper widget above is exactly that test): one termination, one truncation, one rollout end.</li>
<li>Confirm you bootstrap from the true final observation at truncation, passed through the same observation normaliser.</li>
<li>Log unnormalised episodic return, normalised value targets, and value predictions on the same plot to spot offsets EV can't see.</li>
</ol>

<div class="callout interview"><b>What interviewers ask</b><p>"Is advantage normalisation biased?" The mean subtraction is a constant baseline, unbiased in expectation; dividing by the std rescales the step. The per-minibatch statistics introduce a small bias, negligible for large minibatches. Then show you know when it breaks: tiny batches, near-constant advantages (zero-variance groups in GRPO), and masked tokens.</p></div>
`,

    { q: "What is the advantage function and why is it a better credit signal than the return?", a: String.raw`<p>$A^\pi(s,a) = Q^\pi(s,a) - V^\pi(s)$: how much better taking $a$ in $s$ is than the policy's average behaviour in $s$. It has zero mean under the policy, so it centres the credit signal (roughly half the actions get pushed down), removes the variance due to "this was a lucky/unlucky episode overall", and assigns credit per action rather than per episode. Using $V$ as the baseline keeps the gradient unbiased because $\mathbb{E}_a[\nabla\log\pi(a\mid s)] = 0$.</p>` },
    { q: String.raw`Show that the TD error is an unbiased advantage estimate when $V = V^\pi$. Where does bias come from otherwise?`, a: String.raw`<p>$\mathbb{E}[r_t + \gamma V^\pi(s_{t+1}) \mid s_t,a_t] = Q^\pi(s_t,a_t)$ by the Bellman equation, so $\mathbb{E}[\delta_t\mid s_t,a_t] = Q^\pi - V^\pi = A^\pi$. With critic error $e$, you get an extra $\gamma\,\mathbb{E}[e(s_{t+1})] - e(s_t)$. The $-e(s_t)$ part is state-only and harmless; the $\gamma e(s_{t+1})$ part depends on the action (through where you land) and biases the gradient.</p>` },
    { q: "Derive GAE from the n-step estimators and state the recursion.", a: String.raw`<p>$\hat A^{(k)}_t = \sum_{l\lt k}\gamma^l\delta_{t+l}$ by telescoping. GAE $= (1-\lambda)\sum_{k\ge1}\lambda^{k-1}\hat A^{(k)}_t$. The term $\gamma^l\delta_{t+l}$ appears in all $\hat A^{(k)}$ with $k\gt l$, total weight $(1-\lambda)\sum_{k\gt l}\lambda^{k-1} = \lambda^l$, giving $\sum_l(\gamma\lambda)^l\delta_{t+l}$. Recursion: $\hat A_t = \delta_t + \gamma\lambda(1-d_t)\hat A_{t+1}$, computed backwards from the bootstrap at the rollout end.</p>` },
    { q: String.raw`What do $\lambda=0$ and $\lambda=1$ reduce to, and which is biased?`, a: String.raw`<p>$\lambda=0$: $\hat A_t = \delta_t$, one-step TD, low variance, biased when the critic is wrong. $\lambda=1$: $\hat A_t = G_t - V(s_t)$, Monte Carlo with a baseline, unbiased for the gradient (γ-just) for any critic, high variance. The default 0.95 has an effective horizon $1/(1-\gamma\lambda)\approx17$ steps with $\gamma=0.99$.</p>` },
    { q: String.raw`What are the different roles of $\gamma$ and $\lambda$?`, a: String.raw`<p>$\gamma$ defines the objective and the meaning (and scale) of the value function: how far ahead the agent cares. $\lambda$ only affects the estimator: how much of that horizon is estimated from sampled rewards versus the critic. Changing $\gamma$ changes the optimal policy in general; changing $\lambda$ changes bias and variance of the gradient estimate but not the target quantity.</p>` },
    { q: String.raw`Why is the critic's target $R_t = \hat A_t + V(s_t)$ and what is it called?`, a: String.raw`<p>Because $\hat A^{(k)}_t + V(s_t) = G^{(k)}_t$, the $k$-step return, the GAE weights turn $\hat A_t + V(s_t)$ into $(1-\lambda)\sum\lambda^{k-1}G^{(k)}_t$, the TD($\lambda$) λ-return. It is computed once per rollout with the old critic and then held fixed while the new critic regresses onto it with MSE.</p>` },
    { q: "Explain the terminated vs truncated bug and two ways to fix it.", a: String.raw`<p>Termination: the true value of the terminal state is 0, so don't bootstrap. Truncation (time limit, rollout end): the state still has a future, so bootstrap with $V(s^{\text{final}})$. Treating truncation as termination makes targets depend on an unobserved clock (same state, very different targets), biases late-episode advantages negative and hurts the critic. Fixes: bootstrap from $V$ of the true final observation (not the auto-reset observation), e.g. by folding $\gamma V(s^{\text{final}})$ into the reward; or put remaining time in the observation and treat the limit as a real termination.</p>` },
    { q: "What is value clipping in PPO, and why do many people turn it off?", a: String.raw`<p>The loss is the max of the unclipped squared error and the squared error of a prediction clipped to within $\epsilon$ of the value at collection time, so the critic gets no gradient for moving further than $\epsilon$ once that does not help. It's turned off because $\epsilon$ is in reward units (CleanRL reuses 0.2, tiny for returns in the hundreds), and large studies (Engstrom et al., Andrychowicz et al.) found it doesn't help or hurts. SB3's default disables it.</p>` },
    { q: "What does explained variance measure and what can't it see?", a: String.raw`<p>$1 - \operatorname{Var}[R - V]/\operatorname{Var}[R]$: the fraction of target variance the critic explains. 1 = perfect, 0 = as good as predicting the mean, negative = worse. It is invariant to a constant offset (a critic off by +50 everywhere scores 1), and with $\lambda\lt 1$ targets contain $V$, which inflates it. Log value loss and mean predictions too.</p>` },
    { q: "Why normalise advantages, and is it biased? When does it break?", a: String.raw`<p>Dividing by the std makes the policy step invariant to reward scale and critic quality (adaptive step size); subtracting the mean is a constant baseline, unbiased in expectation, and ensures roughly half the actions are pushed down. Per-minibatch statistics add a small bias, negligible for large minibatches. It breaks with tiny minibatches (noisy or NaN std), nearly constant advantages (dividing noise by ~0, like GRPO's zero-variance groups), and when padding/env tokens leak into the statistics.</p>` },
    { q: "How does NormalizeReward work, and why doesn't it subtract a mean?", a: String.raw`<p>It tracks the running variance of the discounted return and divides rewards by its std, so values and advantages end up roughly unit scale regardless of reward magnitude and $\gamma$. Subtracting a mean from rewards would change the task (a +1 survival reward minus its mean can become a penalty for living, encouraging early termination).</p>` },
    { q: "In Phase 1, how would you use GAE with an LLM, and how does GRPO relate?", a: String.raw`<p>Put a value head on the model (or a separate critic), compute values per action token (or per turn), assign the outcome reward at the final action token (plus per-token KL penalties if used), and run the same backwards recursion over action positions, masking prompt/environment/padding tokens. Usually $\gamma=1$ for short episodes, $\lambda$ around 0.95–1 (check your library). GRPO removes the critic: the advantage is the sequence reward minus the group mean (divided by the group std), which is the "Monte Carlo with a sample-mean baseline" end of this spectrum, paying for zero critic bias with more samples per prompt.</p>` },
  ],

  /* ====================================================================== quiz */
  quiz: [
    { q: String.raw`With $\gamma = 0.9$ and $\lambda = 0.8$, a rollout yields $\delta_0 = 1$, $\delta_1 = 0.5$, $\delta_2 = -1$ and then ends (the bootstrap is already inside $\delta_2$). What is $\hat A_0^{\text{GAE}}$?`, answer: 0.8416, tol: 0.005,
      explain: String.raw`$\gamma\lambda = 0.72$. $\hat A_0 = \delta_0 + 0.72\,\delta_1 + 0.72^2\,\delta_2 = 1 + 0.36 - 0.5184 = 0.8416$. Backwards: $\hat A_2 = -1$, $\hat A_1 = 0.5 - 0.72 = -0.22$, $\hat A_0 = 1 + 0.72\cdot(-0.22) = 0.8416$. A common mistake is discounting by $\gamma$ alone (giving $1 + 0.45 - 0.81 = 0.64$).` },
    { q: String.raw`GAE with $\lambda = 1$ reduces to:`, choices: [String.raw`$\delta_t$, the one-step TD error`, String.raw`$G_t - V(s_t)$, the Monte Carlo return minus the critic's value`, String.raw`$Q(s_t,a_t)$`, String.raw`$G_t$ without a baseline`], answer: 1,
      explain: String.raw`$\sum_l \gamma^l\delta_{t+l}$ telescopes: all intermediate values cancel, leaving $\sum_l\gamma^l r_{t+l} - V(s_t)$. It still subtracts $V(s_t)$, so it is not the raw return; $\lambda=0$ is the one that gives $\delta_t$.` },
    { q: String.raw`What is the effective horizon $1/(1-\gamma\lambda)$ of GAE with $\gamma = 0.99$, $\lambda = 0.95$ (in steps)?`, answer: 16.81, tol: 0.15,
      explain: String.raw`$\gamma\lambda = 0.9405$, $1/(1-0.9405) = 1/0.0595 \approx 16.8$. Compare with $1/(1-\gamma) = 100$ for $\gamma$ alone: GAE estimates about 17 steps from real rewards and leaves the rest of the 100-step horizon to the critic.` },
    { q: String.raw`$r_t = 1$, $\gamma = 0.99$, $V(s_t) = 9.5$, $V(s_{t+1}) = 10$, and the step <b>terminated</b> the episode (the pole fell). What is the correct $\delta_t$?`, answer: -8.5, tol: 0.01,
      explain: String.raw`At a true termination there is no future, so the bootstrap is 0: $\delta_t = 1 + 0 - 9.5 = -8.5$. If it had been a time-limit truncation instead, you would bootstrap: $1 + 0.99\cdot 10 - 9.5 = 1.4$. Note the critic's prediction of $V(s_{t+1})$ is irrelevant when terminated.` },
    { q: "Which statements about GAE bias are true?", choices: [
        String.raw`With a perfect critic $V = V^\pi$, GAE is unbiased for every $\lambda$`,
        String.raw`With an imperfect critic, the gradient bias vanishes at $\lambda = 1$`,
        String.raw`An error in $V(s_t)$ at the current state biases the policy gradient`,
        String.raw`Lower $\lambda$ always means lower mean squared error`],
      answer: [0, 1],
      explain: String.raw`With $V=V^\pi$ every $\delta$ has expectation $A^\pi$, so any weighted combination is unbiased. At $\lambda=1$ the estimate is $G_t - V(s_t)$, γ-just for any critic. An error at $s_t$ alone is a state-only shift, which acts like a baseline and does not bias the gradient (it biases the number $\hat A_t$, not its expected gradient). Lower $\lambda$ trades variance for bias; the MSE-optimal $\lambda$ is usually in the interior.` },
    { q: "Why does CleanRL compute `returns = advantages + values`?", choices: [
        "It is a hack that happens to work; the right target is the Monte Carlo return",
        String.raw`It equals the TD($\lambda$) λ-return, the natural critic target consistent with the advantages`,
        "It makes the value loss zero at the start of each update",
        "It converts advantages into Q-values for an off-policy critic"],
      answer: 1,
      explain: String.raw`$\hat A^{(k)} + V(s_t) = G^{(k)}_t$, so with GAE weights $\hat A_t + V(s_t) = G^\lambda_t$. It is a principled target. The value loss is not zero at the start: the critic's prediction equals $V$, the target is $V + \hat A$, so the initial error is exactly $\hat A$. It is a state-value target, not a Q-value.` },
    { q: "You set `gae_lambda = 0` on a task where the only reward is at the end of 200-step episodes, with a freshly initialised critic. What is the most likely effect?", choices: [
        "Faster learning, because variance is minimal",
        "No change: λ only affects variance",
        "Very slow learning: early actions get almost no signal until the critic has propagated the reward back step by step",
        "Divergence of the value function to infinity"],
      answer: 2,
      explain: String.raw`With $\lambda=0$, $\hat A_t = r_t + \gamma V(s_{t+1}) - V(s_t)$. For early steps $r_t = 0$ and the untrained critic carries no information, so the advantage is roughly noise. Reward information reaches earlier states only through successive critic updates (one bootstrap step at a time), so learning is slow and can lock onto nearby small rewards. This is bias, not variance. On-policy value learning with a fixed target doesn't usually diverge.` },
    { q: "In Gymnasium, `truncated=True` because CartPole hit its 500-step limit. What is correct?", choices: [
        String.raw`Set the bootstrap to 0, the episode is over`,
        String.raw`Bootstrap with $V$ of the true final observation, and stop the GAE recursion from carrying across into the next episode`,
        String.raw`Bootstrap with $V$ of the observation returned by the autoreset`,
        "Drop the transition from the batch"],
      answer: 1,
      explain: String.raw`Truncation is not a terminal state: the pole is still up and has a future. Bootstrap from the true final observation (from <code>final_observation</code> in the 0.29-style API, or the obs returned at the done step in 1.x next-step autoreset). The autoreset observation is the first state of the next episode, so using it is a second bug. You still cut the advantage recursion, because the next row is a different episode. Dropping data is wasteful and unnecessary.` },
    { q: "What problem does treating time-limit truncation as termination create for the critic, specifically?", choices: [
        "It makes the value targets depend on time, which is not in the observation, so identical states get inconsistent targets",
        "It makes the critic overestimate values near the time limit",
        "It only affects logging, not learning",
        "It introduces variance but no bias"],
      answer: 0,
      explain: String.raw`An upright pole at step 10 gets a target near $1/(1-\gamma)$; at step 499 near 1. Same observation, different targets: the clock is a hidden variable, making the problem non-Markov for the critic. Values near the limit are <em>under</em>estimated (not over), and the advantages of late actions are biased negative. It is a bias, and it affects learning.` },
    { q: "Explained variance of the critic is 0.99 but the value loss is huge. What is the most likely explanation?", choices: [
        "A bug in the explained variance formula",
        "The critic is nearly perfect, the value loss is mislabelled",
        "The critic tracks the variations of the returns but is off by a large constant offset (or scale drift)",
        "The policy has collapsed"],
      answer: 2,
      explain: String.raw`EV is $1 - \operatorname{Var}[R-V]/\operatorname{Var}[R]$; adding a constant to $V$ does not change $\operatorname{Var}[R-V]$, so EV can be ~1 while MSE is large. Typical causes: a reward-scale change, a lagging critic after the returns' mean grew. Always log MSE and mean predictions alongside EV.` },
    { q: "Which statements about PPO-style value clipping (as in CleanRL's `clip_vloss`) are true?", choices: [
        "It takes the max of the unclipped and clipped squared errors",
        "Its clip range is in units of the value (reward scale), not a ratio",
        "Large empirical studies found it to be essential for PPO's performance",
        "Stable-Baselines3 enables it by default"],
      answer: [0, 1],
      explain: String.raw`The loss is $\max\big((V-R)^2, (V_\text{old} + \operatorname{clip}(V - V_\text{old}, \pm\epsilon) - R)^2\big)$, and $\epsilon$ is an absolute value-space distance, so its effect depends on reward scale. Engstrom et al. and Andrychowicz et al. found it does not help and can hurt. SB3's <code>clip_range_vf</code> defaults to <code>None</code> (off).` },
    { q: "Where in the code should GAE be computed?", choices: [
        "Per minibatch, right before the loss, using the current critic",
        "Once per rollout on the [num_steps, num_envs] buffer, under no_grad, using the values stored during collection, before shuffling",
        "After every optimizer step, to keep advantages fresh",
        "On the flattened [num_steps × num_envs] array"],
      answer: 1,
      explain: String.raw`The recursion needs consecutive steps of the same environment (so not after shuffling or flattening), and the advantages must come from the critic that collected the data and be held fixed (constants, no gradient) through all epochs. Recomputing per minibatch with a changing critic makes the targets move during the update and breaks the "ratio = 1 at the start" consistency.` },
    { q: "In CleanRL's `ppo.py`, `dones[t]` is stored before the environment is stepped. What does `dones[t]` mean?", choices: [
        "The episode ended after the action at step t",
        "Observation obs[t] is the first observation of a new episode (the previous step ended an episode)",
        "The environment was truncated at step t",
        "Step t is the last step of the rollout"],
      answer: 1,
      explain: String.raw`The loop does <code>dones[step] = next_done</code> before calling <code>envs.step</code>, so it records the done flag produced by the <em>previous</em> step. That's why the GAE loop uses <code>1 - dones[t+1]</code> (and <code>1 - next_done</code> for the last step) as "nextnonterminal" for step $t$. Misreading this convention when porting the loop is a classic off-by-one.` },
    { q: "Which are legitimate reasons to push λ closer to 1?", choices: [
        "The critic is still poor (early training, sparse rewards)",
        "Rewards and transitions are nearly deterministic, so variance is cheap",
        "You have no critic at all",
        "The environment is extremely noisy and episodes are thousands of steps long"],
      answer: [0, 1, 2],
      explain: String.raw`High $\lambda$ reduces dependence on the critic (good when it is bad or absent) at the cost of variance (cheap when the environment is nearly deterministic). With very noisy, very long episodes, variance is the main problem, which argues for lower $\lambda$.` },
    { q: "An advantage-normalisation bug: minibatch size is 1. What happens with `(adv - adv.mean()) / (adv.std() + 1e-8)` in PyTorch?", choices: [
        "Nothing special; the result is the raw advantage",
        "The result is 0 for every sample, so the policy never learns",
        String.raw`<code>std()</code> of one element is NaN (unbiased estimator), so the loss becomes NaN`,
        "It raises an exception"],
      answer: 2,
      explain: String.raw`<code>torch.std</code> uses Bessel's correction by default (divide by $n-1$), which for $n=1$ gives NaN (with a warning, not an exception). Even with the biased estimator you'd get $0/\epsilon = 0$. Either way, normalisation needs reasonably large minibatches; GRPO faces the same issue with groups whose rewards are all identical.` },
    { q: "Gymnasium's NormalizeReward wrapper divides each reward by:", choices: [
        "The running std of the rewards, after subtracting their running mean",
        "The running std of the discounted return",
        "The maximum reward seen so far",
        "A fixed constant set by the user"],
      answer: 1,
      explain: String.raw`It keeps a running estimate of the discounted return's variance and scales rewards by its std, without subtracting a mean. Mean subtraction would change the task (e.g. turning a per-step survival bonus into a per-step penalty that rewards dying early). Scaling by the return's spread puts values and advantages near unit scale.` },
    { q: String.raw`Your critic is $V = V^\pi + c$ for a constant $c$ at every non-terminal state (and 0 at terminal states). With $\lambda = 0$, what is the bias in $\delta_t$ at a non-terminal transition?`, choices: [String.raw`$0$`, String.raw`$(\gamma - 1)c$`, String.raw`$\gamma c$`, String.raw`$-c$`], answer: 1,
      explain: String.raw`$\delta_t = r_t + \gamma(V^\pi(s_{t+1}) + c) - (V^\pi(s_t) + c)$, so the error is $\gamma c - c = (\gamma-1)c$. The $-c$ part is state-only (harmless for the gradient); the $\gamma c$ part is the gradient-relevant piece, but because it is the same for every action that leads to a non-terminal state, it only matters where actions differ in whether they terminate. That is a nice example of why "bias" depends on how errors differ across the states different actions lead to.` },
    { q: String.raw`If $\operatorname{Var}[R] = 4$ and $\operatorname{Var}[R - V] = 1$ over a batch, what is the explained variance?`, answer: 0.75, tol: 0.001,
      explain: String.raw`$\text{EV} = 1 - 1/4 = 0.75$: the critic explains three quarters of the variation in its targets.` },
    { q: "You use observation normalisation. At a time-limit truncation you bootstrap with V(final_obs). What else must be true?", choices: [
        "final_obs must be passed through the same observation normaliser (with the same statistics) before evaluating V",
        "final_obs must be the raw unnormalised observation, because the critic was trained on raw inputs",
        "Nothing; the critic is invariant to input scale",
        "You must also reset the normaliser statistics"],
      answer: 0,
      explain: String.raw`The critic was trained on normalised inputs, so every input you evaluate it on must be normalised identically. Vector-env wrappers return final observations in the <code>info</code> dict, which may bypass the normalisation wrapper depending on order and version: check it.` },
  ],

  /* ====================================================================== flashcards */
  flashcards: [
    { front: "Advantage function", back: String.raw`$A^\pi(s,a) = Q^\pi(s,a) - V^\pi(s)$; zero mean under $\pi$. "How much better than usual was this action?"` },
    { front: "TD error", back: String.raw`$\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)$; with $V = V^\pi$, $\mathbb{E}[\delta_t\mid s_t,a_t] = A^\pi(s_t,a_t)$.` },
    { front: "k-step advantage as TD errors", back: String.raw`$\hat A^{(k)}_t = \sum_{l\lt k}\gamma^l\delta_{t+l} = -V(s_t) + \sum_{l\lt k}\gamma^l r_{t+l} + \gamma^kV(s_{t+k})$ (telescoping).` },
    { front: "GAE closed form", back: String.raw`$\hat A_t = \sum_{l\ge0}(\gamma\lambda)^l\delta_{t+l}$` },
    { front: "GAE recursion", back: String.raw`$\hat A_t = \delta_t + \gamma\lambda(1-d_t)\hat A_{t+1}$, computed backwards, seeded with the bootstrap $V(s_T)$ at the rollout end.` },
    { front: "GAE weights on the n-step estimators", back: String.raw`$(1-\lambda)\lambda^{k-1}$ on $\hat A^{(k)}$, summing to 1.` },
    { front: String.raw`GAE at $\lambda=0$ / $\lambda=1$`, back: String.raw`$\lambda=0$: $\delta_t$ (low variance, biased). $\lambda=1$: $G_t - V(s_t)$ (γ-just, high variance).` },
    { front: "Effective horizon of GAE (defaults)", back: String.raw`$1/(1-\gamma\lambda)$; with 0.99/0.95 it's ≈ 17 steps (vs 100 for γ alone).` },
    { front: "γ vs λ", back: "γ defines the objective and value scale; λ only changes the estimator's bias–variance trade-off." },
    { front: "γ-just estimator", back: String.raw`An advantage estimator whose expectation equals $A^\pi$ up to a function of $s_t$ only; it gives an unbiased policy gradient (GAE paper's term).` },
    { front: "Critic error leakage into GAE", back: String.raw`$-e(s_t) + \sum_{k\ge1}\gamma^k\lambda^{k-1}(1-\lambda)e(s_{t+k})$; vanishes (except the harmless state term) at λ = 1.` },
    { front: "Variance of GAE with i.i.d. per-step noise σ²", back: String.raw`$\approx \sigma^2/(1-\gamma^2\lambda^2)$: ~8.6σ² at 0.99/0.95, ~50σ² at λ = 1.` },
    { front: "Critic target in PPO", back: String.raw`$R_t = \hat A_t + V_\text{old}(s_t)$ = the TD(λ) λ-return; fixed for the whole update.` },
    { front: "Value loss (CleanRL)", back: String.raw`$0.5\cdot\text{mean}((V - R)^2)$, times vf_coef 0.5 in the total loss; optional clipped variant.` },
    { front: "Clipped value loss", back: String.raw`$\max\big((V-R)^2, (V_\text{old} + \operatorname{clip}(V-V_\text{old},\pm\epsilon) - R)^2\big)$; ε is in value units.` },
    { front: "Does value clipping help?", back: "Large studies (Engstrom 2020, Andrychowicz 2021) found no benefit or harm; SB3 disables it by default." },
    { front: "Explained variance", back: String.raw`$1 - \operatorname{Var}[R-V]/\operatorname{Var}[R]$; 1 perfect, 0 = mean predictor, &lt;0 worse. Blind to constant offsets.` },
    { front: "terminated vs truncated", back: "terminated: true terminal, V = 0, don't bootstrap. truncated: time limit / external cutoff, bootstrap with V(true final obs)." },
    { front: "Two masks in GAE", back: "terminated zeroes the bootstrap inside δ; any episode end (term or trunc) cuts the carried advantage." },
    { front: "Where is the final obs in a vector env?", back: "Autoreset replaces it. 0.29-style API: infos['final_observation']. Gymnasium 1.x next-step autoreset: returned at the done step, next step() resets. Check your version." },
    { front: "Pardo et al. 2018 fixes for time limits", back: "Partial-episode bootstrapping (bootstrap at timeouts), or time-aware observations (then treat timeout as terminal)." },
    { front: "SB3's timeout handling trick", back: String.raw`Fold the bootstrap into the reward: $r \leftarrow r + \gamma V(s^{\text{final}})$ at truncated steps, then treat the step as done.` },
    { front: "Advantage normalisation (CleanRL)", back: "Per minibatch: (A − mean)/(std + 1e-8). Mean = constant baseline; std = adaptive step size." },
    { front: "NormalizeReward", back: "Divide rewards by the running std of the discounted return; no mean subtraction. CleanRL then clips to [−10, 10]." },
    { front: "Why not subtract a mean from rewards?", back: "It changes the task: a per-step survival bonus can become a penalty that rewards ending episodes early." },
    { front: "First-minibatch sanity check", back: "ratio = exp(new_logp − old_logp) must be exactly 1 (approx_kl = 0) before the first gradient step; otherwise stored and recomputed logprobs disagree." },
    { front: "Why compute GAE before shuffling?", back: "The recursion needs consecutive steps of the same env; shuffling or flattening first connects unrelated transitions." },
    { front: "GRPO in GAE terms", back: "No critic: advantage = (reward − group mean)/group std. The λ = 1 end with a sampled-group baseline; pays for zero critic bias with several samples per prompt." },
  ],

  /* ====================================================================== formula sheet */
  cheats: [
    { name: "Advantage", tex: String.raw`A^\pi(s,a) = Q^\pi(s,a) - V^\pi(s)`, note: "Zero mean under the policy." },
    { name: "TD error", tex: String.raw`\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)`, note: "E[δ | s,a] = A when V = V^π." },
    { name: "k-step advantage", tex: String.raw`\hat A^{(k)}_t = \sum_{l=0}^{k-1}\gamma^l\delta_{t+l}`, note: "Telescoping sum." },
    { name: "GAE", tex: String.raw`\hat A_t^{\text{GAE}(\gamma,\lambda)} = \sum_{l\ge0}(\gamma\lambda)^l\delta_{t+l} = (1-\lambda)\sum_{k\ge1}\lambda^{k-1}\hat A^{(k)}_t`, note: "λ = 0 → δ_t; λ = 1 → G_t − V(s_t)." },
    { name: "GAE recursion", tex: String.raw`\hat A_t = \delta_t + \gamma\lambda(1-d_t)\hat A_{t+1}`, note: "Backwards pass; bootstrap V(s_T) at the rollout end." },
    { name: "Effective horizon", tex: String.raw`H_{\text{GAE}} \approx \frac{1}{1-\gamma\lambda}`, note: "≈ 17 steps for γ = 0.99, λ = 0.95." },
    { name: "λ-return target", tex: String.raw`R_t = \hat A_t + V(s_t) = G_t^\lambda`, note: "Critic regression target." },
    { name: "Value loss", tex: String.raw`L^V = \tfrac12\,\mathbb{E}\big[(V_\phi(s_t) - R_t)^2\big]`, note: "Plain regression; targets fixed for the update." },
    { name: "Clipped value loss", tex: String.raw`\tfrac12\max\!\big((V-R)^2,\ (V_{\text{old}} + \operatorname{clip}(V - V_{\text{old}}, -\epsilon, \epsilon) - R)^2\big)`, note: "ε in value units; often off." },
    { name: "Explained variance", tex: String.raw`\text{EV} = 1 - \frac{\operatorname{Var}[R - V]}{\operatorname{Var}[R]}`, note: "Shift-invariant: log MSE too." },
    { name: "Terminal vs time-limit target", tex: String.raw`y_t = r_t + \gamma\,(1-\text{term}_t)\,V(s^{\text{final}}_{t+1})`, note: "Truncation still bootstraps from the true final obs." },
    { name: "Advantage normalisation", tex: String.raw`\tilde A = \frac{\hat A - \operatorname{mean}(\hat A)}{\operatorname{std}(\hat A) + 10^{-8}}`, note: "Per minibatch in CleanRL." },
  ],

  /* ====================================================================== glossary */
  glossary: [
    { term: "Advantage", def: "Q(s,a) − V(s): how much better an action is than the policy's average in that state." },

    { term: "Bootstrapping", def: "Using the critic's prediction in place of the remaining (unobserved) return." },
    { term: "n-step advantage", def: "Advantage estimate using n real rewards, then bootstrapping with V at step n." },
    { term: "GAE", def: "Generalized Advantage Estimation: exponentially weighted average of n-step advantages, Σ(γλ)^l δ_{t+l}." },
    { term: "λ (GAE lambda)", def: "Bias–variance knob of GAE; 0 = one-step TD, 1 = Monte Carlo minus baseline. Default 0.95." },
    { term: "λ-return", def: "Exponentially weighted average of n-step returns; equals GAE advantage + V and is the critic's target." },
    { term: "γ-just", def: "An advantage estimator that gives an unbiased policy gradient (its error depends on the state only)." },
    { term: "Critic / value head", def: "Network predicting V(s) (for LLMs: a scalar head on each token position)." },
    { term: "Value clipping", def: "PPO-style limit on how far the new value prediction moves from the old one in a single update." },
    { term: "Huber loss", def: "Quadratic for small errors, linear for large ones; robust value regression (smooth_l1_loss)." },
    { term: "Explained variance", def: "1 − Var[R−V]/Var[R]: fraction of target variance the critic explains." },
    { term: "Terminated", def: "Episode ended in a true terminal state of the MDP; its value is 0." },
    { term: "Truncated", def: "Episode cut by something outside the MDP (time limit, rollout end); the state still has value, so bootstrap." },
    { term: "Partial-episode bootstrapping", def: "Bootstrapping from V at truncations so time limits don't bias targets (Pardo et al. 2018)." },
    { term: "Autoreset", def: "Vector envs reset finished sub-environments automatically, so next_obs after a done is a new episode's first observation." },
    { term: "Rollout buffer", def: "On-policy storage of shape [num_steps, num_envs] holding obs, actions, logprobs, rewards, dones, values." },
    { term: "Advantage normalisation", def: "Standardising advantages per minibatch (or batch) before the policy loss." },
    { term: "Reward scaling", def: "Dividing rewards by the running std of the discounted return (Gymnasium NormalizeReward)." },
    { term: "Observation normalisation", def: "Running mean/variance standardisation of observations; its statistics are part of the policy." },

      title: "Why off-policy: reusing every transition",
      html: String.raw`
<p>PPO (<a href="#/m/ppo">Module 05</a>) is <b>on-policy</b>: its gradient is an expectation under the <i>current</i> policy, so after a few epochs on a batch the data is stale and thrown away. That is fine when a simulator gives you 10<sup>8</sup> cheap steps. It is painful when each step is a 3-billion-parameter VLA forward pass plus a rendered LIBERO frame, and hopeless on a real robot where an episode costs a human reset. <b>Off-policy</b> methods learn from data generated by <i>any</i> policy: old versions of yourself, demonstrations, a scripted controller, a frozen VLA. They keep a <b>replay buffer</b> and reuse each transition many times.</p>

<figure>
<svg viewBox="0 0 720 230" role="img" aria-label="On-policy versus off-policy data flow">
  <defs><marker id="ar12a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>
  <g font-size="13" fill="currentColor">
    <text x="20" y="22" font-weight="700">On-policy (PPO, GRPO)</text>
    <rect x="20" y="40" width="130" height="46" rx="8" fill="none" stroke="var(--blue)" stroke-width="2"/><text x="85" y="68" text-anchor="middle">policy π_k</text>

    <rect x="200" y="120" width="130" height="46" rx="8" fill="none" stroke="var(--line-2)" stroke-width="2" stroke-dasharray="5 4"/><text x="265" y="148" text-anchor="middle" fill="var(--muted)">discarded</text>

    <path d="M265,86 L265,118" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar12a)"/>

    <text x="150" y="20" font-size="11" fill="var(--muted)">few epochs</text>
    <text x="20" y="200" font-size="12" fill="var(--muted)">each sample used ~4–10 times, then gone</text>

    <text x="400" y="22" font-weight="700">Off-policy (DDPG, TD3, SAC, DSRL)</text>
    <rect x="400" y="40" width="120" height="46" rx="8" fill="none" stroke="var(--blue)" stroke-width="2"/><text x="460" y="68" text-anchor="middle">actor + critic</text>
    <rect x="580" y="40" width="120" height="46" rx="8" fill="none" stroke="var(--orange)" stroke-width="2"/><text x="640" y="62" text-anchor="middle">replay buffer</text><text x="640" y="78" text-anchor="middle" font-size="11" fill="var(--muted)">10⁵–10⁶ transitions</text>
    <rect x="580" y="128" width="120" height="40" rx="8" fill="none" stroke="var(--violet)" stroke-width="2"/><text x="640" y="153" text-anchor="middle">demos / old data</text>
    <path d="M520,56 L578,56" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar12a)"/><text x="525" y="50" font-size="11" fill="var(--muted)">act</text>
    <path d="M578,74 L522,74" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar12a)"/><text x="525" y="92" font-size="11" fill="var(--muted)">sample, G updates</text>
    <path d="M640,128 L640,88" stroke="var(--violet)" stroke-width="1.6" marker-end="url(#ar12a)"/>
    <text x="400" y="200" font-size="12" fill="var(--muted)">each sample reused for the whole run; UTD = G</text>
  </g>
</svg>
<figcaption>On-policy methods throw data away after each update; off-policy methods keep it in a buffer and can also ingest demonstrations or data from other policies.</figcaption>
</figure>

<h3>What makes a method off-policy</h3>
<p>The trick is to learn an <b>action-value</b> function $Q(s,a)$ with a Bellman backup that does not care who chose $a$. Given a transition $(s,a,r,s',d)$ from <i>any</i> source, the target for policy $\pi$ is</p>
<div class="formula"><span class="label">Bellman target for the current policy</span>
$$y = r + \gamma (1-d)\, \mathbb{E}_{a'\sim\pi(\cdot\mid s')}\big[Q_{\bar\phi}(s',a')\big]$$</div>
<p>The action $a$ in the transition was taken by the behaviour policy, but $Q(s,a)$ is defined as "take $a$ now, then follow $\pi$", so we only need $\pi$ at the <i>next</i> state, which we can query freely. Compare Monte Carlo returns or GAE: those sum rewards along the behaviour policy's trajectory, so they are tied to whoever generated it (fixing that needs importance weights, which blow up; see <a href="#/m/math">Module 00</a>). The one-step Q backup avoids importance sampling entirely. That is the entire reason Q-learning, DDPG, TD3 and SAC can reuse data.</p>
<p>$d$ is the <code>terminated</code> flag, not <code>truncated</code>: at a time limit you still bootstrap (the same bug as in <a href="#/m/gae">Module 04</a>, and it matters even more here because the buffer stores millions of these flags).</p>

<h3>The price: the deadly triad</h3>
<p>Off-policy data + bootstrapping + function approximation is Sutton & Barto's <b>deadly triad</b> (<a href="#/m/td">Module 02</a>): the critic regresses onto targets computed from itself, on state-actions the current policy may never visit, so errors can feed back and diverge. Everything in lessons 2 and 3 (target networks, twin critics, entropy) and everything in the offline half of this module (CQL, IQL) is a way of keeping that loop stable.</p>

<h3>Sample efficiency, in numbers you can feel</h3>
<table>
<thead><tr><th></th><th>PPO (on-policy)</th><th>SAC / TD3 (off-policy)</th></tr></thead>
<tbody>
<tr><td>Typical MuJoCo budget to learn well</td><td>~1–10M env steps</td><td>~0.3–3M env steps</td></tr>
<tr><td>Gradient steps per env step</td><td>small (epochs × minibatches / batch size)</td><td>1 by default; 10–20 in high-UTD variants</td></tr>
<tr><td>Wall-clock bottleneck</td><td>simulation (parallel envs help a lot)</td><td>gradient updates (often GPU bound)</td></tr>
<tr><td>Can use demos / old data</td><td>not directly</td><td>yes, drop them in the buffer</td></tr>
<tr><td>Stability</td><td>robust, forgiving</td><td>sensitive to critic divergence, hyperparameters</td></tr>
</tbody></table>
<p>The step counts are rough orders of magnitude from common benchmark curves, not guarantees; they vary a lot by task.</p>

<h3>The update-to-data ratio (UTD)</h3>
<p>UTD $G$ is the number of gradient updates per environment step. Raising $G$ from 1 to 20 squeezes more learning out of each sample, which is exactly what you want when samples are expensive. It also makes the critic overfit to early data and amplifies overestimation, so high-UTD methods (REDQ, RLPD, DroQ) pair it with <b>critic ensembles</b>, <b>LayerNorm</b> or <b>dropout</b>, and sometimes periodic <b>network resets</b>. DSRL's published configs use roughly 20–30 gradient steps per update with a small latent policy: cheap updates, expensive samples, so a high UTD is the right trade.</p>

<div class="callout key"><b>Key idea</b><p>On-policy = "estimate the gradient from fresh samples of myself". Off-policy = "learn a Q function from anyone's samples, then improve the policy against Q". The second is more sample-efficient and more fragile, and its fragility is all about the critic.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>Your LIBERO or ManiSkill rollouts cost a VLA forward pass per chunk plus rendering. DSRL runs SAC in the latent-noise space of the frozen VLA, so every rollout (including the very first ones, from the unsteered base policy) lands in a replay buffer and is reused at UTD ≈ 20. Recap-lite and filtered BC are "batch" methods: they also reuse all collected data, but in large rounds rather than per step. PPO-style fine-tuning (DPPO, πRL) is the on-policy outlier and typically needs far more env steps; that is why it is not one of your three core arms.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Why is SAC more sample-efficient than PPO?" Answer: it reuses every transition many times via a replay buffer, because the Q backup is valid for data from any behaviour policy; PPO's surrogate is only valid near the data-collecting policy, so it discards data after a few epochs. Follow-up: "So why does anyone use PPO?" Stability, simplicity, massive parallel simulation where samples are cheap, and LLMs, where a token-level Q function over a 150k vocabulary is impractical.</p></div>
`,
    },

    {
      id: "ddpg-td3",
      title: "Continuous-action Q-learning: DDPG and TD3",
      html: String.raw`
<p>DQN (<a href="#/m/td">Module 02</a>) needs $\max_{a'} Q(s',a')$. With a 7-D end-effector action, or a 50×7 action chunk, you cannot enumerate actions. The fix is to <b>learn the argmax</b>: an actor $\mu_\theta(s)$ trained to output the action that maximises the critic.</p>

<h3>DDPG: deterministic policy gradient</h3>
<p>The critic regresses to $y = r + \gamma(1-d)\, Q_{\bar\phi}(s', \mu_{\bar\theta}(s'))$ with target networks $\bar\phi, \bar\theta$ updated by Polyak averaging $\bar\phi \leftarrow (1-\tau)\bar\phi + \tau \phi$ (typically $\tau = 0.005$). The actor follows the critic's action-gradient:</p>
<div class="formula"><span class="label">Deterministic policy gradient (Silver et al. 2014)</span>
$$\nabla_\theta J(\theta) \approx \mathbb{E}_{s\sim\mathcal{D}}\Big[\nabla_a Q_\phi(s,a)\big|_{a=\mu_\theta(s)}\; \nabla_\theta \mu_\theta(s)\Big]$$</div>
<p>In code that is just <code>actor_loss = -critic(s, actor(s)).mean()</code>: autograd chains through the critic into the actor. Exploration comes from adding Gaussian noise to the action at collection time. Note what this needs: the critic must be differentiable in $a$, and its action-gradient must point somewhere sensible. If the critic is wrong in a region, the actor will happily climb into that region. That is overestimation's door into the policy.</p>

<h3>Overestimation: why max of noisy estimates is biased up</h3>
<p>Suppose every action has true value 0, and your critic's estimate is $\hat Q(a) = 0 + \varepsilon_a$ with independent zero-mean noise. Then $\mathbb{E}[\max_a \hat Q(a)] \gt  0 = \max_a Q(a)$, because the max picks whichever error happened to be positive. In general</p>
<div class="formula"><span class="label">Jensen for the max</span>
$$\mathbb{E}\big[\max_a \hat Q(s,a)\big] \;\ge\; \max_a \mathbb{E}\big[\hat Q(s,a)\big]$$</div>
<p>One backup's bias is small. But the target becomes the next regression label, and bootstrapping compounds it: if each backup adds bias $b$, the fixed point is roughly $\gamma b/(1-\gamma)$, which is 99$b$ at $\gamma=0.99$. An actor trained by gradient ascent on $Q$ is an even more aggressive maximiser than a discrete max, so DDPG is notorious for value explosions.</p>

<div data-widget="overest" data-title="Interactive · overestimation with single, double and clipped double Q"></div>

<h3>TD3: three fixes (Fujimoto et al. 2018)</h3>
<ol class="steps">
<li><b>Clipped double Q.</b> Keep two critics $Q_{\phi_1}, Q_{\phi_2}$ (and their targets), and use the minimum in the target. The min is biased <i>down</i>, which is much safer than biased up: underestimated actions are not preferentially selected by the actor, so the error does not get amplified.</li>
<li><b>Target policy smoothing.</b> Evaluate the target at a noisy action, $a' = \operatorname{clip}\big(\mu_{\bar\theta}(s') + \operatorname{clip}(\epsilon,-c,c), a_{\text{low}}, a_{\text{high}}\big)$, $\epsilon\sim\mathcal{N}(0,\tilde\sigma^2)$. This regularises the critic to be smooth in $a$, so the actor cannot exploit a narrow spike.</li>
<li><b>Delayed policy updates.</b> Update the actor (and the target networks) once every $d$ critic updates, so the actor chases a critic that has had time to settle.</li>
</ol>
<div class="formula"><span class="label">TD3 target</span>
$$y = r + \gamma (1-d)\,\min_{i=1,2} Q_{\bar\phi_i}\Big(s',\ \operatorname{clip}\big(\mu_{\bar\theta}(s') + \operatorname{clip}(\epsilon,-c,c),\,a_{\text{low}},a_{\text{high}}\big)\Big)$$</div>
<p>Paper defaults (for actions scaled to $[-1,1]$): $\tilde\sigma = 0.2$, $c = 0.5$, policy delay $d=2$, $\tau = 0.005$, exploration noise $\mathcal{N}(0, 0.1^2)$. Both critics regress to the <i>same</i> target $y$.</p>

<pre><code><span class="c"># TD3 update (one gradient step). Actions are in [-1, 1].</span>
<span class="k">with</span> torch.no_grad():
    noise = (torch.randn_like(a) * <span class="n">0.2</span>).clamp(-<span class="n">0.5</span>, <span class="n">0.5</span>)
    a2 = (actor_targ(s2) + noise).clamp(-<span class="n">1</span>, <span class="n">1</span>)
    q_targ = torch.min(q1_targ(s2, a2), q2_targ(s2, a2))
    y = r + gamma * (<span class="n">1</span> - term) * q_targ          <span class="c"># term = terminated, NOT truncated</span>
critic_loss = F.mse_loss(q1(s, a), y) + F.mse_loss(q2(s, a), y)
critic_opt.zero_grad(); critic_loss.backward(); critic_opt.step()

<span class="k">if</span> step % <span class="n">2</span> == <span class="n">0</span>:                                  <span class="c"># delayed actor update</span>
    actor_loss = -q1(s, actor(s)).mean()           <span class="c"># TD3 uses Q1 only for the actor</span>
    actor_opt.zero_grad(); actor_loss.backward(); actor_opt.step()
    polyak(q1_targ, q1, <span class="n">0.005</span>); polyak(q2_targ, q2, <span class="n">0.005</span>); polyak(actor_targ, actor, <span class="n">0.005</span>)
</code></pre>

<div class="callout warn"><b>Common bugs</b><p>(1) Backpropagating the actor loss into the critic's optimiser state: either zero the critic's grads before its own step or only step the actor's optimiser (the code above is fine because each optimiser only holds its own parameters, but the critic still accumulates <code>.grad</code> from the actor loss, so zero grads before every critic backward). (2) Using <code>done = terminated or truncated</code> in the target. (3) Forgetting to clip the smoothed target action back into the action bounds. (4) Rescaling: networks output $[-1,1]$, the environment wants physical units; keep one place that converts.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Why the <i>min</i> of two critics rather than the average?" The average of two noisy estimates of the same selected action is still biased up (both are evaluated at the action the actor chose to maximise $Q_1$). The min gives an approximate upper-bound correction: it can underestimate, but underestimation is not amplified by maximisation. "Is double DQN the same thing?" No: double DQN uses one network to select and the other to evaluate, which is roughly unbiased; clipped double Q is deliberately pessimistic.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>DSRL's actor outputs noise $w$ and its critic is $Q(s,w)$. All of TD3/SAC's critic hygiene applies unchanged: twin (or ensembled) critics, Polyak targets, terminated-vs-truncated. Interesting detail: the DSRL paper's π0 configs report <i>disabling</i> clipped double Q and using an ensemble of 10 critics with mean aggregation in simulation. With a sparse 0/1 reward, a deliberately pessimistic critic can be too slow to propagate the first successes. Treat "min vs mean over an ensemble" as a hyperparameter you sweep, and check the appendix of the paper for the exact setting per task.</p></div>
`,
    },
    /* ------------------------------------------------------------------ */
    {
      id: "sac",
      title: "Maximum-entropy RL and SAC",
      html: String.raw`
<p>Soft Actor-Critic (Haarnoja et al. 2018) is the default off-policy algorithm for continuous control, and the one DSRL runs in noise space. It changes the objective, not just the tricks:</p>
<div class="formula"><span class="label">Maximum-entropy objective</span>
$$J(\pi) = \mathbb{E}_{\tau\sim\pi}\Big[\sum_{t} \gamma^t\big(r(s_t,a_t) + \alpha\, \mathcal{H}\big(\pi(\cdot\mid s_t)\big)\big)\Big],\qquad \mathcal{H}(\pi(\cdot\mid s)) = \mathbb{E}_{a\sim\pi}[-\log \pi(a\mid s)]$$</div>
<p>The agent is paid $\alpha$ per nat of entropy it keeps. Effects: it explores by default (no hand-tuned action noise), it keeps several good behaviours alive instead of collapsing onto one, and its critic becomes smoother because the policy averages over actions rather than pinning a single argmax. $\alpha$ is the exchange rate between reward and randomness.</p>

<h3>Soft value functions</h3>
<p>With entropy in the return, the Bellman equations pick up a $-\alpha\log\pi$ term:</p>
<div class="formula"><span class="label">Soft Bellman backup</span>
$$Q(s,a) = r + \gamma\,\mathbb{E}_{s'}\big[V(s')\big],\qquad V(s) = \mathbb{E}_{a\sim\pi}\big[Q(s,a) - \alpha \log\pi(a\mid s)\big]$$</div>
<p>For a fixed $Q$, the policy that maximises $\mathbb{E}_{a\sim\pi}[Q(s,a)] + \alpha\mathcal{H}(\pi)$ is the <b>Boltzmann policy</b> $\pi^*(a\mid s) \propto \exp(Q(s,a)/\alpha)$, and then $V(s) = \alpha\log\int\exp(Q(s,a)/\alpha)\,da$, a "soft max". As $\alpha\to 0$ this becomes the hard max of ordinary Q-learning. SAC cannot represent an arbitrary Boltzmann density, so its policy step <b>projects</b> onto a Gaussian family by minimising reverse KL:</p>
<div class="formula"><span class="label">Soft policy improvement</span>
$$\pi_{\text{new}} = \arg\min_{\pi\in\Pi}\ \mathrm{KL}\Big(\pi(\cdot\mid s)\ \Big\Vert\ \frac{\exp(Q(s,\cdot)/\alpha)}{Z(s)}\Big) = \arg\min_\pi\ \mathbb{E}_{a\sim\pi}\big[\alpha\log\pi(a\mid s) - Q(s,a)\big]$$</div>
<p>Reverse KL is <b>mode-seeking</b>: a unimodal Gaussian fit to a two-peaked Boltzmann picks one peak rather than straddling both. The widget shows this directly.</p>

<div data-widget="softpol" data-title="Interactive · Boltzmann policy and SAC's Gaussian projection vs temperature α"></div>

<h3>The three SAC losses</h3>
<p><b>Critics</b> (two, with targets; Spinning Up / SAC v2 style, no separate V network):</p>
<div class="formula"><span class="label">Soft Q target</span>
$$y = r + \gamma(1-d)\Big(\min_{j=1,2} Q_{\bar\phi_j}(s',\tilde a') - \alpha\log\pi_\theta(\tilde a'\mid s')\Big),\quad \tilde a'\sim\pi_\theta(\cdot\mid s')$$</div>
<p><b>Actor</b>, using the <b>reparameterisation trick</b> (<a href="#/m/math">Module 00</a>): sample $\tilde a_\theta(s,\xi) = \tanh(\mu_\theta(s) + \sigma_\theta(s)\odot\xi)$, $\xi\sim\mathcal{N}(0,I)$, so the gradient flows through the sample into $\mu,\sigma$:</p>
<div class="formula"><span class="label">Actor loss</span>
$$L_\pi(\theta) = \mathbb{E}_{s\sim\mathcal{D},\,\xi}\Big[\alpha\log\pi_\theta(\tilde a_\theta(s,\xi)\mid s) - \min_{j} Q_{\phi_j}(s,\tilde a_\theta(s,\xi))\Big]$$</div>
<p><b>Temperature</b>: instead of fixing $\alpha$, constrain the policy's entropy to a target $\bar{\mathcal{H}}$ (default $-\dim\mathcal{A}$) and learn $\alpha$ by dual descent:</p>
<div class="formula"><span class="label">Automatic temperature</span>
$$L(\alpha) = \mathbb{E}_{a\sim\pi}\big[-\alpha\big(\log\pi(a\mid s) + \bar{\mathcal{H}}\big)\big]$$</div>
<p>If entropy is below target, $\log\pi + \bar{\mathcal H} \gt  0$ on average and the gradient pushes $\alpha$ up; above target, $\alpha$ shrinks. Optimise $\log\alpha$ for positivity.</p>

<h3>The tanh log-prob correction</h3>
<p>Squashing $u\sim\mathcal{N}(\mu,\sigma^2)$ by $a = \tanh(u)$ changes the density by the Jacobian: $\log\pi(a\mid s) = \log\mathcal{N}(u;\mu,\sigma^2) - \sum_i \log\big(1-\tanh^2(u_i)\big)$. Computing $1-\tanh^2$ directly underflows for large $|u|$; use the identity $\log(1-\tanh^2 u) = 2\big(\log 2 - u - \operatorname{softplus}(-2u)\big)$. If you then rescale to $[-b, b]$ (as DSRL does for noise), subtract another $\dim\cdot\log b$, which is a constant and does not affect gradients, but does affect what "target entropy" means.</p>

<pre><code><span class="c"># SAC update, PyTorch. Actor returns (action in [-1,1], log_prob).</span>
<span class="k">def</span> sample(actor, s):
    mu, log_std = actor(s).chunk(<span class="n">2</span>, -<span class="n">1</span>)
    log_std = log_std.clamp(-<span class="n">5</span>, <span class="n">2</span>)
    u = mu + log_std.exp() * torch.randn_like(mu)            <span class="c"># reparameterised</span>
    a = torch.tanh(u)
    logp = Normal(mu, log_std.exp()).log_prob(u).sum(-<span class="n">1</span>)
    logp -= (<span class="n">2</span> * (math.log(<span class="n">2</span>) - u - F.softplus(-<span class="n">2</span> * u))).sum(-<span class="n">1</span>)
    <span class="k">return</span> a, logp

<span class="k">with</span> torch.no_grad():
    a2, logp2 = sample(actor, s2)
    q_t = torch.min(q1_t(s2, a2), q2_t(s2, a2)) - alpha * logp2
    y = r + gamma * (<span class="n">1</span> - term) * q_t
q_loss = F.mse_loss(q1(s, a), y) + F.mse_loss(q2(s, a), y)

a_pi, logp = sample(actor, s)
q_pi = torch.min(q1(s, a_pi), q2(s, a_pi))
pi_loss = (alpha * logp - q_pi).mean()

alpha_loss = -(log_alpha.exp() * (logp.detach() + target_entropy)).mean()
alpha = log_alpha.exp().item()
<span class="c"># step q_opt, pi_opt, alpha_opt; polyak-update q1_t, q2_t with tau=0.005</span>
</code></pre>

<h3>Defaults worth knowing</h3>
<table><thead><tr><th>Hyperparameter</th><th>Common default</th><th>When you push it</th></tr></thead><tbody>
<tr><td>lr (actor, critic, α)</td><td>3e-4</td><td>too high: critic divergence; DSRL's π0 config uses 1e-4 actor / 3e-4 critic</td></tr>
<tr><td>batch</td><td>256</td><td>bigger helps stability at high UTD</td></tr>
<tr><td>γ</td><td>0.99</td><td>sparse long-horizon success tasks often need 0.99–0.999 per decision</td></tr>
<tr><td>τ (Polyak)</td><td>0.005</td><td>larger: faster but less stable targets</td></tr>
<tr><td>target entropy</td><td>$-\dim\mathcal{A}$</td><td>higher: more exploration; DSRL reports $-d/2$ (sim) and 0 (real) in noise space</td></tr>
<tr><td>random warm-up steps</td><td>~5k–25k</td><td>in DSRL, warm-up with $w\sim\mathcal{N}(0,I)$ is just running the base policy</td></tr>
</tbody></table>

<div class="callout tip"><b>Practical advice</b><p>Log $\alpha$, policy entropy, mean $Q$ on buffer samples, mean target $y$, and critic loss. A healthy run has $Q$ tracking the scale of actual discounted returns. With 0/1 sparse rewards and $\gamma=0.99$, $Q$ should live in $[0,1]$ (plus the entropy term); a critic reporting 30 is diverging. With entropy bonuses the soft Q can be negative or exceed 1, which is another reason to watch $\alpha\log\pi$ separately.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Why does SAC use the reparameterisation trick while PPO uses the score function?" SAC has a differentiable critic $Q(s,a)$, so it can backprop through the sampled action, giving low-variance gradients. PPO only has scalar advantages for sampled actions, so it uses $\nabla\log\pi\cdot A$. "What is the target entropy for a 7-D action?" $-7$ nats by the usual heuristic. "Why does SAC's entropy not explode?" The temperature is tuned to hold entropy at the target.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>DSRL-SAC is this exact code with $a$ renamed to $w$ (the noise fed to the frozen VLA), action bounds $[-b_W, b_W]$, and the environment step replaced by "denoise $w$ into a chunk, execute it, sum the rewards". Your entropy term now means "how spread out is the noise you feed the VLA", which directly controls how much of the base policy's own diversity you keep.</p></div>
`,

      id: "replay-utd",
      title: "Replay buffers, n-step returns and high-UTD stability",
      html: String.raw`
<p>The replay buffer is the least glamorous and most bug-prone part of an off-policy system. This lesson is the lab manual for it, plus the stabilisers that let you crank the update-to-data ratio.</p>

<h3>What to store</h3>
<p>Store $(s, a, r, s', \text{terminated}, \text{truncated})$, plus anything you will need later to relabel or condition: task id / language instruction, episode id, step index, success flag, and for chunked policies the chunk and how many steps of it were executed. For image observations, storing both $s$ and $s'$ doubles memory; store frames once with an episode index and reconstruct $s'$ by offset. Rough sizing: 100k transitions of two 128×128×3 uint8 images is about 10 GB; 64×64 is a quarter of that. Keep images as <code>uint8</code> and convert on the GPU.</p>

<h3>Sampling</h3>
<ul>
<li><b>Uniform</b> sampling is the default and works.</li>
<li><b>Prioritised replay</b> (by TD error) helps in some discrete domains, is rarely worth the complexity for continuous control.</li>
<li><b>Mixed / symmetric sampling</b>: half of each batch from the online buffer, half from a fixed offline buffer (demos). This is RLPD's key trick (lesson 8); it keeps demonstrations influential even when they are 1% of the data.</li>
</ul>

<h3>n-step returns</h3>
<p>With sparse rewards, a one-step backup propagates a success back by one step per "sweep" of the critic. The n-step target sums $n$ real rewards before bootstrapping:</p>
<div class="formula"><span class="label">n-step target</span>
$$y_t = \sum_{k=0}^{n-1}\gamma^k r_{t+k} + \gamma^n (1-d_{t+n-1})\, \max\text{-ish}\; Q_{\bar\phi}(s_{t+n}, a')$$</div>
<p>It is faster and lower-bias in propagation, but the intermediate actions came from the behaviour policy, so it is only exactly correct on-policy. With $n=3$–5 the bias is usually worth it. Action chunking gives you a natural form of this: one "decision" executes $h$ low-level steps, so a chunk-level backup is already an $h$-step backup over low-level time (this is the insight behind Q-chunking, Li et al. 2025).</p>

<h3>Chunk-level MDP bookkeeping</h3>
<p>When the policy outputs a chunk of $H$ actions and you execute $h\le H$ of them before replanning, define the decision-level transition as $(s_t, \text{chunk}_t, R_t, s_{t+h})$ with $R_t = \sum_{k=0}^{h-1}\gamma^k r_{t+k}$ and per-decision discount $\gamma^h$. If success happens mid-chunk, stop executing, mark <code>terminated</code>, and use only the rewards received. Report <b>both</b> decision counts and low-level env steps; the comparison in Phase 2 should be in low-level env steps.</p>

<h3>Stabilisers for high UTD</h3>
<div class="grid2">
<div><h4>Critic ensembles</h4><p>Train $E$ critics (e.g. 10) on the same targets. REDQ computes the target from the min over a random subset of 2; others take the mean or a lower-confidence bound. Ensembles reduce variance and give an uncertainty estimate for free.</p></div>
<div><h4>LayerNorm in the critic</h4><p>Normalising hidden activations bounds how far $Q$ can extrapolate on out-of-distribution actions, which tames the feedback loop. RLPD found it essential when mixing offline data.</p></div>
<div><h4>Resets</h4><p>Periodically re-initialise the last layers (or all) of the networks while keeping the buffer. This fights "primacy bias": overfitting to the first data at high UTD (Nikishin et al. 2022).</p></div>
<div><h4>Target networks</h4><p>Polyak $\tau=0.005$. With very high UTD some methods slow targets further or update them less often. Never regress a critic onto itself without them.</p></div>
</div>

<h3>A minimal buffer that does the right thing</h3>
<pre><code><span class="k">class</span> Replay:
    <span class="k">def</span> __init__(self, cap, obs_dim, act_dim, device):
        self.s  = torch.zeros(cap, obs_dim);  self.a = torch.zeros(cap, act_dim)
        self.r  = torch.zeros(cap);           self.s2 = torch.zeros(cap, obs_dim)
        self.term = torch.zeros(cap)          <span class="c"># 1 only for true terminal states</span>
        self.cap, self.n, self.i, self.dev = cap, <span class="n">0</span>, <span class="n">0</span>, device
    <span class="k">def</span> add(self, s, a, r, s2, terminated):
        j = self.i
        self.s[j], self.a[j], self.r[j], self.s2[j], self.term[j] = s, a, r, s2, float(terminated)
        self.i = (j + <span class="n">1</span>) % self.cap; self.n = min(self.n + <span class="n">1</span>, self.cap)
    <span class="k">def</span> sample(self, B):
        idx = torch.randint(<span class="n">0</span>, self.n, (B,))
        <span class="k">return</span> [x[idx].to(self.dev) <span class="k">for</span> x <span class="k">in</span> (self.s, self.a, self.r, self.s2, self.term)]

<span class="c"># RLPD-style symmetric batch: half online, half offline demos</span>
<span class="k">def</span> mixed_batch(online, offline, B):
    a = online.sample(B // <span class="n">2</span>); b = offline.sample(B - B // <span class="n">2</span>)
    <span class="k">return</span> [torch.cat([x, y]) <span class="k">for</span> x, y <span class="k">in</span> zip(a, b)]
</code></pre>

<div class="callout warn"><b>Classic replay bugs</b><p>(1) On a truncated episode, storing <code>s2</code> as the <i>reset</i> observation of the next episode (vector envs auto-reset: Gymnasium puts the true last observation in <code>info["final_observation"]</code> or, in newer versions, uses a different autoreset mode; check your version). (2) Writing <code>terminated=True</code> on timeouts. (3) Sampling indices that are still being written in a multi-process collector. (4) Normalising observations with running statistics that drift, so old transitions in the buffer are interpreted differently over time.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>Use one buffer per method run, keyed by task id, with a success flag per episode. The same stored rollouts feed three things: DSRL's SAC updates, Recap-lite's value-function training set, and filtered BC's "successful episodes" set. Saving them to disk (LeRobot dataset format is convenient, see <a href="#/m/sim">Module 14</a>) lets you re-run the batch methods on exactly the same data, which is a great fairness control.</p></div>
`,

    {
      id: "offline-shift",
      title: "Offline RL: distribution shift and extrapolation error",
      html: String.raw`
<p><b>Offline RL</b> (batch RL) learns a policy from a fixed dataset $\mathcal{D}$ collected by some behaviour policy $\pi_\beta$, with <i>no</i> further interaction. It is the setting of "we have 10k hours of robot logs, make a better policy". It is also, in disguise, what you do every time you train on a buffer whose data was not generated by the current policy, including each "round" of Recap.</p>

<h3>Why naive off-policy RL fails offline</h3>
<p>Run SAC on a fixed buffer and it usually collapses. The target $y = r + \gamma \max_{a'} Q(s',a')$ (or $\mathbb{E}_{a'\sim\pi}$ with $\pi$ trained to maximise $Q$) queries $Q$ at actions $a'$ the dataset never contains. Function approximation will output <i>something</i> there, often too high. The actor then moves toward those fantasy actions, the targets rise further, and online you would discover the mistake by trying the action and getting a bad reward. Offline you never get that correction. This is <b>extrapolation error</b> (Fujimoto et al. 2019, BCQ) and the root cause of <b>distribution shift</b> between $\pi$ and $\pi_\beta$.</p>

<div data-widget="extrap" data-title="Interactive · extrapolation error: a Q function fitted to data, maximised everywhere"></div>

<h3>Two families of fixes</h3>
<div class="grid2">
<div><h4>Be pessimistic about unseen actions</h4><p><b>Value regularisation</b>: change the critic so that out-of-distribution actions look bad. CQL pushes Q down on actions sampled from the policy (or a broad distribution) and up on dataset actions. Ensembles with lower-confidence bounds (e.g. EDAC, SAC-N) do it through uncertainty.</p></div>
<div><h4>Never query unseen actions</h4><p><b>In-sample learning / policy constraints</b>: learn values using only $(s,a)$ pairs in the data (IQL, SARSA-style evaluation of $\pi_\beta$), then extract a policy that stays close to $\pi_\beta$ (AWR, BC regularisation like TD3+BC, BCQ's generative model of $\pi_\beta$).</p></div>
</div>

<h3>CQL in one line</h3>
<div class="formula"><span class="label">Conservative Q-learning (Kumar et al. 2020), CQL(H)</span>
$$\min_\phi\ \alpha\,\mathbb{E}_{s\sim\mathcal{D}}\Big[\log\sum_a \exp Q_\phi(s,a) - \mathbb{E}_{a\sim\mathcal{D}(\cdot\mid s)}\big[Q_\phi(s,a)\big]\Big] + \tfrac12\,\mathbb{E}_{\mathcal{D}}\Big[\big(Q_\phi(s,a) - \mathcal{B}^\pi\bar Q(s,a)\big)^2\Big]$$</div>
<p>The log-sum-exp is a soft maximum over all actions: minimising it pushes down whatever actions $Q$ currently likes most, while the second term pushes up the actions the data actually took. The result is a Q function whose expected value under the learned policy lower-bounds the true value (under the paper's assumptions). For continuous actions the log-sum-exp is estimated with importance-sampled actions from a uniform distribution and the current policy. In a tabular analysis the CQL update is the usual backup minus a penalty $\alpha\big(\mu(a\mid s)/\pi_\beta(a\mid s) - 1\big)$: actions the data rarely takes ($\pi_\beta$ small) are penalised heavily. That is what the "CQL" curve in the widget computes.</p>

<h3>Policy constraints: TD3+BC</h3>
<p>The simplest strong baseline: TD3 with a behaviour cloning term in the actor loss, $L_\pi = -\lambda\, Q(s,\mu(s))/\overline{|Q|} + (\mu(s) - a)^2$ (Fujimoto & Gu 2021). The normalisation by the average $|Q|$ makes $\lambda$ (they use 2.5) roughly scale-free. It is a good mental model for "RL as a small correction to BC".</p>

<h3>The offline RL trade-off, stated plainly</h3>
<p>Too little constraint: the policy exploits critic errors. Too much: you recover behaviour cloning and can never beat the data. The interesting regime is "stitching": combining good pieces of different trajectories (the start of trajectory A, the end of trajectory B) into a policy better than any single trajectory, while staying on actions the data supports. Offline RL can only improve where the data has <b>coverage</b> of better actions.</p>

<div class="callout key"><b>Key idea</b><p>Offline RL's problem is not "not enough data", it is "queries outside the data". Every offline method is a decision about what to do when the policy wants an action the dataset has never shown you: penalise it (CQL), never ask (IQL), or stay near the data (BC constraints, AWR).</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>DSRL has a neat, built-in version of the "stay in support" constraint: the frozen diffusion/flow policy maps <i>any</i> noise to an action that looks like the demonstrations, so the RL policy literally cannot output an arbitrary out-of-distribution action. The DSRL paper credits this for its offline variant's conservatism. Recap's value function is trained only on executed actions with Monte Carlo returns, which is the in-sample family. Neither queries a Q function on actions nobody tried.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Why can't I just run SAC on my offline dataset?" Extrapolation error: the target maximises over actions that are not in the data, the critic overestimates them, and there is no new data to correct it. "Why does BC sometimes beat offline RL?" When the data is narrow, expert-ish, and the reward signal is weak or the dataset has little coverage of better actions, the constraint dominates and RL adds noise.</p></div>
`,

    {
      id: "iql",
      title: "IQL: expectile regression and in-sample maximisation",
      html: String.raw`
<p>Implicit Q-Learning (Kostrikov, Nair & Levine 2021) is the cleanest in-sample method and the one you are most likely to borrow pieces from. It never evaluates $Q$ at an action that is not in the dataset, yet it still learns something close to the value of the best in-support action rather than the average behaviour.</p>

<h3>The idea</h3>
<p>SARSA-style evaluation, $y = r + \gamma Q(s', a'_{\text{data}})$, is perfectly in-sample but learns $Q^{\pi_\beta}$, the value of the behaviour policy: no improvement. Q-learning's $\max_{a'}$ improves but leaves the data. IQL interpolates: learn a state value $V(s)$ as an <b>upper expectile</b> of $Q(s,a)$ over the dataset's actions at $s$. As the expectile level $\tau\to 1$, this approaches the maximum over actions that have support in the data.</p>

<h3>Expectiles</h3>
<p>The $\tau$-expectile $m_\tau$ of a random variable $X$ minimises an <b>asymmetric squared loss</b>:</p>
<div class="formula"><span class="label">Expectile loss</span>
$$m_\tau = \arg\min_m \mathbb{E}\big[L_2^\tau(X - m)\big],\qquad L_2^\tau(u) = \big\lvert\tau - \mathbf{1}(u\lt 0)\big\rvert\, u^2$$</div>
<p>With $\tau = 0.5$ it is ordinary MSE and $m$ is the mean. With $\tau = 0.9$, positive residuals ($X \gt  m$) cost 9 times more than negative ones, so $m$ moves up until the weighted pull balances: $\tau\,\mathbb{E}[(X-m)_+] = (1-\tau)\,\mathbb{E}[(m-X)_+]$. Expectiles are to squared loss what quantiles are to absolute loss, and they are smooth in $m$, which makes them easy to fit with SGD.</p>

<div data-widget="expectile" data-title="Interactive · expectile regression: how τ moves the estimate from the mean toward the max"></div>

<h3>IQL's three losses</h3>
<div class="formula"><span class="label">IQL</span>
$$\begin{aligned}
L_V(\psi) &= \mathbb{E}_{(s,a)\sim\mathcal{D}}\Big[L_2^\tau\big(Q_{\bar\theta}(s,a) - V_\psi(s)\big)\Big]\\
L_Q(\theta) &= \mathbb{E}_{(s,a,r,s')\sim\mathcal{D}}\Big[\big(r + \gamma(1-d) V_\psi(s') - Q_\theta(s,a)\big)^2\Big]\\
L_\pi(\phi) &= -\mathbb{E}_{(s,a)\sim\mathcal{D}}\Big[\exp\big(\beta\,(Q_{\bar\theta}(s,a) - V_\psi(s))\big)\,\log\pi_\phi(a\mid s)\Big]
\end{aligned}$$</div>
<p>Every expectation is over dataset tuples: no action is ever sampled from the learned policy during value learning. The Q target uses $V(s')$ rather than $Q(s', \pi(s'))$, which is how the max sneaks in without leaving the data. The policy is extracted at the end (or concurrently) by <b>advantage-weighted regression</b> (next lesson). Paper settings: $\tau = 0.7$, $\beta = 3$ on MuJoCo locomotion; $\tau = 0.9$, $\beta = 10$ on AntMaze; exponentiated advantages clipped (at 100). Note that IQL's $\beta$ is an <i>inverse</i> temperature (it multiplies $A$), while AWR's paper divides by a temperature; mixing these up is a classic bug.</p>

<pre><code><span class="k">def</span> expectile_loss(diff, tau):                       <span class="c"># diff = Q - V</span>
    w = torch.where(diff &gt; <span class="n">0</span>, tau, <span class="n">1</span> - tau)
    <span class="k">return</span> (w * diff.pow(<span class="n">2</span>)).mean()

<span class="c"># one IQL step on an offline batch (s, a, r, s2, term)</span>
<span class="k">with</span> torch.no_grad():
    q_t = torch.min(q1_t(s, a), q2_t(s, a))
v_loss = expectile_loss(q_t - V(s), tau=<span class="n">0.7</span>)

<span class="k">with</span> torch.no_grad():
    y = r + gamma * (<span class="n">1</span> - term) * V(s2)
q_loss = F.mse_loss(q1(s, a), y) + F.mse_loss(q2(s, a), y)

<span class="k">with</span> torch.no_grad():
    adv = q_t - V(s)
    w = torch.exp(beta * adv).clamp(max=<span class="n">100.0</span>)
pi_loss = -(w * policy.log_prob(s, a)).mean()       <span class="c"># weighted BC</span>
</code></pre>

<h3>Why it matters beyond D4RL</h3>
<ul>
<li><b>It decouples value learning from policy class.</b> The value is learned without ever sampling from the policy, so the policy can be anything with a log-likelihood or a weighted training loss: a diffusion policy (IDQL, Hansen-Estruch et al. 2023 re-ranks diffusion samples with IQL's critic), a flow VLA, an autoregressive token policy.</li>
<li><b>It fine-tunes well online.</b> Because the critic is not artificially pessimistic, IQL transitions from offline to online smoothly (CQL needs calibration fixes, e.g. Cal-QL).</li>
<li><b>Expectiles are a knob from "evaluate the data" to "optimal in support".</b> $\tau = 0.5$ gives $V^{\pi_\beta}$; larger $\tau$ is more optimistic, and with stochastic dynamics too large a $\tau$ starts treating lucky outcomes as achievable.</li>
</ul>

<div class="callout warn"><b>Pitfall</b><p>The expectile is taken over the <i>action</i> distribution at a state, but IQL fits it from single samples $(s,a)$ with function approximation. In a dataset where each state appears once (continuous states), $V(s)$ generalises across nearby states; the "max over in-support actions" interpretation is approximate. Also, with stochastic transitions an upper expectile of $Q$ conflates good actions with good luck in $s'$, because $Q$ itself is fit to sampled next states.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>A Recap-lite value function can be trained with Monte Carlo targets (what π*0.6 does, simplest), or with IQL-style TD (more sample-efficient, can stitch, more moving parts). If your rollouts are few, an IQL critic on chunk-level transitions is the natural upgrade path, and its advantage $Q(s,a)-V(s)$ is exactly what you would threshold into an "Advantage: positive" label.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"How does IQL avoid querying out-of-distribution actions?" The V loss uses only dataset actions; the Q target uses $V(s')$, not $Q(s',\pi(s'))$; and the policy is extracted by weighted BC on dataset actions. "What is $\tau$ doing?" Making $V$ an upper expectile of $Q$ over dataset actions, approaching the in-support max as $\tau\to1$.</p></div>
`,
