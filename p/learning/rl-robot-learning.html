    {
      id: "awr-conditioning",
      title: "AWR, filtered BC and advantage-conditioned policies",
      html: String.raw`
<p>Once you have a value function, how do you turn it into a better policy <i>without</i> doing gradient ascent on a critic? This is the question Recap answers for a 4B-parameter flow VLA, and the answer family starts with AWR.</p>

<h3>Derivation: KL-regularised policy improvement</h3>
<p>Maximise advantage while staying close to the behaviour policy:</p>
<div class="formula"><span class="label">Constrained improvement</span>
$$\max_\pi\ \mathbb{E}_{a\sim\pi(\cdot\mid s)}\big[A(s,a)\big] - \beta\,\mathrm{KL}\big(\pi(\cdot\mid s)\,\Vert\,\pi_\beta(\cdot\mid s)\big)$$</div>
<p>Take the functional derivative with a normalisation constraint and you get the closed form (the same algebra as the RLHF optimum in <a href="#/m/rlhf">Module 07</a>):</p>
<div class="formula"><span class="label">Optimal non-parametric policy</span>
$$\pi^*(a\mid s) = \frac{1}{Z(s)}\,\pi_\beta(a\mid s)\,\exp\big(A(s,a)/\beta\big)$$</div>
<p>We cannot represent $\pi^*$ directly, so we project it onto our policy class with <b>forward</b> KL, $\min_\theta \mathrm{KL}(\pi^*\Vert\pi_\theta)$, which (dropping constants, and ignoring the $Z(s)$ per-state normaliser as AWR does) becomes a weighted maximum-likelihood problem on the data we already have:</p>
<div class="formula"><span class="label">AWR / AWAC policy update</span>
$$\theta \leftarrow \arg\max_\theta\ \mathbb{E}_{(s,a)\sim\mathcal{D}}\Big[\exp\big(A(s,a)/\beta\big)\,\log\pi_\theta(a\mid s)\Big]$$</div>
<p>That is BC where each sample's loss is multiplied by $w = \exp(A/\beta)$. No gradient through the critic, no sampling from $\pi_\theta$, works with any policy that has a likelihood or a per-sample training loss (for diffusion/flow policies you weight the denoising or flow-matching loss, which is a lower-bound surrogate for the likelihood). AWR (Peng et al. 2019) fits $A$ with Monte Carlo/TD($\lambda$) returns; AWAC (Nair et al. 2020) fits a Q function off-policy; IQL uses its expectile critic. Practical versions clip the weights (AWR used a max weight of 20) or normalise them per batch.</p>

<div data-widget="awr" data-title="Interactive · AWR weights vs temperature, and the filtered-BC limit"></div>

<h3>The limits of β</h3>
<ul>
<li>$\beta\to\infty$: all weights equal, plain BC on the data.</li>
<li>$\beta\to 0$: all weight on the single best sample, high variance, effective sample size collapses.</li>
<li><b>Filtered BC</b> (keep the top fraction by advantage or return, weight 1, discard the rest) is the "hard threshold" cousin. <b>BC on successful episodes only</b> is filtered BC with the episode outcome as the score. It is the Phase 2 baseline, and it is a legitimately strong one.</li>
</ul>

<h3>Conditioning instead of weighting</h3>
<p>Weighting throws information away: a sample with weight 0.01 barely trains the model. <b>Conditioning</b> trains on <i>all</i> data but tells the model which samples were good, then asks for "good" at test time.</p>
<div class="grid2">
<div><h4>Return-conditioned (Decision Transformer, RvS)</h4><p>Train $\pi(a_t\mid s_t, \hat R_t)$ with $\hat R_t$ the return-to-go actually achieved; at test time condition on a high target return. Decision Transformer (Chen et al. 2021) does this with a GPT over (return, state, action) tokens. Weakness: in stochastic environments, high returns may come from luck, and conditioning on them asks for luck (Paster et al., "You can't count on luck").</p></div>
<div><h4>Advantage-conditioned (Recap)</h4><p>Train $\pi(a_t\mid s_t, I_t)$ with $I_t = \mathbf{1}\big(\hat A(s_t,a_t) \gt  \epsilon\big)$. The advantage subtracts the state's baseline $V(s_t)$, so "positive" means "better than this policy usually does from here", not "this episode happened to start in an easy state". At test time condition on $I=1$.</p></div>
</div>

<h3>Why conditioning is policy improvement: the CFG view</h3>
<p>Let $o\in\{0,1\}$ be an "optimality" event with $p(o=1\mid s,a)$ increasing in $A(s,a)$. Bayes' rule gives</p>
<div class="formula"><span class="label">Conditioning = reweighting</span>
$$\pi_\beta(a\mid s, o=1) = \frac{\pi_\beta(a\mid s)\,p(o=1\mid s,a)}{p(o=1\mid s)} \;\propto\; \pi_\beta(a\mid s)\,p(o=1\mid s,a)$$</div>
<p>So a model that has learned the conditional $\pi(a\mid s,o)$ by plain supervised learning on labelled data already represents an improved policy: with $p(o=1\mid s,a)\propto\exp(A/\beta)$ it is exactly AWR's $\pi^*$. <b>Classifier-free guidance</b> sharpens it further: with both the conditional and unconditional model (train with the label randomly dropped),</p>
<div class="formula"><span class="label">Guided policy</span>
$$\pi_w(a\mid s) \;\propto\; \pi(a\mid s)\left(\frac{\pi(a\mid s,o=1)}{\pi(a\mid s)}\right)^{w} \;\propto\; \pi_\beta(a\mid s)\,p(o=1\mid s,a)^{w}$$</div>
<p>For a diffusion/flow policy this is the familiar score/velocity mix $v = v_{\text{uncond}} + w\,(v_{\text{cond}} - v_{\text{uncond}})$. $w=1$ is plain conditioning; $w\gt 1$ is a stronger improvement step, tunable at test time. Frans, Park, Abbeel & Levine (2025, CFGRL) make this argument formally; π*0.6's Recap paper cites it and mostly uses $w=1$, noting that high guidance weights can produce overly aggressive behaviour.</p>

<div class="callout key"><b>Key idea</b><p>Weighting, filtering and conditioning are three implementations of the same KL-regularised improvement $\pi_\beta\cdot f(A)$. Conditioning keeps all the data in the training signal (the "negative" examples still teach the model what the task looks like), and lets you pick the strength of improvement at inference.</p></div>

<div class="callout warn"><b>Pitfall</b><p>Return conditioning with returns that depend mostly on the initial state (some LIBERO initial layouts are just easier) teaches "high return ↔ easy layout", not "high return ↔ good actions". This is the main reason to condition on <i>advantage</i>, and the reason filtered BC on successes can quietly overfit to easy initial states.</p></div>

<div class="callout example"><b>In Phase 2 this means</b><p>Recap-lite = (a) train a value $V(o,\ell)$ on all rollouts, (b) compute $\hat A$ per chunk, (c) label $I_t$ by a per-task threshold, (d) fine-tune SmolVLA/π0.5 with "Advantage: positive/negative" in the prompt (dropped at random), (e) deploy with "positive". Filtered BC = skip (a–c), keep only successful episodes. AWR is the middle arm if you want an ablation: same value, weights instead of labels (π*0.6 reports AWR as a weaker policy-extraction baseline in their setting).</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Derive AWR." Write the KL-regularised objective, solve for $\pi^*\propto\pi_\beta e^{A/\beta}$, project with forward KL to get weighted log-likelihood. "Why forward KL for the projection?" Because it becomes an expectation over $\pi^*$, which we can rewrite as a reweighted expectation over the data; reverse KL would need samples from $\pi_\theta$ and a density for $\pi^*$.</p></div>

<p>Two practical topics that Phase 2 leans on heavily: how to build a value function for a sparse-success manipulation task, and how to use a handful of demonstrations inside online RL without them being drowned out.</p>

<h3>Reward choices for "did it succeed?"</h3>
<table><thead><tr><th>Reward</th><th>Value means</th><th>Notes</th></tr></thead><tbody>
<tr><td>$r=1$ at success, else 0; $\gamma\lt 1$</td><td>$V(s)=\mathbb{E}[\gamma^{T_{\text{succ}}-t}\mathbf{1}\{\text{success}\}]$</td><td>mixes probability and speed; in $[0,1]$; DSRL-style</td></tr>
<tr><td>$r=-1$ per step, 0 at success, $-C$ on failure</td><td>$V(s) = -\mathbb{E}[\text{steps to success}]$ (failure: large negative)</td><td>π*0.6/Recap's choice, normalised to $(-1,0)$ per task by the max episode length</td></tr>
<tr><td>$r=1$ at success only, $\gamma=1$</td><td>$V(s)=P(\text{success}\mid s)$</td><td>a <b>success predictor</b>; easy to calibrate and to read; ignores speed</td></tr>
</tbody></table>
<p>The middle row is worth internalising. "Steps to go" gives a dense signal inside successful episodes (being one step closer to done is better), and the failure penalty separates "slow" from "never". Its advantage $\hat A_t = \sum_{k\lt N} r_{t+k} + V(o_{t+N}) - V(o_t)$ answers "did the next $N$ steps make more progress than this policy usually does from here?"</p>

<h3>Monte Carlo vs TD for the value</h3>
<div class="grid2">
<div><h4>Monte Carlo targets</h4><p>Regress $V(o_t)$ on the realised return-to-go of the episode. Unbiased for the data-collecting policy, no bootstrapping, no deadly triad, trivially parallel. High variance, and it evaluates $\pi_\beta$ (the mixture of policies that generated the data), not the improved policy. π*0.6 uses MC and says so: simpler and reliable, if less optimal than an off-policy Q.</p></div>
<div><h4>TD / IQL targets</h4><p>Lower variance, can stitch trajectories, can evaluate a better policy than the data. Needs target networks, can diverge, has more hyperparameters. Worth it when rollouts are scarce or tasks are long.</p></div>
</div>

<h3>Distributional values via classification</h3>
<p>Instead of MSE regression, discretise the value range into $B$ bins and train with cross-entropy; the scalar value is the expectation over bins. Farebrother et al. (2024, "Stop regressing") show cross-entropy with smoothed targets (HL-Gauss) scales better than MSE for value learning with big networks. π*0.6's value model predicts a distribution over 201 bins with cross-entropy against discretised MC returns. For a small Recap-lite value head, 51–101 bins with a Gaussian-smoothed target is plenty.</p>

<pre><code><span class="c"># HL-Gauss style target: put a Gaussian over bins centred on the return</span>
<span class="k">def</span> hl_gauss_target(g, edges, sigma):            <span class="c"># g: (B,), edges: (nb+1,)</span>
    cdf = <span class="n">0.5</span> * (<span class="n">1</span> + torch.erf((edges[<span class="k">None</span>] - g[:, <span class="k">None</span>]) / (sigma * math.sqrt(<span class="n">2</span>))))
    p = cdf[:, <span class="n">1</span>:] - cdf[:, :-<span class="n">1</span>]
    <span class="k">return</span> p / p.sum(-<span class="n">1</span>, keepdim=<span class="k">True</span>)
centers = (edges[<span class="n">1</span>:] + edges[:-<span class="n">1</span>]) / <span class="n">2</span>
loss = -(hl_gauss_target(G, edges, sigma=<span class="n">0.75</span> * (edges[<span class="n">1</span>] - edges[<span class="n">0</span>])) * logits.log_softmax(-<span class="n">1</span>)).sum(-<span class="n">1</span>).mean()
V = (logits.softmax(-<span class="n">1</span>) * centers).sum(-<span class="n">1</span>)
</code></pre>

<div class="callout tip"><b>Check your value before you use it</b><p>(1) Plot $V(o_t)$ over time for 10 successful and 10 failed held-out episodes: success curves should rise toward 0 (or 1), failures should stay low or drop at the moment things go wrong (a dropped object). (2) Calibration: bin episodes by predicted success at $t=0$, compare to actual success rate. (3) Hold out whole episodes (not random frames) for validation, otherwise neighbouring frames leak. A value function that cannot rank held-out episodes better than chance will produce random advantage labels.</p></div>

<h3>RLPD: offline data in online RL (Ball, Smith, Kostrikov & Levine 2023)</h3>
<p>The question: you have some demos or prior data and an environment. Pretrain offline then fine-tune (with CQL/IQL machinery)? RLPD's answer: no pretraining, just run a well-regularised off-policy algorithm from scratch with the offline data in the buffer, and get three design choices right:</p>
<ol class="steps">
<li><b>Symmetric sampling</b>: every batch is 50% offline data, 50% online replay. Demos stay influential even when they are a tiny fraction of the data.</li>
<li><b>LayerNorm in the critic</b>: bounds Q extrapolation on out-of-distribution actions, which is what makes naive SAC-with-offline-data blow up.</li>
<li><b>Sample efficiency stack</b>: high UTD (e.g. 20) with a critic ensemble (e.g. 10, target from a random subset as in REDQ). Check the paper for per-domain settings, they vary.</li>
</ol>
<p>It was state of the art on many offline-to-online benchmarks while being simple. It also shows up as a baseline in the DSRL paper's real-robot experiments, where (from a 10-demo base) RLPD did not learn within the small online budget and DSRL did. That is a useful lesson: with very few demos and very few episodes, learning a Gaussian actor in raw action space from scratch is hard even with demos in the buffer; steering a pretrained generative policy starts from a much better place.</p>

<h3>Which method when</h3>
<table><thead><tr><th>Situation</th><th>Reach for</th></tr></thead><tbody>
<tr><td>Cheap massively parallel sim, dense-ish reward</td><td>PPO</td></tr>
<tr><td>Expensive samples, online access, Gaussian policy is fine</td><td>SAC / TD3 (+ high UTD, ensembles)</td></tr>
<tr><td>Online access + some demos</td><td>RLPD</td></tr>
<tr><td>Fixed dataset, want better than BC</td><td>IQL (robust default), CQL, TD3+BC</td></tr>
<tr><td>Big expressive policy you can only train by supervised loss</td><td>AWR / filtered BC / advantage conditioning (Recap)</td></tr>
<tr><td>Frozen pretrained diffusion/flow policy, online access</td><td>DSRL (SAC over its noise)</td></tr>
</tbody></table>

<div class="callout example"><b>In Phase 2 this means</b><p>Your Recap-lite value function is a success/steps-to-go predictor trained on MC returns, conditioned on the task instruction; validate it with the plots above before trusting its advantages. For DSRL, the RLPD lesson is the reverse: the frozen VLA is what makes a few hundred episodes enough, so keep the RL part small (an MLP over compact features) and well-regularised (ensembles, LayerNorm), and put the initial base-policy rollouts in the buffer.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"How would you use 10 demos in online RL?" Put them in a separate buffer, sample 50/50 with online data, LayerNorm critics, ensembles, high UTD (RLPD); or, if you have a pretrained generative policy, fine-tune or steer that instead of learning a Gaussian actor from scratch. "Why Monte Carlo for the value?" Unbiased for the data policy, no bootstrapping instability; the cost is variance and evaluating the old policy.</p></div>

      };
      const expectile = (v, t) => {
        let m = v.reduce((a, b) => a + b, 0) / v.length;
        for (let it = 0; it < 100; it++) { let nw = 0, dw = 0; for (const x of v) { const w = x > m ? t : 1 - t; nw += w * x; dw += w; } const m2 = nw / dw; if (Math.abs(m2 - m) < 1e-10) { m = m2; break; } m = m2; }
        return m;
      };
      let vals = sample(kind), sorted = [...vals].sort((a, b) => a - b);
      const draw = () => {
        const lo = Math.min(...vals), hi = Math.max(...vals), nb = 30, w = (hi - lo) / nb || 1;
        const cnt = new Array(nb).fill(0); for (const x of vals) cnt[Math.min(nb - 1, Math.floor((x - lo) / w))]++;
        const cx = cnt.map((_, i) => lo + (i + 0.5) * w);
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length, m = expectile(vals, tau);
        const q = sorted[Math.min(sorted.length - 1, Math.floor(tau * sorted.length))];
        p1.update({ series: [{ xs: cx, ys: cnt, type: "bar", color: "--c5", width: 0.85 }], xmin: lo - w, xmax: hi + w,
          vlines: [{ x: mean, label: "mean", color: RL.color("muted") }, { x: m, label: "expectile", color: RL.color("c1") }, { x: hi, label: "max", color: RL.color("c4") }] });
        const ts = [], es = [], qs = [];
        for (let t = 0.5; t <= 0.995; t += 0.005) { ts.push(t); es.push(expectile(vals, t)); qs.push(sorted[Math.min(sorted.length - 1, Math.floor(t * sorted.length))]); }
        p2.update({ xs: ts, series: [{ ys: es, label: "expectile m_τ", color: "--c1" }, { ys: qs, label: "quantile", color: "--c3", dash: true }], ymin: Math.min(lo, 0), ymax: hi,
          points: [{ x: tau, y: m, color: "--c1" }], hlines: [{ y: hi, label: "max" }] });
        out.set({ "τ": tau.toFixed(3), "mean": mean.toFixed(3), "expectile m_τ": m.toFixed(3), "τ-quantile": q.toFixed(3), "max": hi.toFixed(3) });
      };
      RL.select(ctl, { label: "distribution", options: [["sparse", "sparse success (30% ≈ 0.9)"], ["gauss", "Gaussian"], ["skew", "right-skewed"]], value: kind }, v => { kind = v; vals = sample(v); sorted = [...vals].sort((a, b) => a - b); draw(); });
      RL.slider(ctl, { label: "τ", min: 0.5, max: 0.99, step: 0.005, value: tau, fmt: v => v.toFixed(3) }, v => { tau = v; draw(); });
      draw();
      RL.note(el, String.raw`The expectile minimises $\mathbb{E}\lvert\tau - \mathbf{1}(X\lt m)\rvert (X-m)^2$. At $\tau=0.5$ it is the mean; as $\tau\to1$ it moves toward the maximum of the support. For the sparse-success distribution, notice how quickly a high $\tau$ jumps from "average outcome" to "what the good actions achieve": that is IQL's in-sample approximation of $\max_a Q(s,a)$.`);
    },

    awr(el, RL) {
      const ctl = RL.controls(el);
      let lb = Math.log10(0.3), wmax = 20, mode = "awr", keep = 0.3;
      const plot = RL.plot(el, { height: 250, xlabel: "action a", ylabel: "density", xmin: -1.2, xmax: 1.2, ymin: 0, series: [] });
      const out = RL.readouts(el);
      const M = 241, xs = [...Array(M)].map((_, i) => -1.2 + 2.4 * i / (M - 1)), dx = 2.4 / (M - 1);
      const nd = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));
      const pb = xs.map(a => 0.6 * nd(a, -0.4, 0.2) + 0.4 * nd(a, 0.4, 0.15));
      const Qf = a => 1 - 2 * (a - 0.5) ** 2;
      const Qa = xs.map(Qf);
      const V = pb.reduce((s, p, i) => s + p * Qa[i], 0) * dx;
      const A = Qa.map(q => q - V);
      // samples from π_β for ESS
      const r = RL.rng(5), smp = [];
      for (let i = 0; i < 512; i++) smp.push(r() < 0.6 ? -0.4 + 0.2 * r.normal() : 0.4 + 0.15 * r.normal());
      const sA = smp.map(a => Qf(a) - V), sortedA = [...sA].sort((a, b) => b - a);
      const draw = () => {
        const beta = 10 ** lb;
        let wf, thr = 0;
        if (mode === "awr") wf = a => Math.min(wmax, Math.exp(a / beta));
        else { thr = sortedA[Math.max(0, Math.min(sortedA.length - 1, Math.floor(keep * sortedA.length) - 1))]; wf = a => (a >= thr ? 1 : 0); }
        const un = pb.map((p, i) => p * wf(A[i]));
        const Z = un.reduce((s, v) => s + v, 0) * dx || 1;
        const pn = un.map(v => v / Z);
        const EQb = pb.reduce((s, p, i) => s + p * Qa[i], 0) * dx, EQn = pn.reduce((s, p, i) => s + p * Qa[i], 0) * dx;
        const KL = pn.reduce((s, p, i) => s + (p > 1e-12 ? p * Math.log(p / Math.max(pb[i], 1e-300)) : 0), 0) * dx;
        const ws = sA.map(wf), sw = ws.reduce((a, b) => a + b, 0), sw2 = ws.reduce((a, b) => a + b * b, 0);
        const ess = sw2 > 0 ? (sw * sw / sw2) / ws.length : 0;
        const pm = Math.max(...pb, ...pn);
        plot.update({ xs, ymax: pm * 1.1, series: [
          { ys: pb, label: "behaviour π_β", color: "--c5", fill: true },
          { ys: pn, label: mode === "awr" ? "π_β·exp(A/β) (normalised)" : "filtered BC", color: "--c1" },
          { ys: A.map(v => Math.max(0, (v + 1.2) / 2.4 * pm)), label: "advantage (scaled)", color: "--c6", dash: true },
        ] });
        out.set({ ...(mode === "awr" ? { "β": beta.toFixed(3) } : { "keep top": Math.round(keep * 100) + "%" }), "ESS of weights": (100 * ess).toFixed(1) + "%",
          "E[Q] behaviour → new": EQb.toFixed(3) + " → " + EQn.toFixed(3), "KL(new ∥ β)": KL.toFixed(2) + " nats" });
      };
      RL.select(ctl, { label: "update", options: [["awr", "AWR weights exp(A/β)"], ["filt", "filtered BC (top fraction)"]], value: mode }, v => { mode = v; draw(); });
      RL.slider(ctl, { label: "temperature β (log)", min: -2, max: 1, step: 0.02, value: lb, fmt: v => (10 ** v).toFixed(3) }, v => { lb = v; draw(); });
      RL.slider(ctl, { label: "max weight", min: 1, max: 100, step: 1, value: wmax, fmt: v => v }, v => { wmax = v; draw(); });
      RL.slider(ctl, { label: "filtered: keep", min: 0.02, max: 1, step: 0.01, value: keep, fmt: v => Math.round(v * 100) + "%" }, v => { keep = v; draw(); });
      draw();
      RL.note(el, String.raw`Behaviour data is bimodal; the better actions are near $a=0.5$, which sits on the smaller mode. Lowering $\beta$ moves mass toward high-advantage actions (higher $\mathbb{E}[Q]$) at the cost of a bigger KL step and a collapsing effective sample size: fewer samples effectively train the model. Weight clipping caps how far a single step can go. Filtered BC is the hard-threshold version. Note the new policy can never put mass where $\pi_\beta$ has none.`);
    },
  },

  /* ==================================================================== */
  selfcheck: [
    { q: "Why can Q-learning-style methods learn from data generated by any policy, while GAE-based PPO cannot?", a: String.raw`<p>The one-step backup $y = r + \gamma\,\mathbb{E}_{a'\sim\pi}[Q(s',a')]$ only needs the logged $(s,a,r,s')$ and the <i>current</i> policy at $s'$, which we can query. $Q(s,a)$ is defined as "take $a$, then follow $\pi$", so who chose $a$ does not matter. GAE sums rewards along the behaviour trajectory, so it estimates the behaviour policy's advantage; correcting it needs importance ratios whose variance explodes. PPO's clipped surrogate is valid only near the data-collecting policy.</p>` },
    { q: "Explain overestimation bias and the three TD3 fixes.", a: String.raw`<p>$\mathbb{E}[\max_a\hat Q]\ge\max_a\mathbb{E}[\hat Q]$: maximising over noisy estimates selects positive errors; bootstrapping compounds the bias to roughly $\gamma b/(1-\gamma)$, and an actor doing gradient ascent on $Q$ exploits it. TD3: (1) clipped double Q, target uses $\min(Q_1,Q_2)$, pessimistic so errors are not amplified; (2) target policy smoothing, clipped Gaussian noise on the target action so the critic is smooth and narrow spikes cannot be exploited; (3) delayed actor and target updates (every 2 critic steps) so the actor follows a settled critic.</p>` },
    { q: "Write the SAC critic target, actor loss and temperature loss.", a: String.raw`<p>$y = r + \gamma(1-d)\big(\min_j Q_{\bar\phi_j}(s',\tilde a') - \alpha\log\pi(\tilde a'\mid s')\big)$, $\tilde a'\sim\pi(\cdot\mid s')$. Actor: $\mathbb{E}_{s,\xi}[\alpha\log\pi(\tilde a_\theta\mid s) - \min_j Q_j(s,\tilde a_\theta)]$ with $\tilde a_\theta = \tanh(\mu+\sigma\xi)$ (reparameterised, tanh log-prob correction $-\sum\log(1-\tanh^2 u)$). Temperature: $\mathbb{E}[-\alpha(\log\pi(a\mid s) + \bar{\mathcal H})]$ with $\bar{\mathcal H} = -\dim\mathcal{A}$.</p>` },
    { q: "Why does SAC's Gaussian policy pick one mode of a bimodal Q landscape?", a: String.raw`<p>The policy step minimises reverse KL $\mathrm{KL}(\pi\Vert e^{Q/\alpha}/Z)$, which heavily penalises putting mass where the target is small. A unimodal Gaussian straddling two peaks puts mass in the low valley, so it prefers to sit on one peak (mode-seeking). Only at high $\alpha$, when the target itself is broad, does a wide Gaussian win.</p>` },
    { q: "What is extrapolation error, and why is it fatal offline but not online?", a: String.raw`<p>The critic is queried at actions absent from the data (via $\max_{a'}$ or the actor), where function approximation outputs arbitrary, often high values. The policy moves toward them and targets inflate. Online, trying those actions returns real rewards that correct the critic; offline there is no such feedback, so the error persists and grows.</p>` },
    { q: "How does IQL get policy improvement without querying out-of-distribution actions?", a: String.raw`<p>It fits $V(s)$ as an upper expectile ($\tau\approx0.7$–$0.9$) of $Q(s,a)$ over dataset actions, which approximates the max over in-support actions; fits $Q$ to $r + \gamma V(s')$ (no next-action sampling); and extracts the policy by advantage-weighted BC on dataset actions, weights $\exp(\beta(Q-V))$ clipped. Every loss is an expectation over dataset tuples.</p>` },
    { q: "Derive the AWR update from a KL-constrained objective.", a: String.raw`<p>$\max_\pi \mathbb{E}_{a\sim\pi}[A] - \beta\mathrm{KL}(\pi\Vert\pi_\beta)$ has solution $\pi^*\propto\pi_\beta\exp(A/\beta)$. Project with forward KL: $\min_\theta \mathrm{KL}(\pi^*\Vert\pi_\theta) = -\mathbb{E}_{a\sim\pi^*}[\log\pi_\theta] + c = -\mathbb{E}_{a\sim\pi_\beta}[\tfrac{1}{Z}e^{A/\beta}\log\pi_\theta] + c$. Dropping $Z(s)$ gives weighted MLE on the data, weights $e^{A/\beta}$. $\beta\to\infty$ is BC; $\beta\to0$ is "copy the best sample".</p>` },
    { q: "Why condition on advantage rather than return?", a: String.raw`<p>Return mixes the quality of actions with the difficulty of the starting state and with luck in stochastic transitions. Advantage subtracts the state's baseline $V(s)$, so a positive label means "better than this policy usually does from here". Conditioning on high return asks the model to reproduce easy states or lucky outcomes.</p>` },
    { q: "Explain the classifier-free guidance view of advantage conditioning.", a: String.raw`<p>By Bayes, $\pi_\beta(a\mid s,o{=}1)\propto\pi_\beta(a\mid s)\,p(o{=}1\mid s,a)$: the conditional model is a reweighted, improved policy. Train with the label randomly dropped to also get $\pi(a\mid s)$. Guidance with weight $w$ gives $\pi_\beta\,p(o\mid s,a)^w$; for flows, $v = v_u + w(v_c - v_u)$. $w=1$ is plain conditioning; $w\gt 1$ is a stronger, test-time tunable improvement step.</p>` },
    { q: "Monte Carlo vs TD targets for a success-predicting value function: trade-offs?", a: String.raw`<p>MC: unbiased for the data-collecting policy, no bootstrapping, stable, simple; high variance, evaluates the old (mixture) policy, cannot stitch. TD/IQL: lower variance, can stitch and evaluate a better policy; target networks, divergence risk, more hyperparameters. With hundreds of rollouts and short-horizon tasks, MC is a fine start (π*0.6 uses MC).</p>` },
    { q: "What are RLPD's key design choices and why do they matter?", a: String.raw`<p>Symmetric 50/50 sampling of offline and online data so few demos keep influence; LayerNorm in the critic to bound extrapolation on unseen actions; high UTD with a critic ensemble (REDQ-style) for sample efficiency without overestimation. No offline pretraining, no explicit BC term.</p>` },
  ],

  /* ==================================================================== */
  quiz: [
    { q: "Why is SAC typically more sample-efficient than PPO on MuJoCo?", choices: [
      "SAC uses a larger network",
      "SAC reuses each transition many times through a replay buffer, because its Q backup is valid for off-policy data",
      "SAC uses a higher discount factor",
      "PPO cannot handle continuous actions"],
      answer: 1, explain: String.raw`The Q backup only needs $\pi$ at $s'$, so any logged transition is usable forever. PPO's surrogate is only valid near the data-collecting policy, so it discards data after a few epochs. Network size and γ are not the reason, and PPO handles continuous actions fine with a Gaussian policy.` },
    { q: String.raw`Five actions all have true value 0. Your critic estimates each with independent $\mathcal{N}(0,1)$ noise. What is $\mathbb{E}[\max_a \hat Q(a)]$ approximately?`, choices: ["0", "≈ 0.5", "≈ 1.16", "≈ 2.3"], answer: 2,
      explain: String.raw`The expected maximum of 5 iid standard normals is about 1.163. So a single max-based target is biased by more than one standard deviation of the noise, even though every action is worth exactly 0. With 2 actions it would be $1/\sqrt{\pi}\approx0.56$; it grows roughly like $\sqrt{2\ln K}$.` },
    { q: String.raw`Each backup adds an overestimation bias of $b=0.05$. With $\gamma=0.99$, what is the steady-state bias of $Q$ (fixed point of $B=\gamma(B+b)$)?`, answer: 4.95, tol: 0.06,
      explain: String.raw`$B = \gamma b/(1-\gamma) = 0.99\cdot0.05/0.01 = 4.95$. A tiny per-step bias becomes huge through bootstrapping, which is why TD3 and SAC use clipped double Q. (If you answered 5.0, you used $b/(1-\gamma)$, which counts the bias once more; within tolerance it would be marked close but the fixed point is 4.95.)` },
    { q: "Which of these are part of TD3? (select all that apply)", choices: [
      "Clipped double Q-learning (min of two critics in the target)",
      "An entropy bonus with learned temperature",
      "Target policy smoothing (clipped noise on the target action)",
      "Delayed actor and target updates",
      "Importance sampling ratios on replayed data"],
      answer: [0, 2, 3], explain: String.raw`TD3's three tricks are clipped double Q, target policy smoothing and delayed policy updates. The learned-temperature entropy bonus is SAC. Neither uses importance ratios: the one-step Q backup does not need them.` },
    { q: String.raw`In SAC, what is the usual default target entropy for a 7-D action space?`, choices: ["+7", "0", "−7", String.raw`$-\log 7$`], answer: 2,
      explain: String.raw`The heuristic is $\bar{\mathcal H} = -\dim\mathcal{A} = -7$ nats. Differential entropy of a squashed Gaussian can be negative, so a negative target is normal. Note DSRL's π0 configs use other values ($-d/2$ in sim, 0 on the real robot), because "how random should the noise be" is a different question from "how random should the action be".` },
    { q: String.raw`A SAC actor samples $u\sim\mathcal{N}(\mu,\sigma^2)$ and outputs $a=\tanh(u)$. Which log-probability is correct?`, choices: [
      String.raw`$\log\mathcal{N}(a;\mu,\sigma^2)$`,
      String.raw`$\log\mathcal{N}(u;\mu,\sigma^2) + \sum_i\log(1-\tanh^2 u_i)$`,
      String.raw`$\log\mathcal{N}(u;\mu,\sigma^2) - \sum_i\log(1-\tanh^2 u_i)$`,
      String.raw`$\log\mathcal{N}(u;\mu,\sigma^2)$, the squash does not change the density`],
      answer: 2, explain: String.raw`Change of variables: $p_a(a) = p_u(u)\,\lvert\det \partial a/\partial u\rvert^{-1}$, and $\partial a_i/\partial u_i = 1-\tanh^2 u_i$, so you <i>subtract</i> $\sum\log(1-\tanh^2u_i)$. Forgetting it makes the entropy estimate wrong and the temperature tuning misbehave. Evaluating the Gaussian at $a$ instead of $u$ is a common bug.` },
    { q: "SAC's actor gradient is low-variance mainly because…", choices: [
      "it uses the reparameterisation trick to backpropagate through a differentiable critic",
      "it uses advantage normalisation",
      "it clips the probability ratio",
      "it uses a large batch size"],
      answer: 0, explain: String.raw`With a differentiable $Q(s,a)$ you can write the sample as $a=f_\theta(s,\xi)$ and push gradients through it (pathwise gradient). PPO only has scalar returns for sampled actions and must use the score-function estimator, which has higher variance. Ratio clipping is PPO, not SAC.` },
    { q: String.raw`As SAC's temperature $\alpha\to0$, the soft value $V(s)=\alpha\log\int e^{Q(s,a)/\alpha}da$ approaches…`, choices: [
      String.raw`$\mathbb{E}_{a\sim\text{uniform}}[Q(s,a)]$`, String.raw`$\max_a Q(s,a)$`, "0", String.raw`$-\infty$`],
      answer: 1, explain: String.raw`Log-sum-exp with a vanishing temperature is the hard max. Max-entropy RL recovers standard RL as $\alpha\to0$; large $\alpha$ makes $V$ dominated by the entropy of a near-uniform policy.` },
    { q: "You run off-the-shelf SAC on a fixed robot dataset with no environment access. Q-values climb to 10× any achievable return and the policy outputs extreme actions. Most likely cause?", choices: [
      "Learning rate too low",
      "Extrapolation error: the target and actor query Q at actions absent from the data, and nothing corrects the overestimate",
      "Too few critic parameters",
      "The discount factor is too small"],
      answer: 1, explain: String.raw`This is the classic offline RL failure. Online, executing those actions would reveal their real value; offline there is no correction. Fixes: CQL-style pessimism, in-sample learning (IQL), or behaviour constraints (TD3+BC, AWR). A small γ would shrink values, not inflate them.` },
    { q: "Which methods avoid evaluating the critic on actions outside the dataset during value learning? (select all that apply)", choices: [
      "IQL", "Naive SAC on the offline buffer", "SARSA-style evaluation of the behaviour policy", "Monte Carlo value regression (as in π*0.6's value function)", "DDPG"],
      answer: [0, 2, 3], explain: String.raw`IQL's V and Q losses use only dataset $(s,a)$ pairs; SARSA uses the logged next action; MC regression uses realised returns. SAC and DDPG compute targets with actions from the learned actor, which can leave the data's support.` },
    { q: String.raw`In IQL, what does the expectile level $\tau$ control?`, choices: [
      "The weight decay of the policy",
      String.raw`How optimistic $V(s)$ is relative to $Q(s,a)$ over dataset actions: 0.5 gives the behaviour value, $\tau\to1$ approaches the in-support max`,
      "The probability of sampling offline vs online data",
      "The Polyak averaging rate"],
      answer: 1, explain: String.raw`$V$ minimises $\mathbb{E}\lvert\tau-\mathbf{1}(Q-V\lt 0)\rvert(Q-V)^2$. At $\tau=0.5$ it is MSE, so $V=\mathbb{E}_{a\sim\pi_\beta}[Q]$ (no improvement). Larger $\tau$ pushes $V$ up toward the best actions the data supports.` },
    { q: String.raw`A random variable takes value 0 with probability 0.5 and 1 with probability 0.5. What is its $\tau=0.8$ expectile?`, answer: 0.8, tol: 0.005,
      explain: String.raw`For $m\in(0,1)$ the first-order condition is $\tau\,\mathbb{E}[(X-m)_+] = (1-\tau)\,\mathbb{E}[(m-X)_+]$: $0.8\cdot0.5(1-m) = 0.2\cdot0.5\,m$, so $0.8(1-m)=0.2m$, $m=0.8$. (For a two-point 0/1 distribution with equal mass, the expectile equals $\tau$; the 0.8-<i>quantile</i> would be 1.)` },
    { q: String.raw`What is the closed-form solution of $\max_\pi \mathbb{E}_{a\sim\pi}[A(s,a)] - \beta\,\mathrm{KL}(\pi\Vert\pi_\beta)$?`, choices: [
      String.raw`$\pi^*\propto \pi_\beta\exp(A/\beta)$`, String.raw`$\pi^*\propto \pi_\beta\exp(-A/\beta)$`, String.raw`$\pi^* = \arg\max_a A(s,a)$`, String.raw`$\pi^*\propto \exp(\beta A)$ independent of $\pi_\beta$`],
      answer: 0, explain: String.raw`Standard KL-regularised result (same algebra as the RLHF optimum). It never puts mass where $\pi_\beta$ has none, which is why AWR-type methods are naturally conservative. The greedy argmax is the $\beta\to0$ limit; ignoring $\pi_\beta$ would be the entropy-regularised (not KL-regularised) solution.` },
    { q: "In AWR, decreasing the temperature β (weights exp(A/β)) does what? (select all that apply)", choices: [
      "Concentrates weight on the highest-advantage samples",
      "Reduces the effective sample size of each batch",
      "Moves the update toward plain behaviour cloning",
      "Makes the update larger (bigger KL from the behaviour policy)"],
      answer: [0, 1, 3], explain: String.raw`Low β = sharp weights = aggressive improvement, fewer effective samples, larger KL step. Plain BC is the <i>high</i>-β limit, where all weights are equal. Weight clipping is the usual guard against the low-β collapse.` },
    { q: "\"BC on successful episodes only\" is best described as…", choices: [
      "An on-policy policy gradient method",
      "AWR in the hard-threshold limit, using the episode outcome as the score",
      "Conservative Q-learning",
      "Return-conditioned supervised learning with a learned value"],
      answer: 1, explain: String.raw`It is filtered BC: weight 1 for samples in successful episodes, 0 otherwise. No value function, no conditioning. Iterated with new rollouts it is a strong, simple baseline (it is the Phase 2 baseline arm), but every action in a successful episode is treated as good and every action in a failed one as bad.` },
    { q: "Why is advantage conditioning preferred over return conditioning in environments where initial states vary in difficulty?", choices: [
      "Advantages are always positive",
      "Returns cannot be computed offline",
      "The advantage subtracts the state's baseline value, so the label reflects action quality rather than how easy the start was",
      "Return conditioning needs a transformer"],
      answer: 2, explain: String.raw`A high return-to-go may just mean "this layout is easy". $A = Q - V$ removes the per-state baseline. Returns are trivially computable offline, and advantages can be negative.` },
    { q: String.raw`For a flow policy trained with the advantage label randomly dropped, classifier-free guidance with weight $w$ uses which velocity?`, choices: [
      String.raw`$v_{\text{cond}}$ only`,
      String.raw`$v_{\text{uncond}} + w\,(v_{\text{cond}} - v_{\text{uncond}})$`,
      String.raw`$w\,v_{\text{uncond}} + (1-w)\,v_{\text{cond}}$`,
      String.raw`$v_{\text{cond}} \cdot v_{\text{uncond}}$`],
      answer: 1, explain: String.raw`It corresponds to sampling from $\pi(a\mid s)^{1-w}\pi(a\mid s,I{=}1)^{w}$. $w=1$ gives plain conditional sampling; $w\gt 1$ extrapolates past it (stronger improvement, riskier). Option 3 swaps the roles and at $w\gt 1$ would move <i>away</i> from the good behaviour.` },
    { q: String.raw`Reward is $-1$ per step until success, episodes capped at 300 steps, and π*0.6-style normalisation divides by the max episode length. A state from which the policy typically succeeds in 60 more steps has normalised value about…`, answer: -0.2, tol: 0.01,
      explain: String.raw`$V = -60/300 = -0.2$. Values live in $(-1, 0)$: near 0 means "about to succeed", near $-1$ means "far away or likely to fail" (failures get a large negative terminal penalty). This dense "steps to go" signal is what makes chunk-level advantages informative inside successful episodes.` },
    { q: "Which are RLPD design choices? (select all that apply)", choices: [
      "50/50 symmetric sampling between offline and online data",
      "LayerNorm in the critic",
      "Offline pretraining with CQL before online fine-tuning",
      "High update-to-data ratio with a critic ensemble",
      "A behaviour-cloning term in the actor loss"],
      answer: [0, 1, 3], explain: String.raw`RLPD's point is that you do <i>not</i> need offline pretraining or a BC term: a well-regularised off-policy learner with symmetric sampling, LayerNorm and an ensemble at high UTD is enough.` },
    { q: String.raw`A 1M-transition buffer stores two 128×128×3 uint8 images per transition (s and s'). Roughly how many GB is that?`, answer: 98, tol: 4,
      explain: String.raw`$128\cdot128\cdot3 = 49{,}152$ bytes per image, ×2 per transition = 98,304 bytes, ×$10^6$ ≈ 98 GB. Store each frame once with episode indices (halves it), use smaller images (64×64 is a quarter), or keep 100k transitions (~10 GB).` },
    { q: "In a vectorised Gymnasium environment an episode is truncated by the time limit. What should the replay buffer store?", choices: [
      "terminated = True, s' = the reset observation",
      "terminated = False, s' = the true final observation (from the info dict / autoreset convention)",
      "Drop the transition",
      "terminated = True, s' = the true final observation"],
      answer: 1, explain: String.raw`A time limit is not a terminal state of the MDP, so the target must still bootstrap from $V(s')$, and $s'$ must be the real last observation, not the first observation of the next episode (vector envs auto-reset). Check your Gymnasium version's autoreset mode.` },
  ],

  /* ==================================================================== */
  flashcards: [
    { front: "Off-policy vs on-policy, in one sentence", back: String.raw`Off-policy learns from data generated by any policy (via Q backups); on-policy needs fresh samples from the current policy.` },
    { front: "Update-to-data (UTD) ratio", back: "Gradient updates per environment step. High UTD (10–20) = more learning per sample, more overfitting and overestimation; pair with ensembles, LayerNorm, resets." },
    { front: "Deadly triad", back: "Off-policy data + bootstrapping + function approximation → possible divergence." },
    { front: "Deterministic policy gradient", back: String.raw`$\nabla_\theta J = \mathbb{E}_s[\nabla_a Q(s,a)\vert_{a=\mu_\theta(s)}\nabla_\theta\mu_\theta(s)]$; code: <code>-critic(s, actor(s)).mean()</code>.` },
    { front: "Why max of noisy Q estimates overestimates", back: String.raw`$\mathbb{E}[\max_a\hat Q]\ge\max_a\mathbb{E}[\hat Q]$: the max selects positive errors. Expected max of $K$ iid $\mathcal{N}(0,1)$ ≈ 0.56 (K=2), 1.16 (K=5), 1.54 (K=10).` },
    { front: "TD3's three tricks", back: "Clipped double Q (min of two target critics), target policy smoothing (clipped noise 0.2, clip 0.5), delayed actor/target updates (every 2 critic steps)." },
    { front: "Double DQN vs clipped double Q", back: "Double DQN: select with one network, evaluate with the other (≈ unbiased). Clipped double Q: take the min of two critics (deliberately pessimistic)." },
    { front: "Max-entropy objective", back: String.raw`$J=\mathbb{E}[\sum_t\gamma^t(r_t+\alpha\mathcal{H}(\pi(\cdot\mid s_t)))]$` },
    { front: "Soft value", back: String.raw`$V(s)=\mathbb{E}_{a\sim\pi}[Q(s,a)-\alpha\log\pi(a\mid s)]$; optimum $\pi\propto e^{Q/\alpha}$, $V=\alpha\log\int e^{Q/\alpha}$.` },
    { front: "SAC critic target", back: String.raw`$y=r+\gamma(1-d)(\min_j Q_{\bar\phi_j}(s',\tilde a')-\alpha\log\pi(\tilde a'\mid s'))$, $\tilde a'\sim\pi(\cdot\mid s')$` },
    { front: "SAC actor loss", back: String.raw`$\mathbb{E}_{s,\xi}[\alpha\log\pi(\tilde a_\theta\mid s)-\min_jQ_j(s,\tilde a_\theta)]$ with reparameterised $\tilde a_\theta=\tanh(\mu+\sigma\xi)$.` },
    { front: "SAC temperature loss and default target", back: String.raw`$L(\alpha)=\mathbb{E}[-\alpha(\log\pi+\bar{\mathcal H})]$, $\bar{\mathcal H}=-\dim\mathcal{A}$. Optimise $\log\alpha$.` },
    { front: "tanh log-prob correction (stable form)", back: String.raw`$\log\pi(a)=\log\mathcal{N}(u)-\sum_i 2(\log2-u_i-\operatorname{softplus}(-2u_i))$` },
    { front: "Reverse KL projection is…", back: "Mode-seeking: a Gaussian fit to a multimodal Boltzmann policy picks one mode." },
    { front: "Extrapolation error", back: "Critic overestimates actions absent from the data; the policy chases them; offline nothing corrects it." },
    { front: "CQL regulariser", back: String.raw`$\alpha\,\mathbb{E}_s[\log\sum_a e^{Q(s,a)}-\mathbb{E}_{a\sim\mathcal{D}}Q(s,a)]$: push down soft-max Q, push up data actions.` },
    { front: "TD3+BC actor loss", back: String.raw`$-\lambda Q(s,\mu(s))/\overline{\lvert Q\rvert}+(\mu(s)-a)^2$, $\lambda=2.5$. Minimal offline RL baseline.` },
    { front: "Expectile loss", back: String.raw`$L_2^\tau(u)=\lvert\tau-\mathbf{1}(u\lt 0)\rvert u^2$. τ=0.5 → mean; τ→1 → max of support.` },
    { front: "IQL losses", back: String.raw`$V$: expectile of $Q(s,a)-V(s)$; $Q$: MSE to $r+\gamma V(s')$; $\pi$: weighted BC with $e^{\beta(Q-V)}$ (clip 100).` },
    { front: "IQL typical τ, β", back: "τ=0.7, β=3 (MuJoCo locomotion); τ=0.9, β=10 (AntMaze). β here is an inverse temperature." },
    { front: "AWR update", back: String.raw`$\max_\theta\mathbb{E}_{\mathcal{D}}[e^{A(s,a)/\beta}\log\pi_\theta(a\mid s)]$, from $\pi^*\propto\pi_\beta e^{A/\beta}$ + forward-KL projection.` },
    { front: "β limits in AWR", back: "β→∞: plain BC. β→0: copy the single best sample (ESS collapses). Filtered BC = hard threshold." },
    { front: "Decision Transformer", back: "GPT over (return-to-go, state, action) tokens; condition on a high target return at test. Fails when returns come from luck." },
    { front: "Advantage conditioning", back: String.raw`Train $\pi(a\mid s,I)$ with $I=\mathbf{1}(\hat A\gt \epsilon)$; sample with $I=1$. Recap's policy extraction.` },
    { front: "Conditioning = reweighting (Bayes)", back: String.raw`$\pi(a\mid s,o{=}1)\propto\pi(a\mid s)\,p(o{=}1\mid s,a)$` },
    { front: "CFG for a flow policy", back: String.raw`$v=v_u+w(v_c-v_u)$ ⇔ sample $\pi_\beta\,p(o\mid s,a)^w$. $w=1$: plain conditioning.` },
    { front: "Recap value target", back: String.raw`$-1$ per step, 0 at success, $-C_{\text{fail}}$ on failure; MC return normalised to $(-1,0)$ per task; 201-bin distributional head.` },
    { front: "HL-Gauss", back: "Train a value as classification over bins with a Gaussian-smoothed target; often scales better than MSE (Farebrother et al. 2024)." },
    { front: "RLPD recipe", back: "50/50 offline/online batches, LayerNorm critic, ensemble + high UTD, no offline pretraining, no BC term." },
    { front: "Chunk-level transition", back: String.raw`$(s_t,\text{chunk},R_t=\sum_{k\lt h}\gamma^kr_{t+k},s_{t+h})$, discount $\gamma^h$ per decision; count low-level env steps.` },
  ],

  cheats: [
    { name: "TD3 target", tex: String.raw`y=r+\gamma(1-d)\min_{i}Q_{\bar\phi_i}\big(s',\operatorname{clip}(\mu_{\bar\theta}(s')+\operatorname{clip}(\epsilon,-c,c),a_{lo},a_{hi})\big)`, note: "σ̃=0.2, c=0.5, delay 2, τ=0.005." },
    { name: "Deterministic policy gradient", tex: String.raw`\nabla_\theta J=\mathbb{E}_s\big[\nabla_aQ(s,a)\vert_{a=\mu_\theta(s)}\nabla_\theta\mu_\theta(s)\big]`, note: "DDPG/TD3 actor." },
    { name: "SAC soft Q target", tex: String.raw`y=r+\gamma(1-d)\big(\min_jQ_{\bar\phi_j}(s',\tilde a')-\alpha\log\pi(\tilde a'\mid s')\big)`, note: "ã′ sampled from the current policy." },
    { name: "SAC actor and temperature", tex: String.raw`L_\pi=\mathbb{E}\big[\alpha\log\pi(\tilde a_\theta\mid s)-\min_jQ_j(s,\tilde a_\theta)\big],\quad L_\alpha=\mathbb{E}\big[-\alpha(\log\pi+\bar{\mathcal H})\big]`, note: "Target entropy −dim(A)." },
    { name: "tanh-squashed log-prob", tex: String.raw`\log\pi(a\mid s)=\log\mathcal{N}(u;\mu,\sigma^2)-\textstyle\sum_i\log(1-\tanh^2u_i)`, note: "Stable: 2(log 2 − u − softplus(−2u))." },
    { name: "CQL(H) regulariser", tex: String.raw`\alpha\,\mathbb{E}_s\Big[\log\textstyle\sum_a e^{Q(s,a)}-\mathbb{E}_{a\sim\mathcal{D}}Q(s,a)\Big]`, note: "Added to the Bellman MSE." },
    { name: "Expectile loss", tex: String.raw`L_2^\tau(u)=\lvert\tau-\mathbf{1}(u<0)\rvert\,u^2`, note: "IQL: u = Q(s,a) − V(s)." },
    { name: "IQL", tex: String.raw`L_V=\mathbb{E}[L_2^\tau(Q-V)],\ L_Q=\mathbb{E}[(r+\gamma V(s')-Q)^2],\ L_\pi=-\mathbb{E}[e^{\beta(Q-V)}\log\pi(a\mid s)]`, note: "All expectations over dataset tuples." },
    { name: "KL-regularised improvement", tex: String.raw`\pi^*(a\mid s)\propto\pi_\beta(a\mid s)\exp\big(A(s,a)/\beta\big)`, note: "AWR, AWAC, RLHF optimum." },
    { name: "AWR", tex: String.raw`\max_\theta\ \mathbb{E}_{(s,a)\sim\mathcal{D}}\big[\exp(A(s,a)/\beta)\log\pi_\theta(a\mid s)\big]`, note: "Clip weights (e.g. 20)." },
    { name: "Classifier-free guidance policy", tex: String.raw`\pi_w(a\mid s)\propto\pi(a\mid s)^{1-w}\,\pi(a\mid s,I{=}1)^{w}`, note: "Flow: v = v_u + w(v_c − v_u)." },
    { name: "n-step advantage (Recap)", tex: String.raw`\hat A_t=\textstyle\sum_{k=0}^{N-1}r_{t+k}+V(o_{t+N})-V(o_t)`, note: "Threshold into I_t = 1(Â > ε)." },
  ],

  glossary: [
    { term: "Replay buffer", def: "Store of past transitions sampled uniformly (or otherwise) for off-policy updates." },
    { term: "Polyak averaging", def: "Target network update θ̄ ← (1−τ)θ̄ + τθ, typically τ = 0.005." },
    { term: "Overestimation bias", def: "Upward bias of max-based value targets because maximisation selects positive estimation errors." },
    { term: "Clipped double Q", def: "Using the minimum of two critics in the Bellman target (TD3, SAC)." },
    { term: "Target policy smoothing", def: "TD3: adding clipped noise to the target action so the critic is smooth in a." },
    { term: "Maximum-entropy RL", def: "RL objective that adds α times the policy's entropy to the reward at each step." },
    { term: "Temperature (α)", def: "Exchange rate between reward and entropy in SAC; tuned automatically toward a target entropy." },
    { term: "Reparameterisation trick", def: "Writing a sample as a differentiable function of parameters and fixed noise, enabling pathwise gradients." },
    { term: "UTD ratio", def: "Gradient updates per environment step." },
    { term: "Offline RL", def: "Learning a policy from a fixed dataset without further environment interaction." },
    { term: "Extrapolation error", def: "Erroneous value estimates at state-actions not covered by the dataset, exploited by the policy." },
    { term: "CQL", def: "Conservative Q-learning: penalises Q on policy/broad actions and raises it on data actions, giving a lower bound." },
    { term: "IQL", def: "Implicit Q-learning: in-sample value learning via expectile regression, policy by advantage-weighted BC." },
    { term: "Expectile", def: "Minimiser of an asymmetric squared loss; τ = 0.5 is the mean, τ → 1 approaches the maximum." },
    { term: "AWR / AWAC", def: "Policy update as BC weighted by exp(advantage/temperature)." },
    { term: "Filtered BC", def: "BC on a subset of data selected by return, advantage or success (weights 0/1)." },
    { term: "Return-conditioned policy", def: "Policy given a target return-to-go as input (Decision Transformer, RvS)." },
    { term: "Advantage-conditioned policy", def: "Policy given a (binarised) advantage label as input and sampled with the 'good' label (Recap)." },
    { term: "Classifier-free guidance (CFG)", def: "Mixing conditional and unconditional model outputs with weight w to sharpen conditioning." },
    { term: "Stitching", def: "Combining parts of different trajectories into behaviour better than any single trajectory in the data." },
    { term: "RLPD", def: "Online RL with prior data: symmetric sampling, LayerNorm critic, ensembles, high UTD." },
    { term: "HL-Gauss", def: "Value learning as classification over bins with Gaussian-smoothed targets." },
  ],

  links: [
    { title: "Spinning Up: Soft Actor-Critic", url: "https://spinningup.openai.com/en/latest/algorithms/sac.html", note: "Clear derivation and pseudocode; also see the TD3 and DDPG pages." },
    { title: "Haarnoja et al. 2018, Soft Actor-Critic Algorithms and Applications", url: "https://arxiv.org/abs/1812.05905", note: "SAC with automatic temperature tuning (the version everyone implements)." },
    { title: "Fujimoto et al. 2018, Addressing Function Approximation Error in Actor-Critic Methods (TD3)", url: "https://arxiv.org/abs/1802.09477", note: "Overestimation in actor-critic and the three fixes." },
    { title: "Levine et al. 2020, Offline RL: Tutorial, Review, and Perspectives", url: "https://arxiv.org/abs/2005.01643", note: "The map of offline RL; read the distribution-shift sections." },
    { title: "Kumar et al. 2020, Conservative Q-Learning", url: "https://arxiv.org/abs/2006.04779", note: "CQL objective and the tabular penalty analysis." },
    { title: "Kostrikov, Nair & Levine 2021, Implicit Q-Learning", url: "https://arxiv.org/abs/2110.06169", note: "Expectile regression; hyperparameters in the appendix." },
    { title: "Peng et al. 2019, Advantage-Weighted Regression", url: "https://arxiv.org/abs/1910.00177", note: "Derivation of the weighted-BC update." },
    { title: "Frans, Park, Abbeel & Levine 2025, Diffusion Guidance Is a Controllable Policy Improvement Operator (CFGRL)", url: "https://arxiv.org/abs/2505.23458", note: "Why conditioning + guidance improves a policy; directly behind Recap's design." },
    { title: "Ball, Smith, Kostrikov & Levine 2023, Efficient Online RL with Offline Data (RLPD)", url: "https://arxiv.org/abs/2302.02948", note: "Symmetric sampling, LayerNorm, ensembles." },
    { title: "CleanRL docs: SAC continuous action", url: "https://docs.cleanrl.dev/rl-algorithms/sac/", note: "Single-file reference implementation to read next to this module." },
  ],
});

<script>
/* RL & Robot Learning field guide: the engine. Modules register themselves with RL.module({...}) before this runs. */
(() => {
"use strict";
const RL = window.RL;
const PARTS = RL.PARTS;
const PLAN = RL.PLAN;
const mods = RL._modules.slice().sort((a, b) => a.num - b.num);
const byId = Object.fromEntries(mods.map(m => [m.id, m]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const pct = x => Math.round(x * 100);

/* ---------- persistent progress (per browser) ---------- */
const KEY = "rlguide.v1";
const S = { read: {}, quiz: {}, cards: {}, plan: {}, last: null };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} refreshChrome(); };

const qid = (m, i) => `${m.id}/${i}`;
function modStats(m) {
  const secs = m.sections || [], qs = m.quiz || [], cs = m.flashcards || [];
  const read = secs.filter(s => S.read[`${m.id}/${s.id}`]).length;
  const answered = qs.filter((_, i) => S.quiz[qid(m, i)]).length;
  const correct = qs.filter((_, i) => S.quiz[qid(m, i)]?.c).length;
  const known = cs.filter((_, i) => S.cards[qid(m, i)] === 1).length;
  const total = secs.length + qs.length;
  const progress = total ? (read + correct) / total : 0;
  return { read, secs: secs.length, answered, correct, qs: qs.length, known, cards: cs.length, progress,
    done: read === secs.length && qs.length > 0 && correct / qs.length >= 0.8 };
}
function totals() {
  let read = 0, secs = 0, answered = 0, correct = 0, qs = 0, known = 0, cards = 0, done = 0, prog = 0;
  for (const m of mods) {
    const s = modStats(m);
    read += s.read; secs += s.secs; answered += s.answered; correct += s.correct; qs += s.qs;
    known += s.known; cards += s.cards; done += s.done ? 1 : 0; prog += s.progress;
  }
  return { read, secs, answered, correct, qs, known, cards, done, progress: mods.length ? prog / mods.length : 0 };
}

/* ---------- math ---------- */
let mathReady = false;
const mathQueue = new Set();
function typeset(el) {
  if (!el) return;
  if (!mathReady) { mathQueue.add(el); return; }
  try {
    window.renderMathInElement(el, {
      delimiters: [{ left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true },
                   { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }],
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option"],
      throwOnError: false, strict: "ignore",
    });
  } catch (e) { console.error(e); }
}
RL.mathReady = () => {
  if (!window.renderMathInElement) return;
  mathReady = true;
  for (const el of mathQueue) if (el.isConnected) typeset(el);
  mathQueue.clear();
};

/* ---------- drawing helpers for widgets ---------- */
const css = name => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
RL.color = css;
RL.colors = () => ["c1", "c2", "c3", "c4", "c5", "c6"].map(css);
const redrawers = new Set();
RL.canvas = (host, { height = 240, aspect, draw }) => {
  const c = document.createElement("canvas");
  host.appendChild(c);
  const ctx = c.getContext("2d");
  const api = { canvas: c, ctx, w: 0, h: 0, draw, redraw };
  function redraw() {
    if (!c.isConnected) { redrawers.delete(redraw); return; }
    const w = Math.max(200, Math.floor(c.parentElement.clientWidth - 2));
    const h = aspect ? Math.round(w * aspect) : height;
    const dpr = window.devicePixelRatio || 1;
    if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; c.style.height = h + "px"; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    api.w = w; api.h = h;
    ctx.font = `11px ${css("mono") || "monospace"}`;
    try { api.draw && api.draw(ctx, w, h); } catch (e) { console.error(e); }
  }
  redrawers.add(redraw);
  requestAnimationFrame(redraw);
  return api;
};
let rzTimer = 0;
addEventListener("resize", () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => redrawers.forEach(f => f()), 80); });

const nice = (lo, hi, n = 5) => {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => span / s <= n) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
};
const fmtTick = v => Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-3 && v) ? v.toExponential(0) : +v.toPrecision(4) + "";

/* RL.plot(host, opts) → { update(opts) }. Line/scatter/bar plot with axes and a legend. */
RL.plot = (host, opts) => {
  let o = opts;
  const cv = RL.canvas(host, { height: o.height || 240, draw });
  function draw(ctx, W, H) {
    const pal = RL.colors(), ink = css("ink-2"), mut = css("muted"), line = css("line");
    const L = 46, R = 14, T = o.title ? 26 : 14, B = o.xlabel ? 40 : 26;
    const series = o.series || [];
    let xs = [], ys = [];
    for (const s of series) {
      const sx = s.xs || o.xs || s.ys.map((_, i) => i);
      xs.push(...sx); ys.push(...s.ys.filter(Number.isFinite));
    }
    for (const p of o.points || []) { xs.push(p.x); ys.push(p.y); }
    let xmin = o.xmin ?? Math.min(...xs), xmax = o.xmax ?? Math.max(...xs);
    let ymin = o.ymin ?? Math.min(0, ...ys), ymax = o.ymax ?? Math.max(...ys);
    if (!Number.isFinite(xmin)) { xmin = 0; xmax = 1; }
    if (!Number.isFinite(ymin)) { ymin = 0; ymax = 1; }
    if (xmax === xmin) xmax = xmin + 1;
    if (ymax === ymin) { ymax += 1; ymin -= o.ymin == null ? 1 : 0; }
    if (o.ymax == null) ymax += (ymax - ymin) * 0.06;
    const X = x => L + (x - xmin) / (xmax - xmin) * (W - L - R);
    const Y = y => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B);
    ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = mut; ctx.textBaseline = "middle";
    ctx.textAlign = "right";
    for (const t of nice(ymin, ymax, Math.max(3, Math.floor((H - T - B) / 40)))) {
      ctx.beginPath(); ctx.moveTo(L, Y(t)); ctx.lineTo(W - R, Y(t)); ctx.stroke();
      ctx.fillText(fmtTick(t), L - 6, Y(t));
    }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (const t of o.xticks || nice(xmin, xmax, Math.max(3, Math.floor((W - L - R) / 70)))) ctx.fillText(fmtTick(t), X(t), H - B + 6);
    ctx.strokeStyle = mut; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, H - B); ctx.lineTo(W - R, H - B); ctx.stroke();
    if (o.xlabel) { ctx.fillStyle = ink; ctx.fillText(o.xlabel, (L + W - R) / 2, H - 16); }
    if (o.ylabel) { ctx.save(); ctx.translate(11, (T + H - B) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = "middle"; ctx.fillStyle = ink; ctx.fillText(o.ylabel, 0, 0); ctx.restore(); }
    if (o.title) { ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillStyle = ink; ctx.font = `600 12px ${css("sans")}`; ctx.fillText(o.title, L, 6); ctx.font = `11px ${css("mono")}`; }
    if (ymin < 0 && ymax > 0) { ctx.strokeStyle = mut; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(W - R, Y(0)); ctx.stroke(); ctx.setLineDash([]); }
    for (const v of o.vlines || []) {
      ctx.strokeStyle = v.color || mut; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(v.x), T); ctx.lineTo(X(v.x), H - B); ctx.stroke(); ctx.setLineDash([]);
      if (v.label) { ctx.fillStyle = v.color || mut; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(v.label, X(v.x) + 4, T + 2); }
    }
    for (const hl of o.hlines || []) {
      ctx.strokeStyle = hl.color || mut; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(L, Y(hl.y)); ctx.lineTo(W - R, Y(hl.y)); ctx.stroke(); ctx.setLineDash([]);
      if (hl.label) { ctx.fillStyle = hl.color || mut; ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillText(hl.label, W - R - 2, Y(hl.y) - 2); }
    }
    ctx.save(); ctx.beginPath(); ctx.rect(L, T - 2, W - L - R, H - T - B + 4); ctx.clip();
    series.forEach((s, si) => {
      const col = s.color ? (s.color.startsWith("--") ? css(s.color.slice(2)) : s.color) : pal[si % pal.length];
      const sx = s.xs || o.xs || s.ys.map((_, i) => i);
      if (s.band) {
        ctx.fillStyle = col; ctx.globalAlpha = 0.15; ctx.beginPath();
        s.band.hi.forEach((y, i) => i ? ctx.lineTo(X(sx[i]), Y(y)) : ctx.moveTo(X(sx[i]), Y(y)));
        for (let i = s.band.lo.length - 1; i >= 0; i--) ctx.lineTo(X(sx[i]), Y(s.band.lo[i]));
        ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      }
      if (s.type === "bar") {
        const bw = Math.max(2, (W - L - R) / sx.length * (s.width || 0.7));
        ctx.fillStyle = col;
        s.ys.forEach((y, i) => { const y0 = Y(Math.max(ymin, 0)), y1 = Y(y); ctx.fillRect(X(sx[i]) - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0)); });
        return;
      }
      if (s.fill) {
        ctx.fillStyle = col; ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.moveTo(X(sx[0]), Y(Math.max(ymin, 0)));
        s.ys.forEach((y, i) => ctx.lineTo(X(sx[i]), Y(y))); ctx.lineTo(X(sx[sx.length - 1]), Y(Math.max(ymin, 0))); ctx.fill(); ctx.globalAlpha = 1;
      }
      if (s.type !== "scatter") {
        ctx.strokeStyle = col; ctx.lineWidth = s.lw || 2; ctx.setLineDash(s.dash ? [6, 4] : []);
        ctx.beginPath(); let pen = false;
        s.ys.forEach((y, i) => { if (!Number.isFinite(y)) { pen = false; return; } pen ? ctx.lineTo(X(sx[i]), Y(y)) : ctx.moveTo(X(sx[i]), Y(y)); pen = true; });
        ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
      }
      if (s.type === "scatter" || s.dots) { ctx.fillStyle = col; s.ys.forEach((y, i) => { ctx.beginPath(); ctx.arc(X(sx[i]), Y(y), s.r || 3, 0, 7); ctx.fill(); }); }
    });
    for (const p of o.points || []) {
      ctx.fillStyle = p.color ? (p.color.startsWith("--") ? css(p.color.slice(2)) : p.color) : css("ink");
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), p.r || 4, 0, 7); ctx.fill();
      if (p.label) { ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText(p.label, X(p.x) + 6, Y(p.y) - 4); }
    }
    ctx.restore();
    const named = series.map((s, i) => [s, i]).filter(([s]) => s.label);
    if (named.length) {
      ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = `11.5px ${css("sans")}`;
      let x = W - R, y = T + 8;
      const items = named.map(([s, i]) => ({ s, col: s.color ? (s.color.startsWith("--") ? css(s.color.slice(2)) : s.color) : pal[i % pal.length], w: ctx.measureText(s.label).width + 26 }));
      const totalW = items.reduce((a, b) => a + b.w, 0);
      x = Math.max(L + 8, W - R - totalW - 4);
      ctx.fillStyle = css("surface"); ctx.globalAlpha = 0.85; ctx.fillRect(x - 4, y - 9, totalW + 6, 18); ctx.globalAlpha = 1;
      for (const it of items) {
        ctx.fillStyle = it.col; ctx.fillRect(x, y - 2, 14, 4);
        ctx.fillStyle = ink; ctx.fillText(it.s.label, x + 18, y); x += it.w;
      }
    }
    o.after && o.after(ctx, { X, Y, W, H, L, R, T, B });
  }
  return { update(n) { o = { ...o, ...n }; cv.redraw(); }, canvas: cv };
};

/* Small form controls. Each returns the input element. */
RL.controls = host => { const d = document.createElement("div"); d.className = "controls"; host.appendChild(d); return d; };
RL.slider = (host, { label, min = 0, max = 1, step = 0.01, value = 0, fmt = v => v }, onInput) => {
  const w = document.createElement("label"); w.className = "ctl";
  w.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${value}"><output></output>`;
  const inp = w.querySelector("input"), out = w.querySelector("output");
  const upd = () => { out.textContent = fmt(+inp.value); onInput && onInput(+inp.value); };
  inp.addEventListener("input", upd); host.appendChild(w); out.textContent = fmt(+value);
  return inp;
};
RL.select = (host, { label, options, value }, onChange) => {
  const w = document.createElement("label"); w.className = "ctl";
  w.innerHTML = `<span>${label}</span><select>${options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${v == value ? " selected" : ""}>${esc(t)}</option>`; }).join("")}</select>`;
  const s = w.querySelector("select"); s.addEventListener("change", () => onChange && onChange(s.value)); host.appendChild(w); return s;
};
RL.button = (host, label, onClick, cls = "btn small") => {
  const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = label; b.addEventListener("click", onClick); host.appendChild(b); return b;
};
RL.readouts = host => {
  const d = document.createElement("div"); d.className = "readouts"; host.appendChild(d);
  return { set(obj) { d.innerHTML = Object.entries(obj).map(([k, v]) => `<span class="r">${k} <b>${v}</b></span>`).join(""); typeset(d); }, el: d };
};
RL.note = (host, html) => { const p = document.createElement("p"); p.className = "widget-note"; p.innerHTML = html; host.appendChild(p); typeset(p); return p; };
RL.typeset = typeset;
/* Seeded RNG so widgets are reproducible: const r = RL.rng(1); r() in [0,1), r.normal() ~ N(0,1). */
RL.rng = (seed = 1) => {
  let s = seed >>> 0 || 1;
  const f = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  f.normal = () => { let u = 0, v = 0; while (!u) u = f(); while (!v) v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return f;
};

function mountWidgets(root, m) {
  for (const el of $$("[data-widget]", root)) {
    const name = el.dataset.widget;
    const fn = (m && m.widgets && m.widgets[name]) || RL.widgets[name];
    el.classList.add("widget");
    if (el.dataset.title) { const t = document.createElement("div"); t.className = "widget-title"; t.textContent = el.dataset.title; el.prepend(t); }
    if (!fn) { el.insertAdjacentHTML("beforeend", `<p class="widget-error">Missing widget: ${esc(name)}</p>`); continue; }
    try { fn(el, RL); } catch (e) { console.error(e); el.insertAdjacentHTML("beforeend", `<p class="widget-error">Widget error: ${esc(e.message)}</p>`); }
  }
}

/* quiz question renderer, shared by module quizzes and exam mode */
function renderQuestion(host, m, i, n, { onAnswer, numbered = true } = {}) {
  const q = m.quiz[i];
  const multi = Array.isArray(q.answer), numeric = !q.choices;
  const name = `q-${m.id}-${i}-${Math.random().toString(36).slice(2, 7)}`;
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `<div class="q-head">${numbered ? `<span class="q-num">Q${pad2(n)}</span>` : ""}<div class="q-text">${q.q}${multi ? '<span class="q-hint">Select all that apply</span>' : ""}</div></div>
    ${numeric ? `<input class="numeric" type="text" inputmode="decimal" placeholder="Your answer">` : `<div class="choices">${q.choices.map((c, j) => `<label class="choice" data-j="${j}"><input type="${multi ? "checkbox" : "radio"}" name="${name}" value="${j}"><span>${c}</span></label>`).join("")}</div>`}
    <div class="q-actions"><button type="button" class="btn small primary check">Check</button><span class="verdict"></span></div>`;
  host.appendChild(div);
  const check = $(".check", div), verdict = $(".verdict", div);
  check.addEventListener("click", () => {
    let ok;
    if (numeric) {
      const v = parseFloat($(".numeric", div).value.replace(/,/g, ""));
      if (!Number.isFinite(v)) { verdict.className = "verdict bad"; verdict.textContent = "Enter a number"; return; }
      ok = Math.abs(v - q.answer) <= (q.tol ?? Math.max(1e-9, Math.abs(q.answer) * 0.01));
    } else {
      const sel = $$("input", div).filter(x => x.checked).map(x => +x.value);
      if (!sel.length) { verdict.className = "verdict bad"; verdict.textContent = "Pick an answer"; return; }
      const want = multi ? q.answer : [q.answer];
      ok = sel.length === want.length && sel.every(s => want.includes(s));
      for (const lab of $$(".choice", div)) {
        const j = +lab.dataset.j, picked = sel.includes(j), right = want.includes(j);
        lab.classList.toggle("correct", right && picked);
        lab.classList.toggle("wrong", picked && !right);
        lab.classList.toggle("missed", right && !picked);
      }
    }
    verdict.className = `verdict ${ok ? "ok" : "bad"}`;
    verdict.textContent = ok ? "Correct" : numeric ? `Not quite. Answer: ${q.answer}` : "Not quite";
    $(".explain", div)?.remove();
    if (q.explain) { const ex = document.createElement("div"); ex.className = "explain"; ex.innerHTML = q.explain; div.appendChild(ex); typeset(ex); }
    check.textContent = "Check again";
    S.quiz[qid(m, i)] = { c: ok ? 1 : 0 };
    save();
    onAnswer && onAnswer(ok);
  });
  typeset(div);
  return div;
}
