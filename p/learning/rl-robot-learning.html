<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL &amp; Robot Learning · Fundamentals Dashboard</title>
<meta name="description" content="An interactive, multi-page learning dashboard for reinforcement learning and robot learning: MDPs, policy gradients, GAE, PPO, GRPO, RLHF, multi-turn agentic RL, imitation learning, VLAs, DSRL and Recap, and experiment craft. Quizzes, flashcards, formula sheet.">
<meta property="og:title" content="RL & Robot Learning · Fundamentals Dashboard">
<meta property="og:description" content="From MDPs to VLA post-training: interactive lessons, quizzes and flashcards.">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181d'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3ERL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="window.RL && RL.mathReady && RL.mathReady()"></script>
<style>
:root{
  --page:#f4f5f2;--surface:#ffffff;--surface-2:#fafaf8;--sunk:#eef0ec;
  --ink:#16181d;--ink-2:#3d4350;--muted:#7a808c;--line:#e3e5e0;--line-2:#d3d6cf;
  --accent:#0f7a63;--accent-2:#0b5e4c;--accent-wash:#e6f4ef;--accent-line:#b9e0d3;
  --amber:#b7740b;--amber-wash:#fdf4e2;--rose:#c2384b;--rose-wash:#fcebee;--blue:#2c5bd6;--blue-wash:#eaf0fd;
  --violet:#6a4bd1;--violet-wash:#f0ecfd;--orange:#c25a1c;--orange-wash:#fdefe6;--slate:#4b5565;--slate-wash:#eef0f3;
  --code-bg:#f3f4f1;--code-ink:#1f2937;
  --c1:#0f7a63;--c2:#2c5bd6;--c3:#c25a1c;--c4:#6a4bd1;--c5:#c2384b;--c6:#7a808c;
  --shadow:0 1px 2px rgba(20,24,30,.04),0 6px 24px rgba(20,24,30,.04);
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sidebar:286px;--radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0e1013;--surface:#15181c;--surface-2:#181b20;--sunk:#1c2026;
  --ink:#eceef0;--ink-2:#b9bec7;--muted:#7f8692;--line:#252a31;--line-2:#323842;
  --accent:#3cc6a0;--accent-2:#62d8b6;--accent-wash:#12302a;--accent-line:#1f5546;
  --amber:#e3a33a;--amber-wash:#2d2412;--rose:#ef6b7d;--rose-wash:#33181d;--blue:#7a9cf5;--blue-wash:#18213a;
  --violet:#a68ff5;--violet-wash:#231d3b;--orange:#f08a4b;--orange-wash:#33200f;--slate:#a3acba;--slate-wash:#1f242b;
  --code-bg:#1b1f25;--code-ink:#dfe3e8;
  --c1:#3cc6a0;--c2:#7a9cf5;--c3:#f08a4b;--c4:#a68ff5;--c5:#ef6b7d;--c6:#8c93a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0e1013;--surface:#15181c;--surface-2:#181b20;--sunk:#1c2026;
  --ink:#eceef0;--ink-2:#b9bec7;--muted:#7f8692;--line:#252a31;--line-2:#323842;
  --accent:#3cc6a0;--accent-2:#62d8b6;--accent-wash:#12302a;--accent-line:#1f5546;
  --amber:#e3a33a;--amber-wash:#2d2412;--rose:#ef6b7d;--rose-wash:#33181d;--blue:#7a9cf5;--blue-wash:#18213a;
  --violet:#a68ff5;--violet-wash:#231d3b;--orange:#f08a4b;--orange-wash:#33200f;--slate:#a3acba;--slate-wash:#1f242b;
  --code-bg:#1b1f25;--code-ink:#dfe3e8;
  --c1:#3cc6a0;--c2:#7a9cf5;--c3:#f08a4b;--c4:#a68ff5;--c5:#ef6b7d;--c6:#8c93a0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
code,pre,kbd,.mono{font-family:var(--mono)}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px}.skip:focus{left:8px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:62px;display:flex;align-items:center;gap:16px;padding:0 22px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.menu-btn{display:none;width:36px;height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);place-items:center}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--ink);color:var(--page);font:800 12px/1 var(--mono);letter-spacing:-.04em}
.brand-copy{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-name{font-size:13px;font-weight:750;letter-spacing:-.005em;white-space:nowrap}
.brand-sub{margin-top:3px;color:var(--muted);font-size:10.5px;letter-spacing:.04em;white-space:nowrap}
.search{position:relative;margin-left:auto;width:min(380px,40vw)}
.search input{width:100%;height:38px;padding:0 64px 0 36px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);outline:none;font-size:13px}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-wash)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;background:var(--surface)}
.search-results{position:absolute;top:44px;left:0;right:0;max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60}
.search-results a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;color:var(--ink)}
.search-results a:hover,.search-results a.sel{background:var(--sunk);text-decoration:none}
.search-results small{color:var(--muted);font-size:11px}
.search-results .none{padding:10px;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk)}
.progress-pill{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:12px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.progress-pill:hover{text-decoration:none;background:var(--sunk)}
.mini-ring{width:18px;height:18px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100vh - 62px)}
aside.sidebar{position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow-y:auto;padding:22px 16px 28px 18px;border-right:1px solid var(--line);background:var(--surface-2);scrollbar-width:thin}
.nav-group{margin:0 0 18px}
.nav-head{display:flex;align-items:center;gap:8px;margin:0 8px 6px;color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.nav-head .tag{display:grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink-2);letter-spacing:0;font-size:9.5px}
.nav-list{list-style:none;margin:0;padding:0}
.nav-list a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.nav-list a:hover{background:var(--sunk);color:var(--ink);text-decoration:none}
.nav-list a.active{background:var(--accent-wash);color:var(--accent-2);font-weight:700}
.nav-num{flex:0 0 20px;color:var(--muted);font:700 10px/1 var(--mono)}
.nav-list a.active .nav-num{color:var(--accent)}
.nav-title{flex:1;min-width:0}
.nav-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2)}
.nav-dot.part{background:conic-gradient(var(--accent) var(--p),transparent 0);border-color:var(--accent-line)}
.nav-dot.done{background:var(--accent);border-color:var(--accent)}
.nav-ico{flex:0 0 20px;display:grid;place-items:center;color:var(--muted)}
.sidebar-foot{margin:20px 8px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}
.sidebar-foot button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:11px}
main{min-width:0;padding:30px clamp(16px,3.6vw,56px) 80px}
.main-inner{max-width:1180px;margin:0 auto}
.scrim{display:none}

/* ---------- generic cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid var(--accent-line);border-radius:6px;background:var(--accent-wash);color:var(--accent-2);font-size:9.5px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.overline{margin:0 0 4px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--sunk);text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--page)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:650;white-space:nowrap}
.chip.on{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-2)}
button.chip:hover{background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .4s}
.muted{color:var(--muted)}

/* part colours */
.pA{--pc:var(--accent);--pw:var(--accent-wash)}.pB{--pc:var(--violet);--pw:var(--violet-wash)}.pC{--pc:var(--orange);--pw:var(--orange-wash)}.pD{--pc:var(--blue);--pw:var(--blue-wash)}

/* ---------- dashboard ---------- */
.hero{position:relative;overflow:hidden;padding:34px 36px 28px}
.hero:after{content:"";position:absolute;right:-90px;top:-120px;width:320px;height:320px;border-radius:50%;border:1px solid var(--accent-line);box-shadow:0 0 0 30px color-mix(in srgb,var(--accent-wash) 55%,transparent),0 0 0 62px color-mix(in srgb,var(--accent-wash) 30%,transparent);pointer-events:none;opacity:.8}
.hero h1{position:relative;z-index:1;margin:14px 0 10px;font-size:clamp(30px,4.4vw,50px);letter-spacing:-.045em;line-height:1.02;max-width:780px}
.hero p.lede{position:relative;z-index:1;max-width:720px;margin:0;color:var(--ink-2);font-size:16px}
.hero-foot{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.hero-meta{display:flex;flex-wrap:wrap;gap:16px;color:var(--ink-2);font-size:12px;font-weight:650}
.hero-meta span:before{content:"";display:inline-block;width:5px;height:5px;margin-right:8px;border-radius:50%;background:var(--muted);vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
.stat{padding:16px 18px}
.stat .k{color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.stat .v{margin-top:6px;font-size:28px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
.stat .bar{margin-top:10px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px}
.section-head h2{margin:0;font-size:21px}
.section-head p{margin:0;color:var(--muted);font-size:12px}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.part-card{padding:18px 18px 14px;border-top:3px solid var(--pc)}
.part-card h3{margin:2px 0 4px;font-size:16px}
.part-card p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.55}
.mod-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mod-rows li{border-bottom:1px solid var(--line)}
.mod-rows li:last-child{border-bottom:0}
.mod-rows a{display:grid;grid-template-columns:26px minmax(0,1fr) 64px 34px;align-items:center;gap:10px;padding:8px 2px;color:var(--ink);font-size:13px}
.mod-rows a:hover{text-decoration:none;background:var(--surface-2)}
.mod-rows .n{font:700 10.5px var(--mono);color:var(--pc)}
.mod-rows .pct{font:650 11px var(--mono);color:var(--muted);text-align:right}
.mod-rows .bar>span{background:var(--pc)}
.continue{padding:20px 22px}
.continue h3{margin:6px 0 4px;font-size:18px}
.continue p{margin:0 0 14px;color:var(--ink-2);font-size:13px}
.side-stack{display:flex;flex-direction:column;gap:16px}
.list-card{padding:18px 20px}
.list-card h3{margin:0 0 10px;font-size:15px}
.list-card ul{list-style:none;margin:0;padding:0}
.list-card li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.list-card li:last-child{border-bottom:0}
.empty-note{color:var(--muted);font-size:13px;margin:0}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.phase{padding:16px 16px 14px;position:relative}
.phase .wk{font:700 10.5px var(--mono);color:var(--muted)}
.phase h4{margin:4px 0 6px;font-size:14.5px}
.phase p{margin:0 0 10px;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.phase .star{color:var(--amber)}
.tools-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tool{display:block;padding:16px 18px;color:var(--ink)}
.tool:hover{text-decoration:none;border-color:var(--accent-line)}
.tool b{display:block;font-size:14px}
.tool span{color:var(--muted);font-size:12.5px}

/* ---------- module page ---------- */
.mod-hero{padding:28px 32px 24px;border-top:4px solid var(--pc)}
.mod-hero .kicker{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:10.5px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}
.mod-hero .badge{display:grid;place-items:center;padding:4px 8px;border-radius:7px;background:var(--pw);color:var(--pc);font:800 11px var(--mono);letter-spacing:0}
.mod-hero h1{margin:12px 0 8px;font-size:clamp(28px,3.8vw,42px);letter-spacing:-.04em}
.mod-hero .sub{margin:0;color:var(--ink-2);font-size:16px;max-width:820px}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.objectives{margin-top:18px;padding:14px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.objectives h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.objectives ul{margin:0;padding-left:20px;columns:2;column-gap:28px;font-size:13.5px}
.objectives li{break-inside:avoid;margin:2px 0}
.mod-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;margin-top:22px;align-items:start}
.toc{position:sticky;top:84px;padding:14px 14px 10px;font-size:12px}
.toc h4{margin:0 0 8px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:8px;align-items:baseline;padding:4px 6px;border-radius:6px;color:var(--ink-2);line-height:1.4}
.toc a:hover{background:var(--sunk);text-decoration:none}
.toc a.cur{color:var(--accent-2);font-weight:700}
.toc a .ck{flex:0 0 12px;color:var(--muted)}
.toc a.read .ck{color:var(--accent)}
.toc .bar{margin:10px 6px 4px}
.lesson{padding:26px 30px 18px;margin-bottom:18px}
.lesson>h2{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;font-size:23px}
.lesson>h2 .sn{font:750 12px var(--mono);color:var(--pc);padding:3px 7px;border-radius:6px;background:var(--pw)}
.lesson-body{font-size:15.5px;line-height:1.75}
.lesson-body>*:first-child{margin-top:0}
.lesson-body h3{margin:26px 0 8px;font-size:17.5px}
.lesson-body h4{margin:20px 0 6px;font-size:15px}
.lesson-body p{margin:0 0 14px}
.lesson-body ul,.lesson-body ol{margin:0 0 14px;padding-left:22px}
.lesson-body li{margin:4px 0}
.lesson-body code{padding:1px 5px;border-radius:5px;background:var(--code-bg);color:var(--code-ink);font-size:.86em}
.lesson-body pre{margin:0 0 16px;padding:14px 16px;border-radius:11px;background:var(--code-bg);border:1px solid var(--line);overflow-x:auto;font-size:12.8px;line-height:1.6}
.lesson-body pre code{padding:0;background:none;font-size:inherit}
.lesson-body pre .c{color:var(--muted)}
.lesson-body pre .k{color:var(--violet)}
.lesson-body pre .s{color:var(--accent-2)}
.lesson-body pre .n{color:var(--orange)}
.lesson-body table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:13.5px;display:block;overflow-x:auto}
.lesson-body thead{background:var(--surface-2)}
.lesson-body th,.lesson-body td{padding:8px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.lesson-body th{font-size:12px;font-weight:750}
.lesson-body blockquote{margin:0 0 14px;padding:4px 16px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.lesson-body figure{margin:0 0 18px}
.lesson-body figcaption{margin-top:6px;color:var(--muted);font-size:12.5px;text-align:center}
.lesson-body svg{max-width:100%;height:auto}
.lesson-body .katex-display{margin:14px 0 16px;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.callout{margin:0 0 16px;padding:13px 16px 13px 16px;border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:10px;background:var(--slate-wash);font-size:14.5px}
.callout>*:last-child{margin-bottom:0}
.callout>b:first-child,.callout>strong:first-child{display:block;margin-bottom:3px;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.callout.tip{border-left-color:var(--accent);background:var(--accent-wash)}.callout.tip>b:first-child{color:var(--accent-2)}
.callout.key{border-left-color:var(--violet);background:var(--violet-wash)}.callout.key>b:first-child{color:var(--violet)}
.callout.warn{border-left-color:var(--amber);background:var(--amber-wash)}.callout.warn>b:first-child{color:var(--amber)}
.callout.example{border-left-color:var(--blue);background:var(--blue-wash)}.callout.example>b:first-child{color:var(--blue)}
.callout.interview{border-left-color:var(--orange);background:var(--orange-wash)}.callout.interview>b:first-child{color:var(--orange)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.grid2>div,.grid3>div{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:14px}
.grid2>div>*:last-child,.grid3>div>*:last-child{margin-bottom:0}
.grid2 h4,.grid3 h4{margin:0 0 6px!important}
.steps{counter-reset:st;list-style:none;padding-left:0!important}
.steps>li{counter-increment:st;position:relative;padding-left:36px;margin:8px 0!important}
.steps>li:before{content:counter(st);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:7px;background:var(--pw,var(--accent-wash));color:var(--pc,var(--accent));font:750 11.5px/24px var(--mono);text-align:center}
.formula{margin:0 0 16px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.formula .label{display:block;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.formula .katex-display{margin:6px 0 4px}
.lesson-foot{display:flex;justify-content:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mark{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mark:hover{background:var(--sunk)}
.mark.on{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-2)}
.mark .box{width:15px;height:15px;border:1.5px solid currentColor;border-radius:4px;display:grid;place-items:center;font-size:10px;line-height:1}

/* widgets */
.widget{margin:4px 0 20px;padding:16px 18px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2)}
.widget-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.widget-title:before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}
.widget canvas{display:block;width:100%;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 4px;font-size:12.5px}
.ctl{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.ctl input[type=range]{width:150px;accent-color:var(--accent)}
.ctl output,.readout{font:650 12px var(--mono);color:var(--ink)}
.ctl select,.ctl input[type=number],.ctl input[type=text]{padding:4px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:12.5px}
.ctl input[type=number]{width:80px}
.readouts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.readouts .r{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px}
.readouts .r b{font:700 12px var(--mono)}
.widget-note{margin:8px 0 0;color:var(--muted);font-size:12.5px}
.widget-error{color:var(--rose);font-size:12px}

/* self-check, quiz */
.block{padding:24px 30px;margin-bottom:18px}
.block>h2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px;font-size:21px}
.block>p.muted{margin:0 0 16px;font-size:13px}
details.sc{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--surface-2)}
details.sc summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:650;font-size:14.5px;display:flex;gap:10px}
details.sc summary::-webkit-details-marker{display:none}
details.sc summary:before{content:"+";flex:0 0 18px;color:var(--accent);font:700 15px var(--mono)}
details.sc[open] summary:before{content:"–"}
details.sc .ans{padding:0 16px 12px 42px;color:var(--ink-2);font-size:14.5px}
details.sc .ans>*:last-child{margin-bottom:0}
.q{padding:16px 18px;border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--surface)}
.q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q-num{flex:0 0 auto;font:750 11px var(--mono);color:var(--muted)}
.q-text{font-weight:650;font-size:15px;line-height:1.55}
.q-text p{margin:0 0 6px}
.q-text pre{font-size:12.5px;padding:10px 12px;background:var(--code-bg);border-radius:8px;overflow-x:auto}
.q-hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:6px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);font-size:14px;line-height:1.5;cursor:pointer;text-align:left}
.choice:hover{border-color:var(--accent-line)}
.choice input{margin:4px 0 0;accent-color:var(--accent)}
.choice.correct{border-color:var(--accent);background:var(--accent-wash)}
.choice.wrong{border-color:var(--rose);background:var(--rose-wash)}
.choice.missed{border-style:dashed;border-color:var(--accent)}
.q-actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.verdict{font-size:13px;font-weight:750}
.verdict.ok{color:var(--accent)}.verdict.bad{color:var(--rose)}
.explain{margin-top:10px;padding:10px 14px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.explain>*:last-child{margin-bottom:0}
.numeric{width:140px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.score-line{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.score-line .bar{width:140px}
.deck-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.links{list-style:none;margin:0;padding:0}
.links li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.links li:last-child{border-bottom:0}
.links small{display:block;color:var(--muted);font-size:12.5px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.pager a{display:flex;flex-direction:column;padding:14px 18px;color:var(--ink)}
.pager a:hover{text-decoration:none;border-color:var(--accent-line)}
.pager a.next{text-align:right}
.pager small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pager b{font-size:15px}

/* exam */
.exam-setup .chips{margin:8px 0 16px}
.exam-card{padding:26px 30px}
.exam-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12px;color:var(--muted);font-weight:700}
.exam-top .bar{flex:1;max-width:340px}
.exam-card .q{border:0;padding:0;background:none}
.result-big{font-size:46px;font-weight:800;letter-spacing:-.04em;margin:4px 0}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px}
.fc{width:min(720px,100%);min-height:280px;perspective:1600px;cursor:pointer;border:0;background:none;padding:0}
.fc-inner{position:relative;width:100%;min-height:280px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:30px 36px;border:1px solid var(--line-2);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:18px;line-height:1.55;text-align:center;overflow:auto}
.fc-face.back{transform:rotateY(180deg);font-size:15.5px;text-align:left;background:var(--surface-2)}
.fc-face .tagline{position:absolute;top:14px;left:18px;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.fc-face .tagline.r{left:auto;right:18px}
.fc-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.fc-count{font:650 12px var(--mono);color:var(--muted)}

/* formulas & glossary */
.f-group{margin:0 0 24px}
.f-group>h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:16px}
.f-group>h3 .badge{font:750 11px var(--mono);padding:3px 7px;border-radius:6px;background:var(--pw);color:var(--pc)}
.f-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f-card{padding:14px 18px}
.f-card .name{font-weight:750;font-size:13.5px}
.f-card .tex{overflow-x:auto;overflow-y:hidden;margin:4px 0}
.f-card .note{color:var(--muted);font-size:12.5px;line-height:1.55}
.filter{width:100%;max-width:420px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;margin:0 0 16px}
.filter:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-wash)}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gloss .g{padding:12px 16px}
.gloss dt{font-weight:750;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.gloss dt a{font-size:11px;font-weight:650;color:var(--muted)}
.gloss dd{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.6}
.letter{grid-column:1/-1;margin:12px 0 0;font:800 12px var(--mono);color:var(--accent)}

/* plan */
.plan-phase{padding:24px 28px;margin-bottom:16px;border-left:4px solid var(--pc)}
.plan-phase header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.plan-phase h2{margin:0;font-size:22px}
.plan-phase .goal{margin:6px 0 14px;color:var(--ink-2)}
.plan-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.plan-cols h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.checks{list-style:none;margin:0 0 14px;padding:0}
.checks li{margin:0 0 4px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:14px;line-height:1.5;cursor:pointer}
.checks label:hover{background:var(--surface-2)}
.checks input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.req-mods{display:flex;flex-direction:column;gap:6px}
.req-mods a{display:grid;grid-template-columns:28px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:13px}
.req-mods a:hover{text-decoration:none;border-color:var(--accent-line)}
.req-mods .n{font:750 10.5px var(--mono);color:var(--pc)}
.req-mods .pct{font:650 11px var(--mono);color:var(--muted);text-align:right}
.page-title{margin:0 0 6px;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.035em}
.page-lede{margin:0 0 22px;color:var(--ink-2);max-width:760px}

/* ---------- responsive ---------- */
@media (max-width:1180px){.mod-layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1020px){.dash-grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:grid}
  aside.sidebar{position:fixed;top:62px;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:45;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  body.nav-open aside.sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:62px 0 0;z-index:44;background:rgba(0,0,0,.25)}
  .brand-sub{display:none}
  .parts,.f-grid,.gloss,.grid2,.grid3,.plan-cols{grid-template-columns:minmax(0,1fr)}
  .objectives ul{columns:1}
}
@media (max-width:640px){
  .topbar{padding:0 12px;gap:10px}
  .brand-copy{display:none}
  .search{width:auto;flex:1}
  .search kbd{display:none}
  .progress-pill span{display:none}
  main{padding:18px 16px 60px}
  .hero{padding:24px 20px}
  .timeline,.tools-grid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:14px}
  .stat .v{font-size:24px}
  .lesson,.block,.mod-hero,.plan-phase,.exam-card{padding:20px 18px}
  .lesson>h2{font-size:20px}
  .lesson-body{font-size:15px}
  .ctl input[type=range]{width:120px}
  .pager{grid-template-columns:minmax(0,1fr)}
  .fc-face{padding:30px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,aside.sidebar,.toc,.pager,.lesson-foot{display:none!important}.layout{display:block}.card{box-shadow:none}}

<script>/* plan.js */

RL.PARTS = [
  { id: "A", title: "RL foundations", blurb: "MDPs, value functions, TD learning, policy gradients, GAE and PPO: the machinery every later module reuses." },

];

RL.PLAN = {
  goal: "Understand the full post-training pipeline (data → model → SFT → RL → eval), with hands-on RL first and robot policies second, and come out with 2–3 public projects for robot-learning job applications. Each phase below lists the modules to read before you start it, and the checklist is saved in this browser.",
  phases: [
    {
      id: "phase-0", part: "A", weeks: "Week 1", name: "Phase 0 · RL fundamentals", short: "CleanRL PPO on CartPole and MuJoCo, then a ~200-line GRPO loop on a tiny LLM.",
      goal: "Get the core algorithms into your fingers: run PPO, break it on purpose, and write GRPO from scratch without an RL library.",
      modules: ["math", "mdp", "td", "pg", "gae", "ppo", "llm", "grpo"],

        { text: "Write a minimal GRPO loop from scratch (~200 lines) on a tiny LLM. No RL libraries.", module: "grpo" },
        { text: "Read OpenAI Spinning Up: intro + PPO.", module: "papers" },
        { text: "Read the PPO paper (Schulman et al., 2017).", module: "papers" },
        { text: "Read the GRPO section of DeepSeekMath (Shao et al., 2024).", module: "papers" },
      ],
      doneWhen: [
        { text: "Advantages: what they are and why they reduce variance", module: "pg" },
        { text: "GAE: the λ trade-off and the recursive formula", module: "gae" },
        { text: "The value loss: targets, clipping, and why it's a regression", module: "gae" },

    {

      goal: "Train a small LLM (Qwen 1.5–4B, LoRA) to act as a <b>step-by-step robot task planner</b> in a symbolic text environment you build: one action per turn, with the new state or an error coming back. Actions fail randomly and objects hide in containers, so the model has to replan.",
      modules: ["llm", "rlhf", "grpo", "agentic", "ppo", "exp", "compute"],
      tasks: [
        { text: "Build the environment: a symbolic executor (PDDL or a Python scene graph) with a text observation and action API.", module: "agentic" },
        { text: "Make it hard: random action failures, objects hidden in containers, partial observability.", module: "agentic" },
        { text: "Generate verified plans (classical planner) and distil/SFT the model on them.", module: "llm" },
        { text: "RL on top of SFT with TRL or verl, vLLM for rollouts, Unsloth/LoRA to fit one 24 GB GPU.", module: "compute" },
      ],
      experiments: [
        { text: "GRPO vs. PPO with a learned value head", module: "grpo" },

    {
      id: "why-advantages",
      title: "From returns to advantages",
      html: String.raw`
<p>Every policy-gradient method you will run in this plan (REINFORCE, A2C, PPO, GRPO) has the same skeleton. Sample actions from the current policy, decide <em>how good each action turned out to be</em>, and push up the log-probability of the good ones in proportion:</p>
<div class="formula"><span class="label">Policy gradient with a generic credit signal</span>
$$\nabla_\theta J(\theta) = \mathbb{E}_{\pi_\theta}\Big[\sum_t \nabla_\theta \log \pi_\theta(a_t\mid s_t)\,\Psi_t\Big]$$</div>
<p>Module 03 showed that $\Psi_t$ can be many things and the gradient stays (approximately) correct: the total return $G_0$, the reward-to-go $G_t$, the reward-to-go minus a baseline $G_t - b(s_t)$, the action-value $Q^\pi(s_t,a_t)$, or the <b>advantage</b> $A^\pi(s_t,a_t)$. They differ enormously in <b>variance</b>, and that difference decides whether your run learns in 100k steps or never. This module is about building the best practical $\Psi_t$: an estimate $\hat A_t$ of the advantage.</p>

<h3>What the advantage measures</h3>
<div class="formula"><span class="label">Advantage</span>
$$A^\pi(s,a) = Q^\pi(s,a) - V^\pi(s), \qquad \mathbb{E}_{a\sim\pi(\cdot\mid s)}\big[A^\pi(s,a)\big] = 0$$</div>
<p>$V^\pi(s)$ is what you expect to get from $s$ if you follow the policy; $Q^\pi(s,a)$ is what you expect if you first take $a$ and then follow the policy. The advantage is the <em>surprise attributable to the action</em>: "how much better than my usual behaviour in this state was this particular choice?" Because it averages to zero under the policy, roughly half of sampled actions get pushed up and half pushed down, instead of every action in a high-return episode getting pushed up.</p>

<div class="callout example"><b>Worked example: why raw returns are a bad credit signal</b>
<p>CartPole gives +1 per step. An episode that lasts 300 steps has $G_0 = 300$ (undiscounted); one that lasts 20 steps has $G_0 = 20$. With $\Psi_t = G_0$, <em>every</em> action of the long episode is reinforced 15× harder than every action of the short one, including the clumsy action at step 299 that finally dropped the pole. With reward-to-go, the action at step 299 only gets credit $\approx 1$. With an advantage, the action at step 299 gets <em>negative</em> credit, because from that state the policy usually survives longer than it did after this action. That is the signal you actually want.</p></div>

<h3>Three ways to estimate it</h3>
<p>We never know $Q^\pi$ or $V^\pi$. We have sampled rewards and a learned critic $V_\phi \approx V^\pi$. Every advantage estimator is some mix of the two:</p>
<div class="grid3">
<div><h4>Monte Carlo</h4><p>$\hat A_t = G_t - V_\phi(s_t)$ with $G_t = \sum_{l} \gamma^l r_{t+l}$ to the end of the episode.</p><p><b>Unbiased</b> for any $V_\phi$ (it is just a baseline), but the sum of many noisy rewards has <b>high variance</b>, and you must wait for the episode to end.</p></div>
<div><h4>One-step TD</h4><p>$\hat A_t = r_t + \gamma V_\phi(s_{t+1}) - V_\phi(s_t) = \delta_t$.</p><p><b>Low variance</b> (one reward, one transition), but <b>biased</b> whenever the critic is wrong, which early in training it always is.</p></div>
<div><h4>Everything in between</h4><p>Use $n$ real rewards, then bootstrap: $n$-step estimators. GAE blends all $n$ with weights controlled by $\lambda$.</p><p>This is what PPO, A2C (in most modern code) and PPO-for-LLMs actually use.</p></div>
</div>

<div class="callout key"><b>Key idea</b><p>The critic exists for one reason: to replace the noisy tail of the return with a prediction. Every step you replace with $V_\phi$ removes variance and adds whatever error $V_\phi$ has at that state. $\lambda$ is the knob that chooses how far into the future you trust real rewards before you switch to trusting the critic.</p></div>

<h3>Why variance is the enemy</h3>
<p>The policy gradient is an average of $\nabla \log\pi \cdot \hat A$ over a batch. Its standard error scales like $\sqrt{\operatorname{Var}[\hat A]/N}$. Halving the variance of $\hat A$ is worth doubling your batch, which in Phase 2 means doubling the number of expensive simulator episodes, and in Phase 1 doubling LLM generation time (which already dominates the cost of RL on language models, see <a href="#/m/compute">Module 16</a>). Bias is also bad, but a modest bias toward "trust the critic" is usually a good trade, and the empirical sweet spot ($\lambda\approx 0.95$) sits well toward the biased side of pure Monte Carlo.</p>

<h3>Where this shows up in your plan</h3>
<ul>
<li><b>Phase 0 (CleanRL PPO):</b> the block of code after the rollout that loops <code>for t in reversed(range(num_steps))</code> computes exactly the GAE advantages of this module, then sets <code>returns = advantages + values</code> as the critic's target. You will break it on purpose by changing <code>gae_lambda</code> and <code>gamma</code>.</li>
<li><b>Phase 1 (LLM planner):</b> "PPO with a learned value head" means a critic on top of the language model that predicts the value of each token prefix (or turn), and GAE over tokens or turns. GRPO (<a href="#/m/grpo">Module 08</a>) deletes the critic and uses a group-relative return instead: that is the $\lambda=1$, "no learned baseline" end of this module's spectrum, with the group mean as the baseline. Comparing the two is one of your Phase 1 experiments.</li>
<li><b>Phase 2 (robot RL):</b> success-only rewards over hundreds of control steps are the hardest credit-assignment setting there is. A value function that predicts success probability is the core of Recap-style methods (<a href="#/m/robotrl">Module 13</a>), and the value-loss lessons here apply directly.</li>
</ul>

<div class="callout interview"><b>What interviewers ask</b><p>"Why subtract a baseline, and why the value function in particular?" Answer in three beats: (1) any action-independent baseline leaves the gradient unbiased because $\mathbb{E}_a[\nabla\log\pi(a\mid s)] = 0$; (2) it reduces variance by centring the credit signal; (3) $V^\pi(s)$ is close to the variance-minimising baseline and turns $Q - b$ into the advantage, which has the clean interpretation "better or worse than usual". Then mention that in practice we also use $V$ to <em>bootstrap</em>, which is a separate trick that does add bias.</p></div>
`,

    {
      id: "td-error",
      title: "The TD error and n-step advantages",
      html: String.raw`
<h3>The TD error is a one-sample advantage</h3>
<div class="formula"><span class="label">TD error (TD residual)</span>
$$\delta_t^{V} = r_t + \gamma V(s_{t+1}) - V(s_t)$$</div>
<p>Suppose for a moment the critic is perfect, $V = V^\pi$. Condition on the state and the action actually taken, and take the expectation over the next reward and next state:</p>
$$\mathbb{E}\big[\delta_t^{V^\pi} \mid s_t, a_t\big] = \underbrace{\mathbb{E}\big[r_t + \gamma V^\pi(s_{t+1}) \mid s_t, a_t\big]}_{=\,Q^\pi(s_t,a_t)\ \text{(Bellman)}} - V^\pi(s_t) = A^\pi(s_t, a_t).$$
<p>So the TD error is an <b>unbiased one-sample estimate of the advantage</b> when the critic is exact. When the critic is wrong by $e(s) = V(s) - V^\pi(s)$, the expectation picks up an error term $\gamma\,\mathbb{E}[e(s_{t+1})] - e(s_t)$. The $-e(s_t)$ part is harmless for the policy gradient (it depends only on the state, so it acts like a baseline). The $\gamma\,e(s_{t+1})$ part is <b>real bias</b>: it depends on which action you took, because the action decides where you land.</p>

<div class="callout warn"><b>Common confusion</b><p>"Bias" in this module always means bias of the <em>policy gradient</em>, not of the number $\hat A_t$ itself. An estimator that is off by any function of $s_t$ alone still gives an unbiased gradient. Schulman et al. call estimators with this property <b>$\gamma$-just</b>. Keep that in mind when someone says "the Monte Carlo advantage $G_t - V(s_t)$ is biased if $V$ is wrong": the number is, the gradient is not.</p></div>

<h3>n-step advantage estimators</h3>
<p>Use $k$ real rewards, then bootstrap with the critic:</p>
<div class="formula"><span class="label">k-step advantage</span>
$$\hat A_t^{(k)} = -V(s_t) + r_t + \gamma r_{t+1} + \dots + \gamma^{k-1} r_{t+k-1} + \gamma^k V(s_{t+k}) = \sum_{l=0}^{k-1} \gamma^l \delta_{t+l}$$</div>
<p>The second equality is a telescoping sum, and it is the single most useful algebraic fact in this module. Write it out for $k=2$:</p>
$$\delta_t + \gamma\delta_{t+1} = \big(r_t + \gamma V_{t+1} - V_t\big) + \gamma\big(r_{t+1} + \gamma V_{t+2} - V_{t+1}\big) = r_t + \gamma r_{t+1} + \gamma^2 V_{t+2} - V_t.$$
<p>The intermediate value $V_{t+1}$ cancels. Every $k$-step advantage is a discounted sum of TD errors, so if you have the $\delta$'s you have every estimator.</p>

<figure>
<svg viewBox="0 0 620 250" role="img" aria-label="n-step backups: each estimator uses k real rewards then bootstraps with the critic">

    </g>
    <text x="200" y="94">Â(1) = δ_t        weight (1−λ)</text>
    <text x="320" y="134">Â(2)        weight (1−λ)λ</text>
    <text x="440" y="174">Â(3)   (1−λ)λ²</text>
    <text x="60" y="236">Â(∞) = G_t − V(s_t): all real rewards, no bootstrap</text>
  </g>
</svg>
<figcaption>Each bar is one estimator: real rewards along the bar, then a bootstrap from the critic at the diamond. GAE averages all of them with geometrically decaying weights.</figcaption>
</figure>

<h3>The bias–variance ladder</h3>
<table>
<thead><tr><th>estimator</th><th>real rewards used</th><th>bias (wrong critic)</th><th>variance</th></tr></thead>
<tbody>
<tr><td>$\hat A^{(1)} = \delta_t$</td><td>1</td><td>high: $\gamma\, e(s_{t+1})$</td><td>lowest</td></tr>
<tr><td>$\hat A^{(k)}$</td><td>$k$</td><td>$\gamma^k e(s_{t+k})$, shrinks geometrically</td><td>grows with $k$</td></tr>
<tr><td>$\hat A^{(\infty)} = G_t - V(s_t)$</td><td>all</td><td>none (γ-just)</td><td>highest</td></tr>
</tbody>
</table>
<p>The bias term shrinks like $\gamma^k$ because the bootstrap happens $k$ steps later and is discounted. The variance grows because each extra real reward adds its own noise (from the environment's stochasticity <em>and</em> from the policy's own random future actions).</p>

<div class="callout example"><b>Worked example: computing δ by hand</b>
<p>$\gamma = 0.99$, $r_t = 1$, $V(s_t) = 9.5$, $V(s_{t+1}) = 10$. Not terminal: $\delta_t = 1 + 0.99 \cdot 10 - 9.5 = 1.4$. The step was better than the critic expected, so the action gets positive credit. If instead $s_{t+1}$ was a <em>terminal</em> state (the pole fell), $V(s_{t+1}) := 0$ and $\delta_t = 1 - 9.5 = -8.5$: a strongly negative signal. Whether you multiply by $(1-\text{terminated})$ or by $(1-\text{done})$ is exactly the truncation bug of <a href="#/m/gae/truncation">lesson 4.7</a>.</p></div>

<h3>Picking a single n is awkward</h3>
<p>A2C-style code (and the original A3C paper) uses a fixed $n$ equal to the rollout length: each step bootstraps from wherever the rollout ended, so early steps in the rollout get long $n$ and late steps get short $n$. That works, but the trade-off varies by position in the buffer and you have one coarse knob. GAE replaces "choose $n$" with "average over all $n$", which gives a smooth knob and the same trade-off at every step. It costs nothing extra: it is still one backwards pass over the $\delta$'s.</p>

<div class="callout tip"><b>Practical tip</b><p>Log the mean and standard deviation of $\delta_t$ (or of the raw advantages before normalisation). Early in training they are large and the critic is learning; a critic that never brings $\lvert\delta\rvert$ down is a critic that is not fitting, and every downstream advantage is then mostly noise.</p></div>
`,
    },
    /* ------------------------------------------------------------------ 3 */
    {
      id: "gae-derivation",
      title: "GAE: derivation and the recursion",
      html: String.raw`
<p>Generalized Advantage Estimation (Schulman, Moritz, Levine, Jordan, Abbeel, 2015) takes the exponentially weighted average of the $k$-step estimators, exactly like TD($\lambda$) averages $n$-step returns:</p>
<div class="formula"><span class="label">GAE definition</span>
$$\hat A_t^{\text{GAE}(\gamma,\lambda)} = (1-\lambda)\Big(\hat A_t^{(1)} + \lambda \hat A_t^{(2)} + \lambda^2 \hat A_t^{(3)} + \dots\Big)$$</div>
<p>The weights $(1-\lambda)\lambda^{k-1}$ sum to one. Now substitute $\hat A^{(k)} = \sum_{l\lt k}\gamma^l\delta_{t+l}$ and collect the coefficient of each $\delta_{t+l}$. The term $\gamma^l\delta_{t+l}$ appears in every estimator with $k \gt  l$, so its total weight is $(1-\lambda)(\lambda^l + \lambda^{l+1} + \dots) = \lambda^l$:</p>
$$\begin{aligned}
\hat A_t &= (1-\lambda)\Big[\delta_t\,(1+\lambda+\lambda^2+\dots) + \gamma\delta_{t+1}\,(\lambda+\lambda^2+\dots) + \gamma^2\delta_{t+2}\,(\lambda^2+\dots) + \dots\Big] \\
&= (1-\lambda)\Big[\frac{\delta_t}{1-\lambda} + \frac{\gamma\lambda\,\delta_{t+1}}{1-\lambda} + \frac{(\gamma\lambda)^2\delta_{t+2}}{1-\lambda} + \dots\Big]
\end{aligned}$$
<div class="formula"><span class="label">GAE closed form</span>
$$\hat A_t^{\text{GAE}(\gamma,\lambda)} = \sum_{l=0}^{\infty} (\gamma\lambda)^l\, \delta_{t+l}$$</div>
<p>That is the whole algorithm: a discounted sum of TD errors with discount $\gamma\lambda$ instead of $\gamma$. The two limits:</p>
<div class="grid2">
<div><h4>$\lambda = 0$</h4><p>$\hat A_t = \delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)$. One-step TD: lowest variance, biased by critic error.</p></div>
<div><h4>$\lambda = 1$</h4><p>$\hat A_t = \sum_l \gamma^l \delta_{t+l} = \sum_l \gamma^l r_{t+l} - V(s_t) = G_t - V(s_t)$. Monte Carlo with a baseline: γ-just, highest variance.</p></div>
</div>

<h3>The backwards recursion</h3>
<p>Peel off the first term of the sum: $\hat A_t = \delta_t + \gamma\lambda\sum_{l\ge0}(\gamma\lambda)^l\delta_{t+1+l} = \delta_t + \gamma\lambda\hat A_{t+1}$. Add episode boundaries (if the episode ended after step $t$, nothing after it belongs to this episode):</p>
<div class="formula"><span class="label">GAE recursion (what the code does)</span>
$$\hat A_t = \delta_t + \gamma\lambda\,(1 - d_{t})\,\hat A_{t+1}, \qquad \delta_t = r_t + \gamma\,(1-d_{t})\,V(s_{t+1}) - V(s_t)$$</div>
<p>Here $d_t = 1$ if the episode <em>ended at the transition out of step $t$</em>. (Lesson 4.7 splits $d_t$ into "terminated" and "truncated", which matters; ignore that for now.) Compute it from the last step of the buffer to the first, seeding $\hat A_T = 0$ and using $V(s_T)$, the critic's value of the observation that comes after the last stored step, as the bootstrap. Cost: $O(T)$ per environment, one pass.</p>

<div data-widget="gaeExplorer" data-title="Interactive · GAE over a sample trajectory"></div>

<h3>Effective horizon</h3>
<p>The weight on a TD error $l$ steps in the future is $(\gamma\lambda)^l$. The weights sum to $1/(1-\gamma\lambda)$, so GAE "looks" about that many steps ahead before it hands the rest to the critic. With the defaults $\gamma=0.99$, $\lambda=0.95$: $\gamma\lambda = 0.9405$ and the effective horizon is about <b>17 steps</b>, while $\gamma$ alone has a horizon of 100 steps. The two parameters do different jobs:</p>
<ul>
<li><b>$\gamma$ defines the objective.</b> It sets what the value function means and how far ahead the agent cares. Changing $\gamma$ changes the problem (and the scale of $V$: for reward 1 per step, $V\approx 1/(1-\gamma)$).</li>
<li><b>$\lambda$ is purely an estimator choice.</b> It does not change what $V$ is supposed to be; it changes how much of the 100-step horizon is estimated from real rewards vs from the critic.</li>
</ul>
<p>The GAE paper argues both act as variance-reduction knobs relative to the true undiscounted objective, with $\lambda$ introducing far less bias than $\gamma$ for an accurate critic. In practice: set $\gamma$ from the task's time scale, then leave $\lambda$ at 0.95 unless you have a reason.</p>

<h3>The value target is the λ-return</h3>
<p>Add $V(s_t)$ back to the advantage. Since $\hat A^{(k)} + V(s_t) = G_t^{(k)}$, the $k$-step return, the same weights give</p>
<div class="formula"><span class="label">GAE return = TD(λ) return</span>
$$R_t \;=\; \hat A_t^{\text{GAE}} + V(s_t) \;=\; (1-\lambda)\sum_{k\ge1}\lambda^{k-1} G_t^{(k)} \;=\; G_t^{\lambda}$$</div>
<p>That is why CleanRL writes <code>returns = advantages + values</code>: it is not a hack, it is the $\lambda$-return from Sutton &amp; Barto chapter 12, and it is the regression target for the critic. With $\lambda=1$ it is the Monte Carlo return; with $\lambda=0$ it is the TD(0) target $r_t + \gamma V(s_{t+1})$.</p>

<div class="callout example"><b>Worked example: three steps by hand</b>
<p>$\gamma = 0.9$, $\lambda = 0.8$, so $\gamma\lambda = 0.72$. A rollout gives TD errors $\delta_0 = 1$, $\delta_1 = 0.5$, $\delta_2 = -1$ and ends there (the bootstrap is already inside $\delta_2$). Backwards: $\hat A_2 = -1$; $\hat A_1 = 0.5 + 0.72\cdot(-1) = -0.22$; $\hat A_0 = 1 + 0.72\cdot(-0.22) = 0.8416$. Check with the closed form: $1 + 0.72 \cdot 0.5 + 0.72^2\cdot(-1) = 1 + 0.36 - 0.5184 = 0.8416$.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Derive GAE" is a standard whiteboard question. The fast path: (1) define $\delta_t$ and show $E[\delta_t]=A$ for the true $V$; (2) write $\hat A^{(k)}$ as a sum of $\delta$'s by telescoping; (3) average with weights $(1-\lambda)\lambda^{k-1}$ and collect terms to get $\sum(\gamma\lambda)^l\delta_{t+l}$; (4) state the recursion and the two limits. Follow-up: "What is $\lambda$ for?" bias–variance; "Why not just tune $\gamma$?" $\gamma$ changes the objective, $\lambda$ does not.</p></div>
`,
    },
    /* ------------------------------------------------------------------ 4 */
    {
      id: "bias-variance",
      title: "The λ bias–variance trade-off",
      html: String.raw`
<p>Write the critic as $V = V^\pi + e$, where $e(s)$ is its error. Plug into the closed form and split each TD error into the "true" one and an error part:</p>
$$\delta_l^{V} = \delta_l^{V^\pi} + \gamma\,e(s_{l+1}) - e(s_l), \qquad \hat A_t = \underbrace{\sum_l(\gamma\lambda)^l\delta_{t+l}^{V^\pi}}_{\text{unbiased, noisy}} + \underbrace{\sum_l(\gamma\lambda)^l\big[\gamma e(s_{t+l+1}) - e(s_{t+l})\big]}_{\text{critic-error term}}.$$
<p>Collect the coefficient on each $e(s_{t+k})$ for $k\ge1$: it is $\gamma(\gamma\lambda)^{k-1} - (\gamma\lambda)^k = \gamma^k\lambda^{k-1}(1-\lambda)$. So</p>
<div class="formula"><span class="label">How critic error leaks into GAE</span>
$$\hat A_t - \hat A_t^{V^\pi} = -e(s_t) + \sum_{k\ge 1} \gamma^k \lambda^{k-1}(1-\lambda)\, e(s_{t+k})$$</div>
<ul>
<li>The $-e(s_t)$ term depends only on the current state: harmless for the gradient.</li>
<li>The rest is the bias. It vanishes at $\lambda = 1$ (the factor $1-\lambda$) and is $\gamma e(s_{t+1})$ at $\lambda=0$. In between, errors at nearby future states get weight $\approx\gamma(1-\lambda)$, decaying with $(\gamma\lambda)^{k}$.</li>
</ul>
<p>The variance goes the other way. If each step contributes independent noise of variance $\sigma^2$ (environment randomness plus the policy's own sampling), the noisy part $\sum_l(\gamma\lambda)^l\delta^{V^\pi}_{t+l}$ has variance about $\sigma^2\sum_l(\gamma\lambda)^{2l} = \sigma^2/(1-\gamma^2\lambda^2)$. For $\gamma = 0.99$, that is $\approx 1\sigma^2$ at $\lambda=0$, $\approx 8.6\sigma^2$ at $\lambda = 0.95$ and $\approx 50\sigma^2$ at $\lambda=1$ (infinite horizon). Those are real numbers worth remembering: $\lambda=1$ can cost you a factor of five or more in variance compared with $\lambda=0.95$.</p>

<div data-widget="biasVariance" data-title="Interactive · bias², variance and MSE of GAE vs λ"></div>

<h3>What decides the best λ</h3>
<div class="grid2">
<div><h4>Push λ toward 1 when…</h4><ul><li>the critic is bad (early training, hard-to-fit values, very sparse rewards: Phase 2 success rewards)</li><li>rewards are nearly deterministic, so variance is cheap</li><li>you have no critic at all (GRPO, REINFORCE with a mean baseline)</li><li>episodes are short (LLM single-turn tasks: a few hundred tokens with reward only at the end)</li></ul></div>
<div><h4>Push λ lower when…</h4><ul><li>the critic is accurate (late training, dense shaped rewards)</li><li>the environment is very stochastic and episodes are long</li><li>advantages look like pure noise (low explained variance <em>of the policy improvement</em>, not just the critic)</li><li>you need fast learning from short rollouts (bootstrap does the heavy lifting)</li></ul></div>
</div>

<div class="callout tip"><b>Practical defaults</b><p>$\lambda = 0.95$ with $\gamma = 0.99$ is the default in the PPO paper's experiments, CleanRL, Stable-Baselines3 and most libraries; the GAE paper's locomotion experiments found the best values in roughly the 0.92–0.99 range. For LLM PPO, many RLHF implementations use $\gamma = 1$ (episodes are short and the objective is the final reward) with $\lambda$ around 0.95 or 1; check the defaults of whatever library you use (TRL, OpenRLHF, verl) rather than assuming.</p></div>

<h3>A subtle point: the critic is trained on its own targets</h3>
<p>With $\lambda \lt  1$, the target $R_t = G^\lambda_t$ contains the critic's own predictions. Errors can therefore persist: if the critic overestimates a region of state space, the targets for states leading there are also inflated. This is the same mechanism as bootstrapping in TD learning (<a href="#/m/td">Module 02</a>), though on-policy evaluation with $\lambda$ near 1 is far more stable than off-policy Q-learning (no max, no deadly triad). Concretely, in your Phase 0 runs, $\lambda=0$ often learns <em>much</em> more slowly on tasks where reward arrives late: information about a reward travels back only one state per critic update. The PPO simulator in <a href="#/m/ppo/break-it">Module 05</a> shows this: on its corridor task $\lambda = 0$ converges to the nearby small reward instead of the far big one.</p>

<div class="callout warn"><b>Common mistake</b><p>Interpreting "λ=1 is unbiased" as "λ=1 is best". Unbiased with five times the variance is usually worse. The MSE curve in the widget above has its minimum strictly inside $(0,1)$ for any non-trivial critic error and noise, which is the whole reason GAE exists.</p></div>

<div class="callout interview"><b>What interviewers ask</b><p>"You switched from λ=0.95 to λ=1 and learning got slower but the final return is slightly higher. Explain." Higher variance gradients need more samples per unit of progress (slower), but removing critic bias lets the policy optimise the true discounted objective (slightly better asymptote). Mention that the same logic explains why GRPO, which has no critic, needs several samples per prompt: the group is its variance reduction.</p></div>
`,

    {
      id: "implementation",
      title: "Implementing GAE on a rollout buffer",
      html: String.raw`
<p>On-policy algorithms collect a fixed-size rollout: <code>num_envs</code> parallel environments for <code>num_steps</code> steps each, giving a buffer of shape <code>[num_steps, num_envs]</code>. Episodes start and end anywhere inside it. GAE must (1) cut the recursion at episode boundaries, (2) bootstrap from $V(s_{T})$ at the end of the buffer for environments whose episode is still running, and (3) never bootstrap across a reset.</p>

<h3>Reference implementation (clear flags)</h3>
<pre><code><span class="c"># rewards, values, terminated, truncated: [T, N] tensors from the rollout</span>
<span class="c"># terminated[t]/truncated[t] = the step taken at t ended the episode</span>
<span class="c"># next_value: [N] = V(obs after the last stored step) (from the live envs)</span>
<span class="c"># final_values[t]: V(true final obs) where truncated[t] (0 elsewhere)</span>
<span class="k">def</span> gae(rewards, values, terminated, truncated, next_value, final_values, gamma=<span class="n">0.99</span>, lam=<span class="n">0.95</span>):
    T = rewards.shape[<span class="n">0</span>]
    adv = torch.zeros_like(rewards)
    last = torch.zeros_like(next_value)
    <span class="k">for</span> t <span class="k">in</span> reversed(range(T)):
        v_next = next_value <span class="k">if</span> t == T - <span class="n">1</span> <span class="k">else</span> values[t + <span class="n">1</span>]
        v_next = torch.where(truncated[t].bool(), final_values[t], v_next)  <span class="c"># bootstrap from the REAL final obs</span>
        done = torch.maximum(terminated[t], truncated[t])
        delta = rewards[t] + gamma * v_next * (<span class="n">1</span> - terminated[t]) - values[t]
        last = delta + gamma * lam * (<span class="n">1</span> - done) * last   <span class="c"># cut the recursion at ANY episode end</span>
        adv[t] = last
    returns = adv + values                                   <span class="c"># λ-return targets for the critic</span>
    <span class="k">return</span> adv, returns
</code></pre>
<p>Note the two different masks. <b>Termination</b> zeroes the bootstrap value (there is no future). <b>Any</b> episode end (termination or truncation) zeroes the carried advantage, because the next row of the buffer belongs to a different episode. Getting either mask wrong is silent: training still runs, just worse.</p>

<h3>CleanRL's version and its "shifted dones" convention</h3>
<p>CleanRL's <code>ppo.py</code> stores, at each step, the done flag <em>that was returned by the previous step</em>: <code>dones[step] = next_done</code> happens before the env is stepped. So <code>dones[t]</code> means "$s_t$ is the first observation of a new episode", and the flag for "the episode ended after step $t$" is <code>dones[t+1]</code> (or <code>next_done</code> for the last step). Its GAE loop reads, in essence:</p>
<pre><code><span class="k">with</span> torch.no_grad():
    next_value = agent.get_value(next_obs).reshape(<span class="n">1</span>, -<span class="n">1</span>)
    advantages = torch.zeros_like(rewards).to(device)
    lastgaelam = <span class="n">0</span>
    <span class="k">for</span> t <span class="k">in</span> reversed(range(args.num_steps)):
        <span class="k">if</span> t == args.num_steps - <span class="n">1</span>:
            nextnonterminal = <span class="n">1.0</span> - next_done
            nextvalues = next_value
        <span class="k">else</span>:
            nextnonterminal = <span class="n">1.0</span> - dones[t + <span class="n">1</span>]
            nextvalues = values[t + <span class="n">1</span>]
        delta = rewards[t] + args.gamma * nextvalues * nextnonterminal - values[t]
        advantages[t] = lastgaelam = delta + args.gamma * args.gae_lambda * nextnonterminal * lastgaelam
    returns = advantages + values
</code></pre>
<p>It uses a single flag for both masks and sets <code>next_done = terminations | truncations</code>, i.e. it treats a time-limit truncation like a real termination. That is a deliberate simplification (it keeps the file short and is mostly harmless on CartPole), and it is precisely the bug lesson 4.7 is about. Fixing it is an excellent Phase 0 exercise.</p>

<figure>

<h3>Shapes, devices and other practicalities</h3>
<ul>
<li><b>Compute under <code>torch.no_grad()</code>.</b> Advantages and returns are constants for the update; gradients must not flow into the critic through them.</li>
<li><b>Use the values stored during the rollout</b>, not fresh ones computed after the update starts. The advantage must be computed with the same critic that produced <code>values</code>, before any gradient step.</li>
<li><b>The Python loop is fine.</b> It is $O(T)$ and vectorised across environments; for <code>num_steps = 128</code> it costs microseconds compared with the network forward passes. JAX code uses <code>lax.scan</code> in reverse; there is no need to be clever in PyTorch.</li>
<li><b>Flatten after, not before.</b> Compute GAE on the <code>[T, N]</code> layout, then reshape to <code>[T*N]</code> for minibatching. Flattening first mixes environments and silently connects unrelated episodes.</li>
<li><b>Bootstrap at the end of the rollout is not optional.</b> The last steps of the buffer are not terminal, they are just where you stopped looking. Using $V(s_T)$ is correct; using 0 there is a bug that biases values downward near the end of every rollout.</li>
</ul>

<h3>GAE over tokens and turns (Phase 1)</h3>
<p>For an LLM, a "step" can be a token (classic RLHF PPO: per-token values from a value head, reward at the last token plus per-token KL penalties) or a turn (agentic RL: one value per assistant turn). Either way, the recursion is identical; only the indexing changes. Two traps: (1) environment-produced tokens (tool output, the simulator's observation text) are not actions, so they must be masked out of the policy loss, and if you do token-level GAE you must decide whether they carry a value at all (usually: compute values only at action tokens and treat the environment tokens as part of the transition); (2) padding tokens after end-of-sequence must be masked from every loss and from the advantage normalisation statistics. <a href="#/m/agentic">Module 09</a> covers the turn-level design.</p>

<div class="callout warn"><b>Common bug</b><p>Computing GAE per <em>minibatch</em> after shuffling. The recursion needs consecutive steps of the same environment. Always compute advantages for the whole rollout first, then shuffle.</p></div>
`,

    {
      id: "value-loss",
      title: "The value loss: targets, clipping, Huber",
      html: String.raw`
<p>The critic is trained by <b>regression</b>: given states from the rollout and targets $R_t$, minimise squared error. There is nothing RL-specific about the loss; everything RL-specific is in how the targets are built and how stale they are.</p>
<div class="formula"><span class="label">Value loss (MSE)</span>
$$L^{V}(\phi) = \tfrac12\,\mathbb{E}_t\Big[\big(V_\phi(s_t) - R_t\big)^2\Big], \qquad R_t = \hat A_t^{\text{GAE}} + V_{\phi_\text{old}}(s_t)$$</div>
<p>$R_t$ is computed once, before the update epochs, from the critic that collected the data, and then held fixed. The critic regresses toward a target that partly came from its past self (when $\lambda\lt 1$): a slow-moving target, like a target network in DQN but refreshed every rollout.</p>

<h3>Choices of target</h3>
<table>
<thead><tr><th>target</th><th>formula</th><th>notes</th></tr></thead>
<tbody>
<tr><td>Monte Carlo return</td><td>$G_t$</td><td>unbiased, high variance, needs complete episodes (or a bootstrap at the rollout end anyway)</td></tr>
<tr><td>TD(0)</td><td>$r_t + \gamma V(s_{t+1})$</td><td>low variance, slow propagation of information</td></tr>
<tr><td>λ-return (default)</td><td>$\hat A_t + V(s_t)$</td><td>same λ as the advantages; what CleanRL, SB3 and the PPO paper's code use</td></tr>
</tbody>
</table>
<p>You can decouple the critic's λ from the actor's λ (some implementations do), but there is rarely a reason to in Phase 0.</p>

<h3>Value-function clipping</h3>
<p>OpenAI's baselines PPO introduced a PPO-style clip for the value function, and CleanRL keeps it behind <code>clip_vloss=True</code>:</p>
<div class="formula"><span class="label">Clipped value loss</span>
$$L^{V}_{\text{clip}} = \tfrac12\,\mathbb{E}_t\Big[\max\Big(\big(V_\phi(s_t) - R_t\big)^2,\ \big(V_{\phi_\text{old}}(s_t) + \operatorname{clip}(V_\phi(s_t) - V_{\phi_\text{old}}(s_t), -\epsilon, \epsilon) - R_t\big)^2\Big)\Big]$$</div>
<p>The second term measures the error of a "clipped prediction" that is not allowed to move more than $\epsilon$ from the value at collection time. Taking the max means: if the new prediction has moved outside $[V_\text{old}-\epsilon, V_\text{old}+\epsilon]$ <em>and</em> moving further does not help, the gradient is zero. It is meant to stop the critic from jumping far in one update.</p>
<pre><code><span class="c"># CleanRL-style (newvalue has grad; b_values, b_returns are constants)</span>
v_loss_unclipped = (newvalue - b_returns[mb]) ** <span class="n">2</span>
v_clipped = b_values[mb] + torch.clamp(newvalue - b_values[mb], -clip_coef, clip_coef)
v_loss_clipped = (v_clipped - b_returns[mb]) ** <span class="n">2</span>
v_loss = <span class="n">0.5</span> * torch.max(v_loss_unclipped, v_loss_clipped).mean()
</code></pre>
<div class="callout warn"><b>Why value clipping is controversial</b><p>(1) $\epsilon$ is in <b>value units</b>, and CleanRL reuses the policy's <code>clip_coef = 0.2</code>. With returns in the hundreds (CartPole, γ=0.99, values up to ~100) a 0.2 clip makes the critic crawl; with normalised rewards it is roughly reasonable. (2) Large empirical studies (Engstrom et al. 2020, "Implementation Matters"; Andrychowicz et al. 2021, "What Matters in On-Policy RL") found value clipping does not help and can hurt. Stable-Baselines3 disables it by default (<code>clip_range_vf=None</code>). Treat it as a knob to ablate in your "break it" exercise, not a law.</p></div>

<h3>Huber loss</h3>
<p>Huber (PyTorch's <code>smooth_l1_loss</code>) is quadratic for small errors and linear for large ones, so a few huge targets (a rare big reward, an unnormalised return) do not dominate the gradient. It is standard in DQN and occasionally used in actor-critic. With reward scaling and λ-returns, plain MSE is the usual PPO choice. If you see value-loss spikes that coincide with rare large rewards, Huber or better reward normalisation are the fixes.</p>

<h3>Weighting the value loss and network sharing</h3>
<p>PPO's combined loss is <code>pg_loss - ent_coef * entropy + vf_coef * v_loss</code> (<a href="#/m/ppo/full-loss">Module 05</a>). Two architectures:</p>
<div class="grid2">
<div><h4>Separate networks</h4><p>CleanRL's MLP agents (CartPole, MuJoCo). The policy and value never interfere. Note a subtle consequence: with Adam and disjoint parameters, multiplying the value loss by <code>vf_coef</code> barely changes the critic's step (Adam normalises per parameter). What still couples them is <b>global gradient-norm clipping</b>: a huge value gradient inflates the total norm and shrinks the policy update too.</p></div>
<div><h4>Shared trunk</h4><p>CleanRL's Atari CNN, and every LLM with a value head. Now <code>vf_coef</code> matters a lot: the value gradient reshapes features the policy uses. Too large and the value regression dominates the representation; too small and the critic lags. In LLM PPO the value head is often initialised from the reward model or a separate copy of the model to avoid this interference.</p></div>
</div>

<h3>Explained variance: the critic's health check</h3>
<div class="formula"><span class="label">Explained variance</span>
$$\text{EV} = 1 - \frac{\operatorname{Var}[R_t - V(s_t)]}{\operatorname{Var}[R_t]}$$</div>
<p>EV = 1: the critic predicts the targets perfectly. EV = 0: no better than predicting the batch mean. EV &lt; 0: worse than a constant (the critic is actively wrong, often right after a policy change or a reward-scale shift). CleanRL logs it every iteration as <code>losses/explained_variance</code>, computed from the rollout's stored values and the returns.</p>
<div data-widget="explainedVar" data-title="Interactive · what explained variance does and doesn't see"></div>
<div class="callout tip"><b>Reading EV in practice</b><ul><li>It should rise early in training. Stuck near 0 or negative for long: the critic is not learning (learning rate, scale, a bug in targets or masks).</li><li>It is <b>blind to a constant offset</b> (variance ignores shifts). A critic that is off by +50 everywhere has EV = 1. Also log value loss and the mean of $V$ vs mean of $R$.</li><li>With $\lambda&lt;1$ the targets contain $V$ itself, which inflates EV somewhat; don't over-celebrate a high number.</li><li>A sudden EV crash usually means the policy just changed a lot (check approx_kl) or rewards changed scale.</li></ul></div>

<div class="callout interview"><b>What interviewers ask</b><p>"Why is the value loss just a regression? Isn't RL different?" Yes, it is plain supervised regression onto fixed targets for the duration of one update. The RL-specific parts are that the targets are bootstrapped (they move between updates and contain the critic's own errors), that the input distribution shifts as the policy changes, and that the targets' scale can drift by orders of magnitude over training, which is why reward/return normalisation matters more than the choice of loss.</p></div>
`,

    {
      id: "truncation",
      title: "Terminated vs truncated: the classic bug",
      html: String.raw`
<p>An episode can end for two very different reasons, and Gymnasium (since 0.26) reports them separately: <code>obs, reward, terminated, truncated, info = env.step(action)</code>.</p>
<div class="grid2">
<div><h4>terminated</h4><p>The MDP reached a terminal state: the pole fell, the robot fell over, the task was solved. There is no future reward by definition, so $V(s_{\text{terminal}}) = 0$ is <b>true</b>.</p></div>
<div><h4>truncated</h4><p>Something outside the MDP stopped the episode: a time limit (CartPole-v1 at 500 steps, MuJoCo tasks at 1000), the end of your rollout buffer, a crashed simulator. The state you ended in still has a future. Setting its value to 0 is <b>false</b>.</p></div>
</div>
<p>The correct one-step target at the final transition differs:</p>
<div class="formula"><span class="label">Bootstrapping at the end of an episode</span>
$$y_t = \begin{cases} r_t & \text{terminated} \\ r_t + \gamma\,V(s_{t+1}^{\text{final}}) & \text{truncated (time limit)} \end{cases}$$</div>
<p>In GAE terms: termination zeroes the bootstrap inside $\delta_t$; both termination and truncation stop the recursion from carrying $\hat A_{t+1}$ (the next buffer row is a different episode).</p>

<div data-widget="bootstrapDemo" data-title="Interactive · value targets with and without the time-limit bug"></div>

<h3>Why the bug hurts more than it looks</h3>
<p>Treat truncation as termination and the critic is told that a perfectly healthy upright pole at step 499 is worth $\approx 1$, while the identical state at step 10 is worth $\approx 100$. The observation contains no clock, so the critic sees the <b>same input with wildly different targets</b>: the time limit has made the problem non-Markov from the critic's point of view. Consequences: (1) the critic can't fit, explained variance drops; (2) the advantages of late-episode actions are biased negative, so the policy is punished for whatever it did just before an arbitrary cutoff; (3) for locomotion with 1000-step limits, the effect is large enough to change final returns noticeably. Pardo et al. (2018), "Time Limits in Reinforcement Learning", analyse this and give the two principled fixes:</p>
<ol>
<li><b>Partial-episode bootstrapping</b> (what you usually want): if the limit is not part of the task, bootstrap at truncation as above.</li>
<li><b>Time-aware observations</b>: if the limit <em>is</em> part of the task (you really only have 500 steps), put the remaining time into the observation and then treat the timeout as a real termination. Now the critic can tell step 10 from step 499.</li>
</ol>

<h3>Getting the final observation right</h3>
<p>With vectorised environments, the env that finished is reset automatically, so <code>next_obs</code> is the <em>first</em> observation of the next episode, not the last of the old one. Bootstrapping from it is a second, quieter bug. Where the true final observation lives depends on the Gymnasium version and autoreset mode: in the 0.29-style vector API it is in <code>infos["final_observation"]</code> (with a mask <code>infos["_final_observation"]</code>); Gymnasium 1.x defaults to a "next-step" autoreset in which the step that ends the episode returns the real final observation and the <em>following</em> <code>step()</code> performs the reset (its action is ignored), so you must mask out that reset transition instead. Read the docs for the version pinned in your environment before writing this code.</p>
<pre><code><span class="c"># one clean pattern (0.29-style vector API): fold the bootstrap into the reward</span>
next_obs, reward, term, trunc, infos = envs.step(action)
<span class="k">if</span> <span class="s">"final_observation"</span> <span class="k">in</span> infos:
    <span class="k">for</span> i <span class="k">in</span> np.where(trunc &amp; ~term)[<span class="n">0</span>]:
        fo = torch.as_tensor(infos[<span class="s">"final_observation"</span>][i], dtype=torch.float32, device=device)
        <span class="k">with</span> torch.no_grad():
            reward[i] += gamma * agent.get_value(fo).item()   <span class="c"># r + γ·V(s_final)</span>
done = term | trunc   <span class="c"># after folding, treat every episode end as terminal</span>
</code></pre>
<p>Folding $\gamma V(s^{\text{final}})$ into the reward and then treating the step as terminal gives exactly the correct $\delta$ and the correct recursion cut. Stable-Baselines3 handles timeouts this way in its on-policy rollout collection. One caveat: if you use observation normalisation, the final observation must go through the same normaliser as everything else before you evaluate $V$ on it.</p>

<h3>The rollout boundary is also a truncation</h3>
<p>The end of your rollout buffer cuts every unfinished episode. CleanRL handles that one correctly: <code>next_value = agent.get_value(next_obs)</code> bootstraps the last row. So the code is right at the rollout boundary and wrong at the time-limit boundary, the same concept treated two ways.</p>

<h3>In your plan</h3>
<ul>
<li><b>Phase 0:</b> On CartPole-v1, compare CleanRL's default with a version that bootstraps at truncation; then do it on Hopper or HalfCheetah, where episodes routinely hit the 1000-step limit. Plot value loss and explained variance, not just return.</li>
<li><b>Phase 1:</b> an LLM agent hitting a maximum number of turns, or a response hitting <code>max_new_tokens</code>, is a design decision. If the turn budget is part of the task and visible in the prompt, it is a real termination (with a failure reward). If it is just a compute cap, it is a truncation. With GRPO there is no critic to bootstrap from, so you must pick a reward for truncated episodes (often 0 or a small penalty) and document it; overlong filtering in DAPO (<a href="#/m/grpo">Module 08</a>) is one answer to exactly this.</li>
<li><b>Phase 2:</b> robot episodes are almost always time-limited (e.g. a few hundred control steps). A task that "failed" by running out of time is truncation for the environment, but if success within the limit is the objective, put time (or the step index) into the critic's input.</li>
</ul>
