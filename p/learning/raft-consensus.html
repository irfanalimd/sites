  font: 400 var(--ix-fs-caption)/26px var(--ix-font-sans);
  letter-spacing: -0.008em;
  color: var(--ix-ink);
  text-wrap: balance;
  text-shadow: var(--ix-halo);
  -webkit-user-select: text; user-select: text;
}

/* caption markup */
.ix-chip {
  display: inline-flex; align-items: center;
  height: 22px; padding: 0 7px; margin: 0 1px;
  border-radius: 6px;
  font: 500 0.78em/1 var(--ix-font-mono);
  letter-spacing: 0;
  white-space: nowrap;
  text-shadow: none;
  vertical-align: baseline;
}
.ix-key { background: var(--k); color: var(--ix-key-ink); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.28), inset 0 -1px 0 rgb(var(--ix-shade-rgb) / 0.14), 0 1px 2px rgb(var(--ix-shade-rgb) / 0.18); }
.ix-key-unknown { background: rgb(var(--ix-ink-rgb) / 0.1); color: var(--ix-ink); box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.12); }
.ix-ref {
  background: rgb(var(--ix-ink-rgb) / 0.07);
  color: var(--ix-ink);
  box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.16);
  cursor: default;
  transition: background-color var(--ix-dur-fast) var(--ix-ease), box-shadow var(--ix-dur-fast) var(--ix-ease);
}
.ix-ref::before { content: ""; width: 5px; height: 5px; border-radius: 50%; margin-right: 6px; background: rgb(var(--ix-ink-rgb) / 0.45); transition: background-color var(--ix-dur-fast) var(--ix-ease), box-shadow var(--ix-dur-fast) var(--ix-ease); }
.ix-ref:hover, .ix-ref:focus-visible { background: rgb(var(--ix-lit-rgb) / 0.14); box-shadow: inset 0 0 0 1px rgb(var(--ix-lit-rgb) / 0.42); }
.ix-ref:hover::before, .ix-ref:focus-visible::before { background: var(--ix-lit); box-shadow: 0 0 6px rgb(var(--ix-lit-rgb) / 0.8); }
.ix-tone { font-weight: 550; }
.ix-tone-ok { color: var(--ix-ok); }
.ix-tone-busy { color: var(--ix-busy); }
.ix-tone-warn { color: var(--ix-warn); }
.ix-tone-fail { color: var(--ix-fail); }
.ix-tone-idle { color: var(--ix-ink-muted); }
.ix-code-inline {
  font: 400 0.84em/1 var(--ix-font-mono);
  padding: 3px 6px; margin: 0 1px;
  border-radius: 5px;
  background: rgb(var(--ix-ink-rgb) / 0.08);
  box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.06);
  text-shadow: none;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.ix-bold { font-weight: 600; }
.ix-nowrap { white-space: nowrap; }

/* meters */
.ix-meter { display: grid; grid-template-columns: minmax(0, 1fr) 52px auto; align-items: center; gap: 12px; min-height: 30px; padding: 4px 16px; }
/* labels never truncate: they wrap, and `short` stands in for them where space is tight */
.ix-meter-label { font-size: 12.5px; line-height: 16px; color: var(--ix-ink-muted); overflow-wrap: break-word; text-wrap: balance; }
.ix-ml-short { display: none; }
.ix-meter-val { min-width: 8ch; text-align: right; white-space: nowrap; font: 500 13px/1 var(--ix-font-mono); font-variant-numeric: tabular-nums; color: var(--ix-ink); }
.ix-meter-unit { margin-left: 4px; font-weight: 400; font-size: 11.5px; color: var(--ix-ink-muted); }
.ix-spark { width: 52px; height: 18px; overflow: visible; }
.ix-spark-base { stroke: rgb(var(--ix-ink-rgb) / 0.1); stroke-width: 1; fill: none; stroke-dasharray: 1 2; }
.ix-spark-line { stroke: rgb(var(--ix-ink-rgb) / 0.55); stroke-width: 1.25; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ix-spark-area { fill: rgb(var(--ix-ink-rgb) / 0.07); stroke: none; }
.ix-spark-dot { fill: var(--ix-ink); }

/* compare mode: one row per label, one column per group, values racing side by side */
.ix-cmp {
  display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--n, 2), minmax(68px, auto));
  column-gap: 16px; padding: 0 16px 4px;
}
.ix-meters.ix-has-cmp:not(.ix-only-cmp) .ix-cmp { margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--ix-hair); }
.ix-cmp-row { display: contents; }
.ix-cmp-group {
  padding: 8px 0 4px; text-align: right; white-space: nowrap;
  font: 500 9.5px/14px var(--ix-font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ix-ink-faint);
}
/* label and value share the first line; the racing bar sits under the value */
.ix-cmp-label { display: flex; align-items: flex-start; padding: 9px 0 13px; }
.ix-cmp-cell { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-start; gap: 5px; padding: 9px 0 6px; }
.ix-cmp-cell .ix-meter-val { min-width: 0; line-height: 16px; transition: color var(--ix-dur-slow) var(--ix-ease); }
.ix-cmp-cell.ix-trail .ix-meter-val { color: var(--ix-ink-muted); }
.ix-cmp-bar { position: relative; width: 100%; height: 2px; border-radius: 1px; overflow: hidden; background: rgb(var(--ix-ink-rgb) / 0.08); }
.ix-cmp-bar > i { position: absolute; inset: 0; border-radius: 1px; background: rgb(var(--ix-ink-rgb) / 0.5); transform: scaleX(0); transform-origin: left center; transition: background-color var(--ix-dur-slow) var(--ix-ease); }
.ix-cmp-cell.ix-lead .ix-cmp-bar > i { background: var(--ix-ink); }
.ix-cmp-cell.ix-trail .ix-cmp-bar > i { background: rgb(var(--ix-ink-rgb) / 0.28); }
.ix-cmp-empty { color: var(--ix-ink-faint); font: 400 12px/16px var(--ix-font-mono); text-align: right; }

/* predict */
.ix-predict {
  width: min(520px, 100%); padding: 16px 16px 14px;
  pointer-events: auto;
  display: none;
  text-align: left;
}
.ix-predict.ix-open { display: block; animation: ix-rise var(--ix-dur-slow) var(--ix-ease); }
.ix-predict-head { display: flex; align-items: center; gap: 12px; min-height: 20px; margin-bottom: 10px; }
.ix-predict-head .ix-badge { margin-right: auto; }
.ix-predict-head .ix-close { margin: -6px -8px -6px -4px; }
.ix-badge { display: inline-flex; align-items: center; gap: 8px; font: 500 10.5px/14px var(--ix-font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ix-warn); }
.ix-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgb(var(--ix-warn-rgb) / 0.18); animation: ix-pulse 1.6s var(--ix-ease-io) infinite; }
.ix-predict.ix-revealed .ix-badge-dot { animation: none; }
.ix-predict-status { font: 500 10.5px/14px var(--ix-font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ix-ink-faint); }
.ix-predict-status.ix-tone-ok { color: var(--ix-ok); }
.ix-predict-status.ix-tone-fail { color: var(--ix-fail); }
.ix-predict-q { margin: 0 0 12px; font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.01em; color: var(--ix-ink); text-wrap: pretty; }
.ix-opts { display: flex; flex-direction: column; gap: 6px; }
.ix-opt {
  display: flex; align-items: center; gap: 10px;
  min-height: 40px; padding: 8px 10px 8px 8px;
  border-radius: 10px;
  text-align: left;
  font-size: 13.5px; line-height: 19px; color: var(--ix-ink);
  background: rgb(var(--ix-ink-rgb) / 0.045);
  box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.08);
  transition: background-color var(--ix-dur-fast) var(--ix-ease), box-shadow var(--ix-dur-fast) var(--ix-ease), opacity var(--ix-dur-slow) var(--ix-ease);
}
.ix-opt:hover { background: rgb(var(--ix-ink-rgb) / 0.08); box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.16); }
.ix-opt-key {
  flex: none; display: grid; place-items: center;
  width: 22px; height: 22px; border-radius: 6px;
  font: 500 11px/1 var(--ix-font-mono); color: var(--ix-ink-muted);
  background: rgb(var(--ix-ink-rgb) / 0.08);
  transition: background-color var(--ix-dur-base) var(--ix-ease), color var(--ix-dur-base) var(--ix-ease);
}
.ix-opt-text { flex: 1; min-width: 0; }
.ix-opt-mark { flex: none; width: 16px; height: 16px; }
.ix-predict.ix-locked .ix-opt { cursor: default; }
.ix-predict.ix-locked .ix-opt:not(.ix-chosen):not(.ix-correct) { opacity: 0.5; }
.ix-predict.ix-locked .ix-opt:hover { background: rgb(var(--ix-ink-rgb) / 0.045); box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.08); }
.ix-opt.ix-chosen, .ix-predict.ix-locked .ix-opt.ix-chosen:hover { box-shadow: inset 0 0 0 1px rgb(var(--ix-ink-rgb) / 0.5); background: rgb(var(--ix-ink-rgb) / 0.09); }
.ix-opt.ix-chosen .ix-opt-key { background: var(--ix-ink); color: var(--ix-stage); }
.ix-opt.ix-correct, .ix-predict.ix-locked .ix-opt.ix-correct:hover { background: rgb(var(--ix-ok-rgb) / 0.12); box-shadow: inset 0 0 0 1px rgb(var(--ix-ok-rgb) / 0.55); opacity: 1; }
.ix-opt.ix-correct .ix-opt-key { background: var(--ix-ok); color: var(--ix-key-ink); }
.ix-opt.ix-correct .ix-opt-mark { color: var(--ix-ok); }
.ix-opt.ix-wrong, .ix-predict.ix-locked .ix-opt.ix-wrong:hover { background: rgb(var(--ix-fail-rgb) / 0.1); box-shadow: inset 0 0 0 1px rgb(var(--ix-fail-rgb) / 0.5); }
.ix-opt.ix-wrong .ix-opt-key { background: var(--ix-fail); color: var(--ix-key-ink); }
.ix-opt.ix-wrong .ix-opt-mark { color: var(--ix-fail); }
.ix-predict-foot { margin-top: 12px; font-size: 11.5px; line-height: 16px; color: var(--ix-ink-faint); }
.ix.ix-asking .ix-caption { opacity: 0.55; transition: opacity var(--ix-dur-slow) var(--ix-ease); }

/* transport */
.ix-transport {
  pointer-events: auto;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "btns scrub count speed";
  align-items: center; column-gap: 16px;
  height: 60px; padding: 0 10px 0 10px;
}
.ix-tp-btns { grid-area: btns; display: flex; align-items: center; gap: 4px; }
.ix-step { width: 32px; height: 32px; border-radius: 10px; }
.ix-play {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ix-ink); color: var(--ix-stage);
  box-shadow: 0 1px 2px rgb(var(--ix-shade-rgb) / 0.25), inset 0 -1px 0 rgb(var(--ix-shade-rgb) / 0.12);
  transition: transform var(--ix-dur-fast) var(--ix-ease), background-color var(--ix-dur-fast) var(--ix-ease);
}
.ix-play svg { width: 15px; height: 15px; }
.ix-play:hover { transform: scale(1.05); }
.ix-play:active { transform: scale(0.95); }
.ix[data-theme="light"] .ix-play { color: var(--ix-tile); }

.ix-scrub-wrap { grid-area: scrub; position: relative; min-width: 0; height: 100%; display: flex; align-items: center; }
.ix-scrub { position: relative; width: 100%; height: 44px; cursor: pointer; touch-action: none; border-radius: 8px; outline-offset: 0; }
.ix-scrub:focus-visible { outline-offset: 2px; }
.ix-scrub-labels { position: absolute; left: 0; right: 0; top: 4px; height: 14px; }
.ix-seg-label {
  position: absolute; top: 0;
  font: 500 10px/14px var(--ix-font-mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ix-ink-faint);
  white-space: nowrap; overflow: hidden; text-overflow: clip;
  transition: color var(--ix-dur-slow) var(--ix-ease);
}
.ix-seg-label.ix-past { color: var(--ix-ink-muted); }
.ix-seg-label.ix-cur { color: var(--ix-ink); }
.ix-seg-label.ix-hide { visibility: hidden; }
.ix-track { position: absolute; left: 0; right: 0; top: 24px; height: 4px; transform-origin: 50% 50%; transition: transform var(--ix-dur-base) var(--ix-ease); }
.ix-scrub:not(.ix-has-labels) .ix-track { top: 20px; }
.ix-scrub.ix-hovering .ix-track, .ix.ix-scrubbing .ix-track { transform: scaleY(1.5); }
.ix-segs { position: absolute; inset: 0; }
.ix-seg { position: absolute; top: 0; height: 4px; border-radius: 2px; background: rgb(var(--ix-ink-rgb) / 0.14); }
.ix-segs-fill .ix-seg { background: rgb(var(--ix-ink-rgb) / 0.86); }
.ix-ticks { position: absolute; left: 0; right: 0; top: 32px; height: 5px; pointer-events: none; }
.ix-scrub:not(.ix-has-labels) .ix-ticks { top: 28px; }
.ix-tick { position: absolute; top: 0; width: 1.5px; height: 4px; margin-left: -0.75px; border-radius: 1px; background: rgb(var(--ix-ink-rgb) / 0.22); }
.ix-tick-ok { background: var(--ix-ok); }
.ix-tick-warn { background: var(--ix-warn); }
.ix-tick-fail { background: var(--ix-fail); height: 5px; width: 2px; margin-left: -1px; }
.ix-tick-ask { width: 6px; height: 6px; margin-left: -3px; top: -1px; border-radius: 1.5px; transform: rotate(45deg); background: var(--ix-warn); box-shadow: 0 0 0 2px rgb(var(--ix-warn-rgb) / 0.16); }
.ix-playhead-rail { position: absolute; left: 0; top: 19px; width: 100%; height: 14px; pointer-events: none; will-change: transform; }
.ix-scrub:not(.ix-has-labels) .ix-playhead-rail { top: 15px; }
.ix-playhead {
  position: absolute; left: -7px; top: 0;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--ix-thumb);
  box-shadow: 0 0 0 3px rgb(var(--ix-ink-rgb) / 0.12), 0 1px 4px rgb(var(--ix-shade-rgb) / 0.4);
  transition: transform var(--ix-dur-fast) var(--ix-ease), box-shadow var(--ix-dur-fast) var(--ix-ease);
}
.ix-scrub.ix-hovering .ix-playhead { box-shadow: 0 0 0 4px rgb(var(--ix-ink-rgb) / 0.16), 0 1px 4px rgb(var(--ix-shade-rgb) / 0.4); }
.ix.ix-scrubbing .ix-playhead { transform: scale(1.15); }
.ix-hoverline { position: absolute; left: 0; top: 18px; width: 1px; height: 16px; margin-left: -0.5px; background: rgb(var(--ix-ink-rgb) / 0.5); opacity: 0; pointer-events: none; transition: opacity var(--ix-dur-fast) var(--ix-ease); }
.ix-scrub:not(.ix-has-labels) .ix-hoverline { top: 14px; }
.ix-scrub.ix-hovering .ix-hoverline { opacity: 1; }
.ix.ix-scrubbing .ix-hoverline { opacity: 0; }

.ix-preview {
  position: absolute; left: 0; bottom: 100px; z-index: 20;
  width: 300px; padding: 10px 12px 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--ix-dur-fast) var(--ix-ease);
  text-align: left;
}
.ix-preview.ix-show { opacity: 1; }
.ix-preview-meta { font: 500 10px/14px var(--ix-font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ix-ink-muted); margin-bottom: 6px; }
.ix-preview-text {
  font-size: 13px; line-height: 19px; color: var(--ix-ink);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
}
.ix-preview-text .ix-chip { height: 18px; padding: 0 5px; border-radius: 5px; }
.ix-preview-text .ix-code-inline { padding: 1px 4px; }

.ix-count { grid-area: count; display: flex; align-items: baseline; gap: 6px; font: 500 12.5px/1 var(--ix-font-mono); font-variant-numeric: tabular-nums; color: var(--ix-ink-faint); white-space: nowrap; }
.ix-count-cur { color: var(--ix-ink); text-align: right; }
.ix-speed-wrap { grid-area: speed; position: relative; }
.ix-speed {
  height: 30px; min-width: 48px; padding: 0 10px; border-radius: 10px;
  font: 500 12.5px/30px var(--ix-font-mono); font-variant-numeric: tabular-nums;
  color: var(--ix-ink-muted);
  transition: background-color var(--ix-dur-fast) var(--ix-ease), color var(--ix-dur-fast) var(--ix-ease);
}
.ix-speed:hover, .ix-speed[aria-expanded="true"] { background: var(--ix-hover); color: var(--ix-ink); }
.ix-menu {
  position: absolute; right: 24px; bottom: 100px; z-index: 20;
  min-width: 112px; padding: 4px;
  opacity: 0; visibility: hidden;
  transform: translateY(4px) scale(0.98); transform-origin: bottom right;
  transition: opacity var(--ix-dur-fast) var(--ix-ease), transform var(--ix-dur-base) var(--ix-ease), visibility 0s linear var(--ix-dur-base);
}
.ix-menu.ix-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.ix-menu-item {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; height: 30px; padding: 0 8px 0 12px; border-radius: 9px;
  font: 500 12.5px/1 var(--ix-font-mono); font-variant-numeric: tabular-nums; color: var(--ix-ink-muted);
}
.ix-menu-item:hover, .ix-menu-item:focus-visible { background: var(--ix-hover); color: var(--ix-ink); outline: none; }
.ix-menu-check { opacity: 0; color: var(--ix-ink); }
.ix-menu-item[aria-checked="true"] { color: var(--ix-ink); }
.ix-menu-item[aria-checked="true"] .ix-menu-check { opacity: 1; }

/* ---------- inspector ---------- */
.ix-inspector {
  position: absolute; left: 0; top: 0; z-index: 25;
  width: max-content; min-width: 220px; max-width: 320px;
  padding: 12px 14px 14px;
  pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity var(--ix-dur-fast) var(--ix-ease), visibility 0s linear var(--ix-dur-fast);
  -webkit-user-select: text; user-select: text;
}
.ix-inspector.ix-show { opacity: 1; visibility: visible; transition-delay: 0s; }
.ix-inspector.ix-pinned { pointer-events: auto; }
.ix-insp-head { display: flex; align-items: center; gap: 10px; min-height: 20px; }
.ix-insp-kind { font: 500 10px/14px var(--ix-font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ix-ink-muted); }
.ix-insp-id { margin-left: auto; font: 400 11px/14px var(--ix-font-mono); color: var(--ix-ink-faint); }
.ix-pinned .ix-insp-head { margin-right: -6px; }
.ix-pinned .ix-close { margin: -4px 0 -4px -2px; }
.ix-insp-title { display: flex; align-items: center; margin-top: 6px; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--ix-ink); }
.ix-kv {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 20px;
  margin: 10px 0 0; padding-top: 10px;
  border-top: 1px solid var(--ix-hair);
  font: 400 11.5px/16px var(--ix-font-mono); font-variant-numeric: tabular-nums;
}
.ix-kv dt { color: var(--ix-ink-muted); white-space: nowrap; }
.ix-kv dd { margin: 0; color: var(--ix-ink); text-align: right; overflow-wrap: anywhere; display: flex; align-items: center; justify-content: flex-end; }
.ix-kv dd .ix-dot { margin-right: 6px; }
.ix-insp-title .ix-dot { margin-right: 8px; }

/* ---------- help ---------- */
.ix-help-scrim {
  position: absolute; inset: 0; z-index: 29;
  background: rgb(var(--ix-stage-rgb) / 0.45);
  opacity: 0; visibility: hidden;
  transition: opacity var(--ix-dur-base) var(--ix-ease), visibility 0s linear var(--ix-dur-base);
}
.ix-help-scrim.ix-open { opacity: 1; visibility: visible; transition-delay: 0s; }
.ix-help {
  position: absolute; left: 50%; top: 50%; z-index: 30;
  width: min(760px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto;
  padding: 0 24px 24px;
  opacity: 0; visibility: hidden;
  transform: translate(-50%, -48%) scale(0.985);
  transition: opacity var(--ix-dur-base) var(--ix-ease), transform var(--ix-dur-slow) var(--ix-ease), visibility 0s linear var(--ix-dur-slow);
}
.ix-help.ix-open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition-delay: 0s; }
.ix-help-head { display: flex; align-items: center; height: 56px; margin: 0 -10px 4px 0; }
.ix-help-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.ix-help-kicker { font: 500 10px/14px var(--ix-font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ix-ink-faint); margin: 8px 0 8px; }
.ix-help-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; border-top: 1px solid rgb(var(--ix-ink-rgb) / 0.05); }
.ix-help-what { font-size: 12.5px; color: var(--ix-ink-muted); }
.ix-help-keys { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.ix-kbd-sep { color: var(--ix-ink-faint); font: 500 11px var(--ix-font-mono); }

/* ---------- toast, tooltip, tags ---------- */
.ix-toast {
  position: absolute; left: 50%; top: calc(var(--ix-pad-t) + 48px); z-index: 40;
  display: flex; align-items: center; gap: 10px;
  width: max-content; max-width: min(480px, calc(100% - 32px));
  min-height: 36px; padding: 8px 14px 8px 12px; border-radius: 12px;
  font-size: 13px; line-height: 18px; color: var(--ix-ink);
  pointer-events: none;
  opacity: 0; visibility: hidden;
  transform: translate(-50%, -6px);
  transition: opacity var(--ix-dur-base) var(--ix-ease), transform var(--ix-dur-slow) var(--ix-ease), visibility 0s linear var(--ix-dur-slow);
}
.ix-toast.ix-show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; pointer-events: auto; }
.ix-toast-icon { color: var(--ix-ink-muted); display: inline-flex; }
.ix-toast .ix-close { margin: -4px -6px -4px 0; }

.ix-tip {
  position: absolute; left: 0; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px;
  height: 28px; padding: 0 6px 0 10px; border-radius: 9px;

  backdrop-filter: blur(10px) saturate(var(--ix-saturate));
  border: 1px solid var(--ix-glass-border);

  opacity: 0;
}
.ix-tag::after {
  content: ""; position: absolute; left: var(--cx); bottom: -5px;
  width: 8px; height: 8px; margin-left: -4px;
  background: var(--ix-glass);
  -webkit-backdrop-filter: blur(10px) saturate(var(--ix-saturate));
  backdrop-filter: blur(10px) saturate(var(--ix-saturate));
  border-right: 1px solid var(--ix-glass-border);
  border-bottom: 1px solid var(--ix-glass-border);
  border-bottom-right-radius: 2px;

.ix-tag-ok::before { background: var(--ix-ok); }

.ix-tag-warn::before { background: var(--ix-warn); }
