<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Explainers</title>
<meta name="description" content="Interactive, step-through explainers of data structures, algorithms and systems: linked lists, B+ trees, quicksort, virtual memory, the event loop, consistent hashing, MapReduce and Raft.">
<meta property="og:title" content="Interactive Explainers">
<meta property="og:description" content="Step through data structures, algorithms and distributed systems, one interactive explainer each.">
<style>
  :root { --bg:#f6f5f2; --fg:#16181d; --muted:#6b6f78; --rule:#dcdad4; --sel:#ebe8e1; --accent:#9a6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0d12; --fg:#ece8e1; --muted:#8a8f98; --rule:#23272f; --sel:#1a1e26; --accent:#ffd45a; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); display:flex;
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", sans-serif; }
  a { color:inherit; }
  aside { width:250px; flex:none; border-right:1px solid var(--rule); padding:26px 18px; overflow-y:auto; }
  h1 { font:400 26px/1.15 "Iowan Old Style", Palatino, Georgia, serif; margin:0 0 6px; }
  .lede { color:var(--muted); font-size:13.5px; margin:0 0 20px; }
  h2 { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:18px 0 4px; }
  nav a { display:block; padding:6px 10px; margin:0 -10px; border-radius:7px; text-decoration:none; }
  nav a:hover { color:var(--accent); }
  nav a[aria-current] { background:var(--sel); font-weight:600; }
  .more { margin-top:24px; font-size:13px; color:var(--muted); }
  .more a { display:block; margin-top:4px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 18px; border-bottom:1px solid var(--rule); }
  .bar b { font-weight:600; }
  .bar a { color:var(--muted); font-size:13px; white-space:nowrap; }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
  @media (max-width:760px) {
    body { flex-direction:column; }
    aside { width:auto; border-right:0; border-bottom:1px solid var(--rule); padding:16px 16px 10px; overflow:visible; }
    .lede, .more, h2 { display:none; }
    nav { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    nav a { margin:0; white-space:nowrap; border:1px solid var(--rule); border-radius:999px; padding:5px 12px; }
    main { min-height:80vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>Interactive Explainers</h1>
  <p class="lede">Step through how each one works.</p>
  <nav id="nav">
    <h2>Data structures</h2>
    <a href="#linked-list" data-title="Linked list">Linked list</a>
    <a href="#b-plus-tree" data-title="B+ tree">B+ tree</a>
    <h2>Algorithms</h2>
    <a href="#quicksort-partitioning" data-title="Quicksort">Quicksort</a>
    <h2>Systems</h2>
    <a href="#virtual-memory-page-walk" data-title="Virtual memory">Virtual memory</a>
    <a href="#javascript-event-loop" data-title="The event loop">The event loop</a>
    <h2>Distributed systems</h2>
    <a href="#consistent-hashing-ring" data-title="Consistent hashing">Consistent hashing</a>
    <a href="#mapreduce-cluster" data-title="MapReduce">MapReduce</a>
    <a href="#raft-consensus" data-title="Raft">Raft</a>
  </nav>
  <p class="more">More to learn:<a href="rl-videos.html">RL Videos</a><a href="paper-videos.html">Research Paper Videos</a></p>
</aside>
<main>
  <div class="bar"><b id="title"></b><a id="full" target="_blank" rel="noopener">Open full screen ↗</a></div>
  <iframe id="frame" title="Explainer"></iframe>
</main>
<script>
  const links = [...document.querySelectorAll("#nav a")];
  const frame = document.getElementById("frame"), full = document.getElementById("full"), title = document.getElementById("title");
  function show() {
    const id = location.hash.slice(1);
    const a = links.find(l => l.hash === "#" + id) || links[0];
    const src = "explainers/_" + a.hash.slice(1) + ".html";
    if (frame.getAttribute("src") !== src) frame.src = src;
    full.href = src; title.textContent = a.dataset.title;
    document.title = a.dataset.title + " · Interactive Explainers";
    links.forEach(l => l.toggleAttribute("aria-current", l === a));
    a.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
